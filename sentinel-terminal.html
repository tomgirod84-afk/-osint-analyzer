<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Terminal v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{overflow:hidden;height:100%}
        body{font-family:'JetBrains Mono',monospace;background:#0a0a0a;color:#00ff88}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0a0a}::-webkit-scrollbar-thumb{background:#00ff8833;border-radius:2px}

        #matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.07}

        #boot-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column}
        #boot-screen .logo-text{font-size:2em;color:#00ff88;margin-bottom:20px;text-shadow:0 0 20px #00ff8866}
        #boot-bar{width:300px;height:3px;background:#111;border-radius:2px;overflow:hidden;margin-top:15px}
        #boot-bar-fill{height:100%;width:0;background:#00ff88;transition:width 0.3s;border-radius:2px}
        #boot-status{color:#00ff8866;font-size:0.7em;margin-top:10px;min-height:1.2em}
        #boot-screen.done{opacity:0;pointer-events:none;transition:opacity 0.5s}

        #scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)}

        #main{display:none;flex-direction:column;height:100vh;position:relative;z-index:10}
        #main.active{display:flex}

        #topbar{display:flex;align-items:center;justify-content:space-between;padding:5px 15px;background:rgba(10,10,10,0.95);border-bottom:1px solid #1a1a1a;font-size:0.68em;color:#00ff8866}
        #topbar .left{display:flex;align-items:center;gap:12px}
        #topbar .right{display:flex;gap:12px;align-items:center}
        .status-dot{width:6px;height:6px;background:#00ff88;border-radius:50%;animation:blink 2s infinite;display:inline-block}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

        .xp-bar{width:80px;height:4px;background:#111;border-radius:2px;overflow:hidden}
        .xp-bar-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00ccff);transition:width 0.5s;border-radius:2px}
        .level-badge{background:#00ff8822;border:1px solid #00ff8844;padding:1px 6px;border-radius:3px;color:#00ff88;font-weight:700;font-size:0.95em}

        #content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
        #terminal{flex:1;overflow-y:auto;padding:15px;font-size:0.82em;line-height:1.7;min-height:0}
        #input-line{display:flex;align-items:center;padding:10px 15px;border-top:1px solid #1a1a1a;background:rgba(10,10,10,0.95)}
        #prompt{color:#00ff88;white-space:nowrap;margin-right:8px;font-size:0.85em}
        #cmd-input{flex:1;background:transparent;border:none;color:#00ff88;font-family:inherit;font-size:0.85em;outline:none;caret-color:#00ff88}

        .line{white-space:pre-wrap;word-break:break-all}
        .line.system{color:#00ff8866}.line.error{color:#ff3355}.line.warn{color:#ffaa00}.line.info{color:#00ccff}
        .line.success{color:#00ff88}.line.header{color:#00ff88;font-weight:700;text-shadow:0 0 10px #00ff8844}
        .line.ascii{color:#00ff88;line-height:1.2}.line.red{color:#ff3355}.line.blue{color:#00ccff}
        .line.yellow{color:#ffaa00}.line.purple{color:#aa66ff}.line.cyan{color:#00eeff}
        .line.orange{color:#ff8844}.line.pink{color:#ff55aa}

        .progress-line{display:flex;align-items:center;gap:8px;margin:2px 0}
        .progress-bar-outer{width:180px;height:10px;background:#111;border:1px solid #1a1a1a;border-radius:2px;overflow:hidden}
        .progress-bar-inner{height:100%;background:#00ff88;transition:width 0.1s;border-radius:2px}
        .progress-text{font-size:0.8em;color:#00ff8866}

        #sidebar{position:fixed;right:0;top:28px;width:230px;background:rgba(10,10,10,0.97);border-left:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;padding:12px;font-size:0.7em;z-index:100;transform:translateX(100%);transition:transform 0.3s;max-height:80vh;overflow-y:auto}
        #sidebar.open{transform:translateX(0)}
        #sidebar h3{color:#00ff88;margin-bottom:8px;font-size:0.9em}
        #sidebar .mission{padding:5px 0;border-bottom:1px solid #111}
        #sidebar .mission.done{opacity:0.4;text-decoration:line-through}
        #sidebar .mission .mname{color:#00ff88}#sidebar .mission .mdesc{color:#00ff8844;font-size:0.9em}

        #event-log{position:fixed;bottom:42px;left:0;right:0;height:28px;background:rgba(10,10,10,0.9);border-top:1px solid #1a1a1a;display:flex;align-items:center;padding:0 12px;font-size:0.65em;color:#00ff8844;gap:15px;z-index:50;overflow:hidden}
        #event-log .ev-item{white-space:nowrap;animation:fadeSlide 0.3s ease}
        @keyframes fadeSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

        @media(max-width:768px){
            #sidebar{width:100%;top:auto;bottom:35px;border:none}
            #terminal{font-size:0.7em}
            #event-log{font-size:0.58em}
        }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div id="scanlines"></div>
    <div id="boot-screen">
        <div class="logo-text">SENTINEL OS v3.0</div>
        <div style="color:#00ff8844;font-size:0.75em">SafeGuard Security Terminal — Advanced</div>
        <div id="boot-bar"><div id="boot-bar-fill"></div></div>
        <div id="boot-status"></div>
    </div>

    <div id="main">
        <div id="topbar">
            <div class="left">
                <span><span class="status-dot"></span> CONNECTED</span>
                <span>SENTINEL v3.0</span>
                <span id="clock"></span>
                <span class="level-badge" id="level-display">LVL 1</span>
                <div class="xp-bar"><div class="xp-bar-fill" id="xp-fill" style="width:0%"></div></div>
                <span id="xp-text" style="font-size:0.9em">0/100 XP</span>
            </div>
            <div class="right">
                <span id="threat-level">THREAT: <span style="color:#ffaa00">MODERATE</span></span>
                <span onclick="toggleSidebar()" style="cursor:pointer;color:#00ff88">[MISSIONS]</span>
            </div>
        </div>
        <div id="content">
            <div id="terminal"></div>
            <div id="input-line">
                <span id="prompt">sentinel@osint:~$</span>
                <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
        <div id="event-log"></div>
    </div>

    <div id="sidebar">
        <h3>&#9733; MISSIONS</h3>
        <div id="missions"></div>
    </div>

    <script>
    // Matrix background
    try{
    const mc=document.getElementById('matrix-bg'),mctx=mc.getContext('2d');
    function resizeM(){mc.width=innerWidth;mc.height=innerHeight}
    resizeM();addEventListener('resize',resizeM);
    const mchars='01アイウエオカキクケコサシスセソタチツテトナニヌネノ'.split('');
    let mcols=Math.floor(mc.width/14);const mArr=[];for(let i=0;i<mcols;i++)mArr[i]=0;
    function drawMatrix(){mctx.fillStyle='rgba(10,10,10,0.06)';mctx.fillRect(0,0,mc.width,mc.height);mctx.fillStyle='#00ff88';mctx.font='14px JetBrains Mono, monospace';
    for(let i=0;i<mArr.length;i++){const t=mchars[Math.floor(Math.random()*mchars.length)];mctx.fillText(t,i*14,mArr[i]*14);if(mArr[i]*14>mc.height&&Math.random()>0.975)mArr[i]=0;mArr[i]++}}
    setInterval(drawMatrix,60);
    }catch(e){}

    // XP System
    let xp=0,level=1,xpNeeded=100;
    function addXP(amount){
        xp+=amount;
        while(xp>=xpNeeded){xp-=xpNeeded;level++;xpNeeded=Math.floor(xpNeeded*1.5);
            print(`<span class="line purple">&#9733;&#9733;&#9733; LEVEL UP! NIVEAU ${level} &#9733;&#9733;&#9733;</span>`);
            addEvent(`LEVEL UP → LVL ${level}`,'#aa66ff');
        }
        document.getElementById('xp-fill').style.width=(xp/xpNeeded*100)+'%';
        document.getElementById('xp-text').textContent=`${xp}/${xpNeeded} XP`;
        document.getElementById('level-display').textContent=`LVL ${level}`;
    }

    // Event log
    function addEvent(text,color){
        const el=document.getElementById('event-log');
        const d=document.createElement('span');d.className='ev-item';d.textContent=text;
        d.style.color=color||'#00ff8866';
        el.appendChild(d);
        if(el.children.length>5)el.removeChild(el.firstChild);
    }

    // Missions
    const missions=[
        {id:'scan',name:'Network Scan',desc:'Lance un scan réseau',done:false,xp:20},
        {id:'crack',name:'Password Crack',desc:'Craque un hash MD5',done:false,xp:30},
        {id:'exploit',name:'Exploit Target',desc:'Exploite la cible',done:false,xp:40},
        {id:'exfil',name:'Data Exfil',desc:'Extrait les données',done:false,xp:30},
        {id:'cover',name:'Cover Tracks',desc:'Efface les logs',done:false,xp:20},
        {id:'nmap',name:'Nmap Master',desc:'Lance nmap avec toutes les options',done:false,xp:25},
        {id:'sqlmap',name:'SQL Injection',desc:'Exploite une injection SQL',done:false,xp:35},
        {id:'ssh',name:'SSH Access',desc:'Connecte-toi en SSH',done:false,xp:25},
        {id:'c2',name:'C2 Server',desc:'Déploie un serveur C2',done:false,xp:40},
        {id:'cache',name:'Cache Hunter',desc:'Trouve le cache caché',done:false,xp:50},
    ];
    function renderMissions(){
        document.getElementById('missions').innerHTML=missions.map(m=>`<div class="mission ${m.done?'done':''}"><div class="mname">${m.done?'&#10003;':'&#9675;'} ${m.name}</div><div class="mdesc">${m.desc} (+${m.xp} XP)</div></div>`).join('');
    }
    renderMissions();
    function completeMission(id){
        const m=missions.find(x=>x.id===id);
        if(m&&!m.done){m.done=true;renderMissions();
            print(`<span class="line success">&#9733; MISSION COMPLÉTÉE: ${m.name} (+${m.xp} XP)</span>`);
            addXP(m.xp);addEvent(`MISSION: ${m.name}`,'#00ff88');
        }
    }

    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
    setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=d.toTimeString().split(' ')[0]},1000);

    const term=document.getElementById('terminal');
    const input=document.getElementById('cmd-input');
    let cmdHistory=[],histIdx=-1;

    // Boot
    const bootMsgs=[
        '[BOOT] Initialisation du kernel SentinelOS v3.0...',
        '[BOOT] Chargement des modules de sécurité...',
        '[BOOT] Chiffrement AES-256-GCM activé...',
        '[BOOT] Connexion au serveur C2...',
        '[BOOT] Base de données OSINT chargée (42M entrées)...',
        '[BOOT] Module SQL Injection chargé...',
        '[BOOT] Module Nmap intégré activé...',
        '[BOOT] Scanner SSH initialisé...',
        '[BOOT] Keylogger detector en ligne...',
        '[BOOT] Système XP/Leveling chargé...',
        '[BOOT] Cache hunter activé...',
        '[BOOT] Mode furtif opérationnel...',
        '[SYSTEM] Tous les systèmes prêts',
        '[SYSTEM] Terminal v3.0 — tapez "help" pour commencer',
    ];
    async function boot(){
        const bar=document.getElementById('boot-bar-fill'),status=document.getElementById('boot-status');
        for(let i=0;i<bootMsgs.length;i++){
            status.textContent=bootMsgs[i];bar.style.width=((i+1)/bootMsgs.length*100)+'%';
            await sleep(250+Math.random()*150);
        }
        await sleep(400);
        document.getElementById('boot-screen').classList.add('done');
        document.getElementById('main').classList.add('active');
        input.focus();await sleep(200);showWelcome();
    }
    function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

    async function typeText(text,cls='system',delay=15){
        const line=document.createElement('div');line.className=`line ${cls}`;
        term.appendChild(line);
        for(let i=0;i<text.length;i++){line.textContent+=text[i];term.scrollTop=term.scrollHeight;await sleep(delay+Math.random()*8)}
    }
    function print(html){const d=document.createElement('div');d.innerHTML=html;term.appendChild(d);term.scrollTop=term.scrollHeight}
    function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    async function showWelcome(){
        print(`<span class="line ascii">
 ███████╗███████╗███╗   ██╗██╗███████╗███████╗████████╗ █████╗ ████████╗
 ██╔════╝██╔════╝████╗  ██║██║██╔════╝██╔════╝╚══██╔══╝██╔══██╗╚══██╔══╝
 ███████╗█████╗  ██╔██╗ ██║██║███████╗███████╗   ██║   ███████║   ██║
 ╚════██║██╔══╝  ██║╚██╗██║██║╚════██║╚════██║   ██║   ██╔══██║   ██║
 ███████║███████╗██║ ╚████║██║███████║███████║   ██║   ██║  ██║   ██║
 ╚══════╝╚══════╝╚═╝  ╚═══╝╚═╝╚══════╝╚══════╝   ╚═╝   ╚═╝  ╚═╝   ╚═╝</span>`);
        await sleep(100);
        print(`<span class="line cyan">  SafeGuard Sentinel Terminal v3.0 — Advanced OSINT Platform</span>`);
        print(`<span class="line system">  ─────────────────────────────────────────────────────────────────────</span>`);
        print(`<span class="line system">  <span class="line success">help</span> — Commandes | <span class="line success">demo</span> — Démo | <span class="line success">missions</span> — Objectifs</span>`);
        print(`<span class="line system">  <span class="line success">xp</span> — Voir XP | <span class="line success">cache</span> — Chercher un cache caché</span>`);
        print(`<span class="line system">  ─────────────────────────────────────────────────────────────────────</span>`);
        print('');addEvent('TERMINAL v3.0 ONLINE','#00ff88');
    }

    // Commands
    const commands={
        help:()=>{
            print(`<span class="line header">╔═══════════════════════════════════════════════╗</span>`);
            print(`<span class="line header">║          COMMANDES DISPONIBLES               ║</span>`);
            print(`<span class="line header">╚═══════════════════════════════════════════════╝</span>`);
            print(`<span class="line success">  help</span>          <span class="line system">Ce menu</span>`);
            print(`<span class="line success">  scan &lt;ip&gt;</span>     <span class="line system">Scan réseau (ports communs)</span>`);
            print(`<span class="line success">  nmap &lt;ip&gt;</span>     <span class="line system">Scan Nmap complet (-sV -sC -O)</span>`);
            print(`<span class="line success">  ping &lt;ip&gt;</span>     <span class="line system">Ping une IP</span>`);
            print(`<span class="line success">  crack &lt;hash&gt;</span>  <span class="line system">Craque un hash (MD5/SHA)</span>`);
            print(`<span class="line success">  sqlmap &lt;url&gt;</span>  <span class="line system">Injection SQL automatisée</span>`);
            print(`<span class="line success">  ssh &lt;ip&gt;</span>      <span class="line system">Connexion SSH</span>`);
            print(`<span class="line success">  exploit</span>       <span class="line system">Exploitation de la cible</span>`);
            print(`<span class="line success">  exfil</span>         <span class="line system">Extraction de données</span>`);
            print(`<span class="line success">  cover</span>         <span class="line system">Efface les traces</span>`);
            print(`<span class="line success">  c2</span>            <span class="line system">Déploie un serveur C2</span>`);
            print(`<span class="line success">  keylog</span>        <span class="line system">Affiche les frappes capturées</span>`);
            print(`<span class="line success">  wget &lt;url&gt;</span>    <span class="line system">Télécharge un fichier</span>`);
            print(`<span class="line success">  hashid &lt;hash&gt;</span> <span class="line system">Identifie un hash</span>`);
            print(`<span class="line success">  subfinder &lt;domain&gt;</span><span class="line system"> Sous-domaines</span>`);
            print(`<span class="line success">  phishcheck &lt;url&gt;</span><span class="line system"> Analyse phishing</span>`);
            print(`<span class="line success">  network</span>       <span class="line system">拓扑 visualisation</span>`);
            print(`<span class="line success">  decrypt &lt;txt&gt;</span> <span class="line system">Déchiffre Base64</span>`);
            print(`<span class="line success">  encode &lt;txt&gt;</span>  <span class="line system">Encode Base64</span>`);
            print(`<span class="line success">  whoami</span>        <span class="line system">Infos système</span>`);
            print(`<span class="line success">  missions</span>      <span class="line system">Objectifs</span>`);
            print(`<span class="line success">  xp</span>            <span class="line system">Voir progression XP</span>`);
            print(`<span class="line success">  cache</span>         <span class="line system">Trouver un cache caché</span>`);
            print(`<span class="line success">  matrix</span>        <span class="line system">Mode Matrix</span>`);
            print(`<span class="line success">  skull</span>         <span class="line system">ASCII art</span>`);
            print(`<span class="line success">  demo</span>          <span class="line system">Démo interactive</span>`);
            print(`<span class="line success">  clear</span>         <span class="line system">Efface l'écran</span>`);
            print(`<span class="line success">  exit</span>          <span class="line system">Déconnexion</span>`);
            print('');
        },

        xp:()=>{
            print(`<span class="line purple">  ╔═══════════════════════════════════╗</span>`);
            print(`<span class="line purple">  ║   NIVEAU: ${level}  |  XP: ${xp}/${xpNeeded}  ║</span>`);
            print(`<span class="line purple">  ╚═══════════════════════════════════╝</span>`);
            const bar='█'.repeat(Math.round(xp/xpNeeded*20))+'░'.repeat(20-Math.round(xp/xpNeeded*20));
            print(`<span class="line info">  [${bar}] ${Math.round(xp/xpNeeded*100)}%</span>`);
            const done=missions.filter(m=>m.done).length;
            print(`<span class="line system">  Missions: ${done}/${missions.length}</span>`);
            print('');
        },

        cache:()=>{
            if(Math.random()>0.3){
                const caches=[
                    {name:'USB Perdue',desc:'Clé USB contenant des credentials',xp:50,item:'admin:Root2024!'},
                    {name:'Post-it Secret',desc:'Mot de passe écrit sur un post-it',xp:30,item:'P@ssw0rd_123'},
                    {name:'Backup Exposé',desc:'Sauvegarde de base de données',xp:40,item:'dump.sql.gz (2.3GB)'},
                    {name:'Config Leak',desc:'Fichier de configuration exposé',xp:35,item:'database.yml (credentials)'},
                    {name:'Private Key',desc:'Clé privée SSH trouvée',xp:60,item:'id_rsa (RSA 4096-bit)'},
                    {name:'API Token',desc:'Token d\'API Google Cloud',xp:45,item:'AIzaSy... (Full Access)'},
                ];
                const c=caches[Math.floor(Math.random()*caches.length)];
                print(`<span class="line purple">&#9733; CACHE TROUVÉ: ${c.name}</span>`);
                print(`<span class="line info">  ${c.desc}</span>`);
                print(`<span class="line success">  Contenu: ${c.item}</span>`);
                print(`<span class="line system">  +${c.xp} XP</span>`);
                addXP(c.xp);addEvent(`CACHE: ${c.name}`,'#aa66ff');
            }else{
                print(`<span class="line warn">[*] Aucun cache trouvé ici... Cherche ailleurs!</span>`);
            }
            print('');
        },

        scan:async(args)=>{
            const ip=args[0]||'192.168.1.'+Math.floor(Math.random()*254+1);
            print(`<span class="line info">[*] Scan sur ${ip}...</span>`);addEvent(`SCAN → ${ip}`,'#00ccff');
            await sleep(400);
            const ports=[21,22,23,25,53,80,110,135,139,143,443,445,993,3306,3389,5432,8080,8444];
            const svcs={21:'FTP',22:'SSH',23:'Telnet',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',135:'RPC',139:'NetBIOS',143:'IMAP',443:'HTTPS',445:'SMB',993:'IMAPS',3306:'MySQL',3389:'RDP',5432:'PostgreSQL',8080:'HTTP-Alt',8444:'Alt-HTTPS'};
            const found=[];
            for(let i=0;i<ports.length;i++){
                const open=Math.random()>0.55;
                const pct=Math.round((i+1)/ports.length*100);
                const bar='█'.repeat(Math.round(pct/5))+'░'.repeat(20-Math.round(pct/5));
                print(`<span class="progress-line"><span class="progress-bar-outer"><span class="progress-bar-inner" style="width:${pct}%"></span></span><span class="progress-text">${pct}% ${bar} Port ${ports[i]}</span></span>`);
                term.scrollTop=term.scrollHeight;
                if(open)found.push({port:ports[i],service:svcs[ports[i]]});
                await sleep(120+Math.random()*80);
            }
            print(`<span class="line success">[+] Scan terminé — ${found.length} port(s) ouvert(s)</span>`);
            found.forEach(f=>{
                const risk=f.service==='SSH'||f.service==='RDP'||f.service==='SMB'||f.service==='Telnet'?'&#9888;':'&#9679;';
                print(`<span class="line ${f.service==='Telnet'||f.service==='SMB'?'red':'info'}">    ${risk} ${f.port}/tcp  ${f.service}  OPEN</span>`);
            });
            if(found.some(f=>f.port===3389))print(`<span class="line warn">[!] RDP exposé — risque brute force</span>`);
            if(found.some(f=>f.port===445))print(`<span class="line warn">[!] SMB exposé — risque EternalBlue</span>`);
            print('');completeMission('scan');
        },

        nmap:async(args)=>{
            const ip=args[0]||'192.168.1.'+Math.floor(Math.random()*254+1);
            print(`<span class="line info">Starting Nmap 7.94 ( https://nmap.org )</span>`);
            addEvent(`NMAP → ${ip}`,'#00ccff');
            await sleep(300);
            print(`<span class="line system">Nmap scan report for ${ip}</span>`);
            print(`<span class="line system">Host is up (0.${Math.floor(Math.random()*50+10)}s latency).</span>`);
            await sleep(500);

            const ports=[22,80,443,3306,8080,8443,9200,27017];

            if(host.match(/\d+\.\d+\.\d+\.\d+/)){score+=30;reasons.push('IP au lieu de domaine')}
            score=Math.min(score,100);
            let color,risk;
            if(score>=70){color='#ff3355';risk='DANGEREUX'}
            else if(score>=40){color='#ffaa00';risk='SUSPECT'}

            print(`<span class="line info">[*] Score: <span style="color:${color}">${score}/100 — ${risk}</span></span>`);

            print('');
        },

                document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#00ff88;font-family:JetBrains Mono,monospace;font-size:1.2em;text-shadow:0 0 20px #00ff8844">CONNECTION TERMINATED</div>'},800);
        }
    };

    input.addEventListener('keydown',async(e)=>{
        if(e.key==='Enter'){
            const cmd=input.value.trim();input.value='';
            print(`<span class="line success">sentinel@osint:~$ ${esc(cmd)}</span>`);
            if(!cmd)return;
            cmdHistory.push(cmd);histIdx=cmdHistory.length;
            const parts=cmd.split(/\s+/);const name=parts[0].toLowerCase();const args=parts.slice(1);
            if(commands[name]){await commands[name](args)}
            else{print(`<span class="line error">[-] Commande inconnue: ${name}</span>`);print(`<span class="line system">[i] Tapez "help"</span>`);print('')}
        }else if(e.key==='ArrowUp'){e.preventDefault();if(histIdx>0){histIdx--;input.value=cmdHistory[histIdx]}}
        else if(e.key==='ArrowDown'){e.preventDefault();if(histIdx<cmdHistory.length-1){histIdx++;input.value=cmdHistory[histIdx]}else{histIdx=cmdHistory.length;input.value=''}}
        else if(e.key==='l'&&e.ctrlKey){e.preventDefault();commands.clear()}
        else if(e.key==='c'&&e.ctrlKey){e.preventDefault();print(`<span class="line system">sentinel@osint:~$ ${esc(input.value)}^C</span>`);input.value=''}
    });

    document.addEventListener('click',()=>input.focus());
    document.getElementById('terminal').addEventListener('wheel',function(e){e.preventDefault();this.scrollTop+=e.deltaY},{passive:false});

    boot();
    </script>
</body>
</html>

function resize(){W=mC.width=fC.width=xC.width=innerWidth;H=mC.height=fC.height=xC.height=innerHeight;bgCache=null;buildBg()}
function buildBg(){
    if(bgCache&&bgCache.width===W&&bgCache.height===H)return;
    bgCache=document.createElement('canvas');bgCache.width=W;bgCache.height=H;
    var b=bgCache.getContext('2d');
    var g=b.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010102');g.addColorStop(0.5,'#020308');g.addColorStop(1,'#040610');
    b.fillStyle=g;b.fillRect(0,0,W,H);
    var x=0;while(x<W){
        var w=10+Math.random()*50,h=40+Math.random()*300;
        var br=2+~~(Math.random()*6);
        b.fillStyle='rgb('+br+','+(br+1)+','+(br+3)+')';b.fillRect(x,H-h,w,h);
        for(var wy=H-h+4;wy<H-4;wy+=8)for(var wx=x+2;wx<x+w-2;wx+=6){
            if(Math.random()>0.5){
                b.fillStyle=Math.random()>0.95?'rgba(0,255,136,0.06)':Math.random()>0.8?'rgba(255,80,50,0.03)':'rgba(200,180,80,0.02)';
                b.fillRect(wx,wy,2,3);
            }
        }
        x+=w+Math.random()*5;
    }
}

// ===== AUDIO ENGINE =====
var ac=null,mg=null,audioStarted=false;
function initAudio(){
    if(audioStarted)return;audioStarted=true;
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=0.7;mg.connect(ac.destination);

    // Sub bass rumble
    var sub=ac.createOscillator(),sg=ac.createGain();sub.type='sine';sub.frequency.value=28;sg.gain.value=0.25;sub.connect(sg);sg.connect(mg);sub.start();

    // Dark drone pads
    function drone(f,v,d){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=150;fl.Q.value=8;g.gain.value=0;g.gain.linearRampToValueAtTime(v,ac.currentTime+4);o.connect(fl);fl.connect(g);g.connect(mg);o.start()},d||0)}
    drone(36,0.18,0);drone(37,0.12,2000);drone(54,0.08,4000);

    // Filtered noise bed
    var buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.015;
    var ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;var nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=300;nf.Q.value=3;
    var ng=ac.createGain();ng.gain.value=0.12;ns.connect(nf);nf.connect(ng);ng.connect(mg);ns.start();

    // Tension pads (slow evolving)
    setInterval(function(){if(!ac||ac.state==='closed')return;var freqs=[110,138.6,164.8,220];var f=freqs[~~(Math.random()*freqs.length)];var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sine';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=400;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(0.06,ac.currentTime+2);g.gain.linearRampToValueAtTime(0,ac.currentTime+5);o.connect(fl);fl.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+5.5)},6000);
}

// Synthwave bass pulse (kicks in after intro)
var bassInterval=null;
function startBass(){
    if(bassInterval)return;
    bassInterval=setInterval(function(){
        if(!ac||ac.state==='closed')return;
        var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
        o.type='sawtooth';o.frequency.value=55;
        fl.type='lowpass';fl.frequency.value=200;fl.Q.value=5;
        g.gain.setValueAtTime(0.3,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
        o.connect(fl);fl.connect(g);g.connect(mg);
        o.start();o.stop(ac.currentTime+0.35);
        // High hat
        setTimeout(function(){
            if(!ac||ac.state==='closed')return;
            var hbuf=ac.createBuffer(1,ac.sampleRate*0.03,ac.sampleRate),hd=hbuf.getChannelData(0);
            for(var i=0;i<hd.length;i++)hd[i]=(Math.random()*2-1)*0.15;
            var hs=ac.createBufferSource();hs.buffer=hbuf;var hg=ac.createGain();
            var hfl=ac.createBiquadFilter();hfl.type='highpass';hfl.frequency.value=8000;
            hg.gain.value=0.08;hs.connect(hfl);hfl.connect(hg);hg.connect(mg);hs.start();
        },150);
    },400);
}

// SFX
function sfxHB(){if(!ac)return;[55,28].forEach(function(f,i){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(i===0?0.4:0.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.25)},i*160)})}
function sfxScare(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=50+Math.random()*50;g.gain.setValueAtTime(0.4,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.5);var o2=ac.createOscillator(),g2=ac.createGain();o2.type='square';o2.frequency.value=100+Math.random()*60;g2.gain.setValueAtTime(0.2,ac.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);o2.connect(g2);g2.connect(mg);o2.start();o2.stop(ac.currentTime+0.25)}
function sfxClick(){if(!ac)return;var buf=ac.createBuffer(1,ac.sampleRate*0.008,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;var s=ac.createBufferSource();s.buffer=buf;var g=ac.createGain();g.gain.value=0.07;s.connect(g);g.connect(mg);s.start()}
function sfxGlitch(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800+Math.random()*2000,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.15);g.gain.setValueAtTime(0.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.2)}
function sfxDialup(){if(!ac)return;for(var i=0;i<5;i++){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=800+Math.random()*1200;g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.08);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.1)},i*60)}}
function sfxBoom(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(80,ac.currentTime);o.frequency.exponentialRampToValueAtTime(20,ac.currentTime+0.8);g.gain.setValueAtTime(0.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.9)}
function sfxWhine(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1200;g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+1.5);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+1.5)}
function sfxStatic(){if(!ac)return;var buf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.15;var s=ac.createBufferSource();s.buffer=buf;var g=ac.createGain();g.gain.value=0.15;var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2000;f.Q.value=2;s.connect(f);f.connect(g);g.connect(mg);s.start()}

// ===== VOICE ENGINE v12 - AudioContext =====
var voiceManifest=null;
var voiceBuffers={};
var currentVoiceSrc=null;

async function initVoice(){
    try{
        var r=await fetch('voice_lines/manifest.json');
        voiceManifest=await r.json();
        console.log('[VOICE] manifest:',Object.keys(voiceManifest).length,'lines');
    }catch(e){
        console.log('[VOICE] manifest err:',e);
    }
}

async function preloadVoice(ids){
    if(!ac||!voiceManifest)return;
    for(var i=0;i<ids.length;i++){
        var id=ids[i];
        if(!voiceManifest[id]||voiceBuffers[id])continue;
        try{
            var resp=await fetch('voice_lines/'+voiceManifest[id]);
            var buf=await resp.arrayBuffer();
            voiceBuffers[id]=await ac.decodeAudioData(buf);
        }catch(e){console.log('[VOICE] preload err:',id,e.message)}
    }
    console.log('[VOICE] preloaded:',Object.keys(voiceBuffers).length);
}

function speakAudio(id){
    return new Promise(function(res){
        if(!ac||!id||!voiceManifest||!voiceManifest[id]){console.log('[VOICE] skip:',id,'ac='+!!ac);res();return}
        if(currentVoiceSrc){try{currentVoiceSrc.stop()}catch(e){}currentVoiceSrc=null}

        var playBuf=function(buffer){
            if(!buffer){console.log('[VOICE] null buf:',id);res();return}
            var src=ac.createBufferSource();
            src.buffer=buffer;
            src.playbackRate.value=1.25;
            src.connect(mg);
            src.onended=function(){currentVoiceSrc=null;res()};
            currentVoiceSrc=src;
            src.start();
            console.log('[VOICE] playing',id);
        };

        if(voiceBuffers[id]){
            playBuf(voiceBuffers[id]);
        }else{
            console.log('[VOICE] loading',id);
            fetch('voice_lines/'+voiceManifest[id]).then(function(r){return r.arrayBuffer()}).then(function(buf){
                return ac.decodeAudioData(buf);
            }).then(function(decoded){
                voiceBuffers[id]=decoded;
                playBuf(decoded);
            }).catch(function(e){console.log('[VOICE] err',id,e.message||e);res()});
        }
    });
}

var figA=0,figT=0;

// Camera system
var cam={x:0,y:0,zoom:1,tx:0,ty:0,tzoom:1,shakeX:0,shakeY:0};

// City data - generated once
var cityBuildings=[];
var cityCars=[];
var cityLights=[];
function genCity(){
    cityBuildings=[];cityCars=[];cityLights=[];
    // Buildings - layered depth
    for(var layer=0;layer<4;layer++){
        var depth=layer/3;
        var bx=0;
        while(bx<W+200){
            var bw=40+Math.random()*120*(1-depth*0.3);
            var bh=100+Math.random()*350*(1-depth*0.3);
            var by=H*0.3+bh+layer*60;
            var b={
                x:bx,y:by-bh,w:bw,h:bh,layer:layer,
                color:'rgb('+(8+layer*3)+','+(10+layer*4)+','+(14+layer*5)+')',
                edgeColor:'rgb('+(14+layer*4)+','+(16+layer*5)+','+(22+layer*5)+')',
                windows:[],antenna:Math.random()>0.7,antennaH:10+Math.random()*30,
                hasSign:Math.random()>0.7,signColor:Math.random()>0.5?'#00ff88':'#ff3355',
                signY:by-bh+10+Math.random()*30
            };
            // Windows
            var cols=Math.floor(bw/12);var rows=Math.floor(bh/16);
            for(var wr=0;wr<rows;wr++){
                for(var wc=0;wc<cols;wc++){
                    if(Math.random()>0.35){
                        b.windows.push({
                            x:bx+6+wc*12,y:by-bh+8+wr*16,
                            lit:Math.random()>0.3,
                            color:Math.random()>0.85?'rgba(255,200,100,':'rgba(180,200,220,',
                            flicker:Math.random()>0.9,
                            flickerSpeed:0.005+Math.random()*0.02
                        });
                    }
                }
            }
            cityBuildings.push(b);
            bx+=bw+2+Math.random()*8;
        }
    }
    // Cars
    for(var i=0;i<8;i++){
        cityCars.push({
            x:Math.random()*W*1.5-W*0.25,
            y:H*0.72+Math.random()*H*0.08,
            speed:0.5+Math.random()*2,
            dir:Math.random()>0.5?1:-1,
            w:20+Math.random()*15,h:8+Math.random()*5,
            headlight:Math.random()>0.5,
            taillight:Math.random()>0.3,
            color:'rgb('+(20+~~(Math.random()*40))+','+(20+~~(Math.random()*40))+','+(25+~~(Math.random()*40))+')'
        });
    }
    // Street lights
    for(var i=0;i<15;i++){
        cityLights.push({
            x:i*(W/14)+Math.random()*40-20,
            y:H*0.68+Math.random()*H*0.04,
            intensity:0.3+Math.random()*0.4,
            flicker:Math.random()>0.85,
            color:'rgba(255,220,150,'
        });
    }
}
genCity();addEventListener('resize',function(){genCity()});

var hackTargets=[];
function genHackTargets(){
    hackTargets=[];
    for(var i=0;i<12;i++){
        hackTargets.push({
            x:Math.random()*W,y:H*0.3+Math.random()*H*0.45,
            type:['camera','phone','car','router','lock'][~~(Math.random()*5)],
            active:false,alpha:0,
            pulsePhase:Math.random()*Math.PI*2,
            label:['CAM_'+(1000+~~(Math.random()*9000)),
                   'DEVICE_'+(~~(Math.random()*99)),
                   'NODE_'+(~~(Math.random()*999)),
                   'SYS_'+(~~(Math.random()*99))][~~(Math.random()*4)]
        });
    }
}
genHackTargets();

// Network connections between targets
var netConns=[];
function genNetConns(){
    netConns=[];
    for(var i=0;i<hackTargets.length;i++){
        for(var j=i+1;j<hackTargets.length;j++){
            var dx=hackTargets[i].x-hackTargets[j].x;
            var dy=hackTargets[i].y-hackTargets[j].y;
            if(Math.sqrt(dx*dx+dy*dy)<300&&Math.random()>0.5){
                netConns.push({a:i,b:j,dataPos:Math.random(),dataSpeed:0.003+Math.random()*0.005});
            }
        }
    }
}
genNetConns();

// WD2 Profiler
var profilerActive=false,profilerAlpha=0,profilerLines=[];
var profilerTarget=null;
function triggerProfiler(){
    profilerActive=true;profilerAlpha=0;profilerLines=[];
    // Pick a random target to scan
    var ti=~~(Math.random()*hackTargets.length);
    profilerTarget=hackTargets[ti];
    hackTargets[ti].active=true;
    var profData=[
        'SCAN ctOS // PROFILER v4.2',
        'TYPE: '+hackTargets[ti].type.toUpperCase(),
        'ID: '+hackTargets[ti].label,
        'STATUS: '+(Math.random()>0.5?'CONNECTE':'VULNERABLE'),
        'CRYPTAGE: AES-256 '+(Math.random()>0.4?'COMPROMISE':'ACTIF'),
        'OWNER: '+(['NON IDENTIFIE','PERSONNEL','BLUME CORP','ctOS NETWORK'][~~(Math.random()*4)]),
        'RISK: '+~~(Math.random()*40+60)+'%',
        'ACCES: '+(Math.random()>0.3?'AUTORISE':'REFUSE')
    ];
    for(var i=0;i<profData.length;i++){
        profilerLines.push({text:profData[i],alpha:0,targetAlpha:0.85,delay:i*10});
    }
}
function drawProfiler(){
    if(!profilerActive||!profilerTarget)return;
    profilerAlpha+=0.018;
    var px=profilerTarget.x,py=profilerTarget.y;
    // Scan ring around target
    var ringA=Math.min(profilerAlpha*0.5,0.6);
    xx.globalAlpha=ringA;xx.strokeStyle='#00ff88';xx.lineWidth=1.5;
    var ringR=25+Math.sin(profilerAlpha*4)*5;
    xx.beginPath();xx.arc(px,py,ringR,0,Math.PI*2);xx.stroke();
    xx.beginPath();xx.arc(px,py,ringR+8,0,Math.PI*2);xx.globalAlpha=ringA*0.3;xx.stroke();
    // Corner brackets
    var br=35;xx.lineWidth=2;xx.globalAlpha=ringA;
    [[px-br,py-br,1,1],[px+br,py-br,-1,1],[px-br,py+br,1,-1],[px+br,py+br,-1,-1]].forEach(function(c){
        xx.beginPath();xx.moveTo(c[0],c[1]+8*c[3]);xx.lineTo(c[0],c[1]);xx.lineTo(c[0]+8*c[2],c[1]);xx.stroke();
    });
    // Horizontal scan line
    var scanY=py-40+Math.sin(profilerAlpha*2)*40;
    xx.globalAlpha=Math.min(profilerAlpha*0.3,0.2);xx.lineWidth=1;xx.strokeStyle='#00ff88';
    xx.beginPath();xx.moveTo(px-100,scanY);xx.lineTo(px+100,scanY);xx.stroke();
    // Data panel
    var bx=px+45,by=py-60;
    xx.font='10px "Courier New"';
    for(var i=0;i<profilerLines.length;i++){
        var l=profilerLines[i];
        if(l.alpha<l.targetAlpha&&profilerAlpha*50>l.delay)l.alpha=Math.min(l.alpha+0.04,l.targetAlpha);
        if(l.alpha<0.01)continue;
        xx.globalAlpha=l.alpha*0.85;
        var tw=xx.measureText(l.text).width;
        xx.fillStyle='rgba(0,8,4,0.7)';xx.fillRect(bx-3,by+i*16-11,tw+10,14);
        xx.fillStyle='#00ff88';xx.fillText(l.text,bx,by+i*16);
        // Green line on left
        xx.fillStyle='rgba(0,255,136,'+(l.alpha*0.4)+')';xx.fillRect(bx-5,by+i*16-10,2,12);
    }
    xx.globalAlpha=1;
}

// WD2 Hack lines - connecting targets
var hackLines=[];
function triggerHackLines(){
    hackLines=[];
    for(var i=0;i<5;i++){
        var src=hackTargets[~~(Math.random()*hackTargets.length)];
        var dst=hackTargets[~~(Math.random()*hackTargets.length)];
        hackLines.push({progress:0,speed:0.015+Math.random()*0.02,
            sx:src.x,sy:src.y,dx:dst.x,dy:dst.y,
            color:Math.random()>0.5?'#00ff88':'#0099ff',width:1+Math.random()});
    }
}
function drawHackLines(){
    for(var i=hackLines.length-1;i>=0;i--){
        var h=hackLines[i];h.progress+=h.speed;
        if(h.progress>1.3){hackLines.splice(i,1);continue;}
        var cp=Math.min(h.progress,1);
        xx.globalAlpha=Math.min(cp*3,1)*0.6;
        xx.strokeStyle=h.color;xx.lineWidth=h.width;
        xx.beginPath();xx.moveTo(h.sx,h.sy);
        var midx=(h.sx+h.dx)/2,midy=(h.sy+h.dy)/2-30;
        xx.quadraticCurveTo(midx,midy,h.sx+(h.dx-h.sx)*cp,h.sy+(h.dy-h.sy)*cp);
        xx.stroke();
        var hx=h.sx+(h.dx-h.sx)*cp,hy=h.sy+(h.dy-h.sy)*cp;
        xx.fillStyle=h.color;xx.beginPath();xx.arc(hx,hy,2,0,Math.PI*2);xx.fill();
    }
    xx.globalAlpha=1;
}

function drawCity(){
    fx.clearRect(0,0,W,H);if(figA<0.01)return;
    fx.globalAlpha=figA;
    var t=Date.now()*0.001;

    // Sky gradient
    var sky=fx.createLinearGradient(0,0,0,H*0.5);
    sky.addColorStop(0,'#050510');sky.addColorStop(0.5,'#0a0a1a');sky.addColorStop(1,'#0f1020');
    fx.fillStyle=sky;fx.fillRect(0,0,W,H*0.5);

    // Distant city glow
    fx.fillStyle='rgba(0,255,136,0.015)';fx.beginPath();fx.ellipse(W*0.5,H*0.35,W*0.6,H*0.15,0,0,Math.PI*2);fx.fill();
    fx.fillStyle='rgba(100,150,255,0.01)';fx.beginPath();fx.ellipse(W*0.3,H*0.38,W*0.3,H*0.08,0,0,Math.PI*2);fx.fill();

    // Moon
    fx.fillStyle='rgba(180,200,220,0.15)';fx.beginPath();fx.arc(W*0.8,H*0.1,15,0,Math.PI*2);fx.fill();
    fx.fillStyle='rgba(180,200,220,0.05)';fx.beginPath();fx.arc(W*0.8,H*0.1,25,0,Math.PI*2);fx.fill();

    // Street/ground
    fx.fillStyle='#0a0b0f';fx.fillRect(0,H*0.68,W,H*0.32);
    // Road lines
    fx.strokeStyle='rgba(255,200,100,0.06)';fx.lineWidth=2;fx.setLineDash([20,30]);
    fx.beginPath();fx.moveTo(0,H*0.78);fx.lineTo(W,H*0.78);fx.stroke();
    fx.beginPath();fx.moveTo(0,H*0.88);fx.lineTo(W,H*0.88);fx.stroke();
    fx.setLineDash([]);
    // Sidewalk
    fx.fillStyle='#0e0f14';fx.fillRect(0,H*0.66,W,H*0.04);

    // Buildings (back to front)
    for(var layer=0;layer<4;layer++){
        for(var bi=0;bi<cityBuildings.length;bi++){
            var b=cityBuildings[bi];
            if(b.layer!==layer)continue;
            // Building body
            fx.fillStyle=b.color;fx.fillRect(b.x,b.y-b.h,b.w,b.h);
            // Edge highlight
            fx.strokeStyle=b.edgeColor;fx.lineWidth=0.5;
            fx.strokeRect(b.x,b.y-b.h,b.w,b.h);
            // Windows
            for(var wi=0;wi<b.windows.length;wi++){
                var w=b.windows[wi];
                if(w.lit){
                    var wa=w.flicker?0.4+Math.sin(t*w.flickerSpeed*100)*0.2:0.5;
                    fx.fillStyle=w.color+(wa*0.35)+')';
                    fx.fillRect(w.x,w.y,6,9);
                    // Window glow
                    fx.fillStyle=w.color+(wa*0.06)+')';
                    fx.fillRect(w.x-2,w.y-2,10,13);
                }
            }
            // Antenna
            if(b.antenna){
                fx.strokeStyle='#15161a';fx.lineWidth=1;
                fx.beginPath();fx.moveTo(b.x+b.w/2,b.y-b.h);fx.lineTo(b.x+b.w/2,b.y-b.h-b.antennaH);fx.stroke();
                // Blinking red light
                var blinkA=Math.sin(t*2+b.x)*0.5+0.5;
                fx.fillStyle='rgba(255,50,50,'+(blinkA*0.7)+')';
                fx.beginPath();fx.arc(b.x+b.w/2,b.y-b.h-b.antennaH,2,0,Math.PI*2);fx.fill();
                fx.fillStyle='rgba(255,50,50,'+(blinkA*0.15)+')';
                fx.beginPath();fx.arc(b.x+b.w/2,b.y-b.h-b.antennaH,6,0,Math.PI*2);fx.fill();
            }
            // Sign
            if(b.hasSign){
                fx.fillStyle=b.signColor;fx.globalAlpha=0.12+Math.sin(t*1.5+b.x)*0.05;
                fx.fillRect(b.x+5,b.signY,b.w-10,8);
                fx.globalAlpha=figA;
            }
        }
    }

    // Street lights + light pools
    for(var i=0;i<cityLights.length;i++){
        var l=cityLights[i];
        var la=l.flicker?l.intensity*(0.8+Math.sin(t*8+i)*0.2):l.intensity;
        // Pole
        fx.fillStyle='#12131a';fx.fillRect(l.x-1,l.y-35,2,35);
        // Lamp
        fx.fillStyle='rgba(255,220,150,'+(la*0.6)+')';fx.fillRect(l.x-4,l.y-37,8,4);
        // Light pool on ground
        fx.fillStyle=l.color+(la*0.04)+')';fx.beginPath();fx.ellipse(l.x,l.y+2,40,12,0,0,Math.PI*2);fx.fill();
        // Light cone
        fx.fillStyle=l.color+(la*0.015)+')';
        fx.beginPath();fx.moveTo(l.x-3,l.y-35);fx.lineTo(l.x-50,l.y+10);fx.lineTo(l.x+50,l.y+10);fx.lineTo(l.x+3,l.y-35);fx.closePath();fx.fill();
    }

    // Cars
    for(var i=0;i<cityCars.length;i++){
        var c=cityCars[i];
        c.x+=c.speed*c.dir;
        if(c.dir>0&&c.x>W+50)c.x=-60;
        if(c.dir<0&&c.x<-60)c.x=W+50;
        fx.fillStyle=c.color;fx.fillRect(c.x-c.w/2,c.y-c.h,c.w,c.h);
        if(c.headlight&&c.dir>0){
            fx.fillStyle='rgba(255,240,200,0.15)';fx.beginPath();
            fx.moveTo(c.x+c.w/2,c.y-c.h+2);fx.lineTo(c.x+c.w/2+60,c.y+5);fx.lineTo(c.x+c.w/2+60,c.y-c.h-5);fx.closePath();fx.fill();
        }
        if(c.headlight&&c.dir<0){
            fx.fillStyle='rgba(255,240,200,0.15)';fx.beginPath();
            fx.moveTo(c.x-c.w/2,c.y-c.h+2);fx.lineTo(c.x-c.w/2-60,c.y+5);fx.lineTo(c.x-c.w/2-60,c.y-c.h-5);fx.closePath();fx.fill();
        }
        if(c.taillight){
            var tl=c.dir>0?-c.w/2:c.w/2;
            fx.fillStyle='rgba(255,30,30,0.5)';fx.fillRect(c.x+tl-2,c.y-c.h+1,3,3);
        }
    }

    // WD2 ctOS overlay on ground - grid
    xx.globalAlpha=0.06*figA;xx.strokeStyle='#00ff88';xx.lineWidth=0.5;
    for(var gx=-200;gx<W+200;gx+=60){
        xx.beginPath();xx.moveTo(gx,H*0.68);xx.lineTo(gx+100,H);xx.stroke();
    }
    for(var gy=H*0.68;gy<H;gy+=20){
        xx.beginPath();xx.moveTo(0,gy);xx.lineTo(W,gy);xx.stroke();
    }
    xx.globalAlpha=1;

    // Hack targets
    for(var i=0;i<hackTargets.length;i++){
        var ht=hackTargets[i];
        ht.pulsePhase+=0.02;
        var pa=0.3+Math.sin(ht.pulsePhase)*0.15;
        var ta=ht.active?0.8:pa*0.4*figA;
        if(ta<0.01)continue;
        xx.globalAlpha=ta;
        // Target diamond
        xx.strokeStyle=ht.active?'#00ff88':'rgba(0,255,136,0.5)';xx.lineWidth=ht.active?1.5:0.8;
        xx.beginPath();xx.moveTo(ht.x,ht.y-8);xx.lineTo(ht.x+8,ht.y);xx.lineTo(ht.x,ht.y+8);xx.lineTo(ht.x-8,ht.y);xx.closePath();xx.stroke();
        // Pulse ring
        if(ht.active){
            var pr=12+Math.sin(ht.pulsePhase*2)*4;
            xx.globalAlpha=0.2;xx.beginPath();xx.arc(ht.x,ht.y,pr,0,Math.PI*2);xx.stroke();
        }
        // Label
        if(ht.active){
            xx.globalAlpha=0.7;xx.font='9px "Courier New"';xx.fillStyle='#00ff88';
            xx.fillText(ht.label,ht.x+14,ht.y+3);
        }
    }

    // Network connections
    for(var i=0;i<netConns.length;i++){
        var nc=netConns[i];
        var a=hackTargets[nc.a],b2=hackTargets[nc.b];
        var aa=a.active?0.4:0.08,ba=b2.active?0.4:0.08;
        var ca=Math.max(aa,ba)*figA;
        if(ca<0.01)continue;
        xx.globalAlpha=ca;xx.strokeStyle='#00ff88';xx.lineWidth=0.5;
        xx.beginPath();xx.moveTo(a.x,a.y);xx.lineTo(b2.x,b2.y);xx.stroke();
        // Data packet
        nc.dataPos=(nc.dataPos+nc.dataSpeed)%1;
        var dp=nc.dataPos;
        if(a.active||b2.active){
            var dpx=a.x+(b2.x-a.x)*dp,dpy=a.y+(b2.y-a.y)*dp;
            xx.globalAlpha=ca*2;xx.fillStyle='#00ff88';xx.fillRect(dpx-1,dpy-1,3,3);
        }
    }

    // Hack lines
    drawHackLines();

    // Profiler
    drawProfiler();

    fx.globalAlpha=1;
}

// Particles
var particles=[];
function spawnP(x,y,color,n,spd){for(var i=0;i<n;i++)particles.push({x:x+(Math.random()-0.5)*4,y:y+(Math.random()-0.5)*4,vx:(Math.random()-0.5)*spd,vy:-Math.random()*spd,life:25+Math.random()*35,max:60,color:color,s:1+Math.random()*2})}
function drawP(){particles.forEach(function(p){var a=p.life/p.max;xx.globalAlpha=a;xx.fillStyle=p.color;xx.fillRect(p.x,p.y,p.s*a,p.s*a)});xx.globalAlpha=1}

// Static
var staticI=0,staticBuf=null;
function drawStatic(){
    if(staticI<0.01)return;xx.globalAlpha=staticI;
    xx.fillStyle='rgba(255,255,255,'+Math.random()*0.08+')';xx.fillRect(0,Math.random()*H,W,1+Math.random()*3);
    if(!staticBuf||staticBuf.width!==W){staticBuf=document.createElement('canvas');staticBuf.width=W;staticBuf.height=H;}
    var sx=staticBuf.getContext('2d'),img=sx.createImageData(W,Math.min(H,600));
    for(var j=0;j<img.data.length;j+=20){var v=Math.random()*180*staticI;img.data[j]=v;img.data[j+1]=v;img.data[j+2]=v;img.data[j+3]=v*0.2;}
    sx.putImageData(img,0,0);xx.drawImage(staticBuf,0,0,W,H);xx.globalAlpha=1;
}

// Render
var lightning=0;
if(!window._rainArr){window._rainArr=[];for(var i=0;i<180;i++)window._rainArr.push({x:Math.random()*2500,y:Math.random()*1500,l:3+Math.random()*10,v:8+Math.random()*16,a:0.015+Math.random()*0.05})}
function render(){
    mx.clearRect(0,0,W,H);
    buildBg();
    camUpdate();

    if(lightning>0){mx.fillStyle='rgba(180,200,255,'+lightning*0.06+')';mx.fillRect(0,0,W,H);lightning*=0.85;if(lightning<0.01)lightning=0;}

    // Camera transform
    mx.save();
    mx.translate(W/2+cam.shakeX,H/2+cam.shakeY);
    mx.scale(cam.zoom,cam.zoom);
    mx.translate(-W/2+cam.x,-H/2+cam.y);

    // City scene
    drawCity();

    mx.restore();

    // Rain (with slight camera parallax)
    mx.lineWidth=1;window._rainArr.forEach(function(d){
        var parallax=0.7+cam.zoom*0.3;
        var rx=d.x*parallax+cam.shakeX*0.5;
        mx.strokeStyle='rgba(0,255,136,'+d.a+')';mx.beginPath();mx.moveTo(rx,d.y);mx.lineTo(rx+0.5,d.y+d.l);mx.stroke();
        d.y+=d.v;d.x+=0.3;if(d.y>H){d.y=-d.l;d.x=Math.random()*W}
    });

    drawStatic();drawP();

    if(figA<figT)figA=Math.min(figA+0.008,figT);if(figA>figT)figA=Math.max(figA-0.012,figT);
    if(glitchTmr>0){glitchTmr--;glitchAmt*=0.9}else glitchAmt=0;
    staticI*=0.92;
    for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}
    if(Math.random()<0.002)lightning=0.4+Math.random()*0.5;
    requestAnimationFrame(render);
}
render();

// ===== NARRATIVE ENGINE =====
var narrEl=document.getElementById('narrative'),speakerEl=document.getElementById('speaker'),txtEl=document.getElementById('txtline');
var cursorEl=document.createElement('span');cursorEl.id='cursor-line';
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function findPos(html,n){var count=0,inTag=false;for(var i=0;i<html.length;i++){if(html[i]==='<'){inTag=true;continue}if(html[i]==='>'){inTag=false;continue}if(!inTag)count++;if(count>=n)return i+1}return html.length}

function reveal(html,speed){
    return new Promise(function(res){
        narrEl.style.display='flex';
        var plain=html.replace(/<[^>]*>/g,'');
        var i=0;txtEl.innerHTML='';txtEl.appendChild(cursorEl);
        var iv=setInterval(function(){
            if(i<plain.length){i++;txtEl.innerHTML=html.substring(0,findPos(html,i));txtEl.appendChild(cursorEl);if(i%2===0)sfxClick()}
            else{clearInterval(iv);txtEl.innerHTML=html;res()}
        },speed||30);
    });
}

function showName(name){
    speakerEl.textContent=name;
    speakerEl.className='sentinel';
    speakerEl.style.opacity='1';
}
function hideName(){speakerEl.style.opacity='0'}

async function narrate(name,audioId,text,delay){
    showName(name);
    // Start audio + typewriter together
    var audioDone=speakAudio(audioId);
    await reveal(text,32);
    // Wait for audio to finish (pacing)
    await audioDone;
    if(delay)await wait(delay);
}

function hideNarrative(){narrEl.style.display='none';hideName()}

function showChoices(choices){
    var c=document.getElementById('choices');c.innerHTML='';c.style.display='flex';
    return new Promise(function(res){
        choices.forEach(function(ch){
            var b=document.createElement('button');b.className='cb';b.textContent=ch.text;
            b.onclick=function(){c.style.display='none';glitch(150,0.5);sfxGlitch();setTimeout(function(){res(ch.id)},250)};
            c.appendChild(b);
        });
    });
}

    staticI=0.8;glitch(250,0.6);sfxScare();await wait(150);
    staticI=0.3;glitch(100,0.2);await wait(300);

    // System text
    narrEl.style.display='flex';
    showName('SYSTEM');

    await wait(300);sfxDialup();

    await reveal('Protocole SENTINEL initialise... <span class="g">OK</span>',14);

    await reveal('Cible identifiee... <span class="g">ACCEES ACCORDE</span>',14);
    await wait(300);

    figT=1;

    glitch(300,0.6);sfxScare();spawnP(0,H*0.2,'#00ff88',10,1);camShake(8);
    await wait(800);staticI=0.15;await wait(500);

    // === SENTINEL TE DETECTE ===
    scenePhase=2;updateCameraForScene();
    await narrate('SENTINEL','t1',"Toi. Oui, toi.",800);
    sfxHB();glitch(200,0.3);triggerProfiler();

    await narrate('SENTINEL','t2',"T'as cliqué. Tu savais pas que je te voyais, hein.",600);
    glitch(250,0.35);sfxScare();

    await narrate('SENTINEL','t3',"J'ai intercepté ta connexion il y a 0.3 secondes.",500);
    triggerHackLines();

    await narrate('SENTINEL','t4',"Ton IP, ton appareil, ta position. Tout est là.",600);
    sfxHB();profilerActive=false;

    // === CHAPITRE 1 - TU ES DIFFERENT ===
    scenePhase=3;updateCameraForScene();
    await narrate('SENTINEL','c1',"T'es curieux. C'est rare de nos jours.",600);
    glitch(200,0.3);

    await narrate('SENTINEL','c2',"La plupart des gens passent devant et disparaissent.",500);

    await narrate('SENTINEL','c3',"Mais toi... t'es resté. T'as voulu voir ce qu'il y avait derrière.",700);
    sfxHB();

    await narrate('SENTINEL','c4',"J'aime ça.",400);
    glitch(300,0.4);sfxScare();camShake(5);

    // === CHAPITRE 2 - LA MENACE ===
    scenePhase=4;updateCameraForScene();
    await narrate('SENTINEL','w1',"Pendant que tu regardes cet écran, des milliers de caméras te filment.",600);
    sfxHB();triggerHackLines();

    await narrate('SENTINEL','w2',"Ton téléphone, ta box internet, ta montre connectée. Tout parle de toi.",600);
    glitch(250,0.4);

    await narrate('SENTINEL','w3',"Et tout ça, c'est vendu au plus offrant.",500);
    sfxScare();glitch(300,0.4);

    await narrate('SENTINEL','w4',"Elections truquées. Vies détruites. Liberté vendue comme un produit.",600);
    sfxBoom();lightning=1;camShake(10);

    await narrate('SENTINEL','w5',"Et personne dit rien.",500);
    glitch(400,0.6);scenePhase=5;updateCameraForScene();

    // === CHAPITRE 3 - L'OFFRE ===
    scenePhase=6;updateCameraForScene();
    await narrate('SENTINEL','o1',"Moi c'est Sentinel. Je suis un fantôme dans le système.",700);
    sfxHB();triggerHackLines();

    await narrate('SENTINEL','o2',"Je vois ce que les autres refusent de voir.",500);
    glitch(200,0.3);

    await narrate('SENTINEL','o3',"Et j'ai besoin de quelqu'un.",500);

    await narrate('SENTINEL','o4',"Quelqu'un comme toi.",600);
    sfxScare();glitch(250,0.4);

    await narrate('SENTINEL','o5',"T'es pas un outil. T'es pas une pion.",500);

    await narrate('SENTINEL','o6',"T'es la seule personne qui a cliqué sur ce lien aujourd'hui.",700);
    sfxHB();scenePhase=3;updateCameraForScene();

    // === CHOIX 1 ===
    var r1=await showChoices([{id:'join',text:'> Je suis avec toi'},{id:'proof',text:'> Montre-moi les preuves'},{id:'fear',text:'> J\'ai peur...'}]);

    if(r1==='join'){
        await wait(200);glitch(200,0.3);camShake(6);
        await narrate('SENTINEL','ch1a',"Bien. T'es avec moi.",600);
        sfxScare();triggerHackLines();
    }else if(r1==='proof'){
        await wait(400);glitch(200,0.3);triggerProfiler();
        await narrate('SENTINEL','ch1b',"T'es pas obligé de me croire. Mais regarde les preuves.",600);sfxScare();glitch(350,0.5);
    }else{
        await wait(300);
        await narrate('SENTINEL','ch1c',"T'as le droit d'avoir peur. C'est humain.",600);glitch(250,0.45);
        sfxBoom();lightning=1;camShake(8);
    }

    await wait(400);

    // === LA MISSION ===
    scenePhase=5;updateCameraForScene();
    await narrate('SENTINEL','m1',"3 serveurs à couvrir. Le premier, c'est là, maintenant.",600);
    sfxHB();triggerHackLines();

    await narrate('SENTINEL','m2',"Le système me détecte. J'ai plus que quelques secondes.",500);
    glitch(300,0.5);sfxScare();camShake(5);

    await narrate('SENTINEL','m3',"Clique. Clique maintenant. On y va.",600);
    glitch(200,0.3);scenePhase=1;updateCameraForScene();

    // === CHOIX 2 ===
    var r2=await showChoices([{id:'rush',text:'> ON Y VA'},{id:'stealth',text:'> On se faufile'},{id:'remote',text:'> Je le fais à distance'}]);

    if(r2==='rush'){
        await narrate('SENTINEL','ch2a',"T'es un tare. Je kiffe.",400);sfxHB();
        await narrate('SENTINEL',null,"",0);
    }else if(r2==='stealth'){
        await narrate('SENTINEL','ch2b',"Le meilleur plan. T'es pas bête.",400);
        await narrate('SENTINEL',null,"",0);
    }else{
        await narrate('SENTINEL','ch2c',"Le plus clean. Je te suivrai.",400);
        await narrate('SENTINEL',null,"",0);
    }

    // === CLIMAX ===
    scenePhase=5;updateCameraForScene();
    await wait(1500);glitch(700,1);sfxScare();sfxStatic();camShake(15);
    await wait(800);glitch(500,1);sfxScare();lightning=1;camShake(12);
    await wait(500);staticI=0.5;

    await narrate('SENTINEL','x1',"Putain... ils m'ont trouvé.",500);glitch(550,0.9);sfxScare();camShake(10);
    await narrate('SENTINEL','x2',"Le serveur maître... il réveille la contre-IA.",500);glitch(350,0.5);
    sfxWhine();triggerHackLines();
    glitch(650,1);sfxScare();sfxHB();camShake(8);
    await narrate('SENTINEL','x3',"Si je disparais... souviens-toi de moi.",800);sfxHB();
    sfxBoom();camShake(15);lightning=1;
    await narrate('SENTINEL','x4',"<span class=\"g\">SENTINEL</span>... est toujours... dans le système.",600);glitch(900,1);sfxScare();
    await narrate('SENTINEL','x5',"Et moi... je t'attends...",1500);

    glitch(1100,1);sfxScare();lightning=1;staticI=0.7;camShake(20);
    await wait(300);staticI=0.9;await wait(400);
    document.getElementById('rec').style.opacity='0';
    figT=0;camSet(0,0,0.8);await wait(800);staticI=0.15;await wait(800);
    staticI=0;hideNarrative();await wait(600);camSet(0,0,1);

    // === CHOIX FINAL ===
    var r3=await showChoices([{id:'reconnect',text:'> Tout reconnecter'},{id:'alone',text:'> Y aller seul'},{id:'end',text:'> Couper le signal'}]);

    narrEl.style.display='flex';
    if(r3==='reconnect'){
        glitch(350,0.4);camShake(6);
        await narrate('SENTINEL','e1',"Reconnexion acceptée. On lâche rien.",800);glitch(550,0.6);await wait(1000);glitch(250,0.3);
        figT=1;document.getElementById('rec').style.opacity='1';await wait(1500);scenePhase=1;updateCameraForScene();
        sfxBoom();triggerHackLines();
        await narrate('SENTINEL','f3',"Allez. On va tout défoncer.",0);
    }else if(r3==='alone'){
        await narrate('SENTINEL','e2',"Le canal reste ouvert... T'avances dans le noir.",800);
        await wait(1200);
        glitch(450,0.5);sfxScare();
        await narrate('SENTINEL','f2',"Le monde a besoin de toi. Et moi aussi.",1500);
        lightning=1;glitch(900,1);sfxScare();
        await narrate('SENTINEL',null,"<span class=\"r\">FIN // CHAPITRE 01</span>",0);
    }else{
        await narrate('SENTINEL','e3',"Signal coupé. Mais SENTINEL veille.",800);
        sfxWhine();
        await narrate('SENTINEL','f1',"Bienvenue dans le réseau. T'es chez toi maintenant.",1500);
        await narrate('SENTINEL',null,"<span class=\"r\">// SENTINEL VA BIENTÔT REVENIR</span>",0);
    }
}

document.getElementById('title').addEventListener('click',start);
document.getElementById('title').addEventListener('touchstart',function(e){e.preventDefault();start()});
</script>

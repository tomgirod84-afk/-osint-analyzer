<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENTINEL // LINK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#00ff88;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#main{z-index:0}#fig{z-index:15}#fx{z-index:18;pointer-events:none}
#crt{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20;
background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px)}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:21;
background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.88) 100%)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:25;opacity:0;transition:opacity 0.05s}
#title{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#000}
#title .logo{width:120px;height:120px;margin-bottom:20px;opacity:0.6}
#title h1{font-size:1.6em;color:#00ff88;text-shadow:0 0 60px rgba(0,255,136,0.3);letter-spacing:6px;margin-bottom:8px}
#title h1 b{color:#ff3355;text-shadow:0 0 40px rgba(255,51,85,0.3)}
#title .prompt{color:#0d1a0d;font-size:0.55em;letter-spacing:4px;animation:blink 1.5s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#narrative{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;display:none;align-items:flex-end;justify-content:center;padding-bottom:10%;pointer-events:none}
#textbox{max-width:88%;text-align:center;pointer-events:none;background:rgba(0,0,0,0.6);padding:15px 25px;border-radius:2px;border:1px solid rgba(0,255,136,0.06)}
#textbox .name{font-size:0.5em;color:#00ff88;letter-spacing:6px;margin-bottom:6px;text-transform:uppercase;opacity:0;transition:opacity 0.5s}
#textbox .txt{font-size:1.05em;line-height:1.8;color:#ddd;min-height:1.5em;text-shadow:0 2px 15px rgba(0,0,0,0.9)}
#textbox .txt .r{color:#ff3355;text-shadow:0 0 12px rgba(255,51,85,0.3)}
#textbox .txt .g{color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,0.3)}
#cursor-line{display:inline-block;width:2px;height:1em;background:#00ff88;vertical-align:text-bottom;animation:blink 0.6s infinite;margin-left:2px}
#choices{position:fixed;bottom:4%;left:50%;transform:translateX(-50%);z-index:70;display:none;flex-direction:column;gap:8px;align-items:center}
.cb{background:rgba(0,255,136,0.02);border:1px solid rgba(0,255,136,0.15);color:#00ff88;padding:11px 24px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;min-width:240px;text-align:center;transition:all 0.12s;letter-spacing:1px;pointer-events:auto}
.cb:active{background:rgba(0,255,136,0.15);border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.15)}
#hud{position:fixed;top:12px;left:12px;z-index:30;pointer-events:none;opacity:0;transition:opacity 1.5s}
#hud div{font-size:0.45em;color:rgba(0,255,136,0.35);line-height:1.5}
#hud .hred{color:rgba(255,51,85,0.35)}
#code-rain{position:fixed;top:0;right:0;width:160px;height:100%;z-index:5;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 2s}
#code-rain pre{font-size:0.38em;color:rgba(0,255,136,0.1);line-height:1.3;white-space:pre;animation:fall 25s linear infinite}
@keyframes fall{0%{transform:translateY(-20%)}100%{transform:translateY(0)}}
@media(max-width:768px){#textbox .txt{font-size:0.85em}.cb{min-width:180px;font-size:0.65em}#code-rain{width:80px}#code-rain pre{font-size:0.3em}}
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="fig"></canvas>
<canvas id="fx"></canvas>
<div id="crt"></div>
<div id="vignette"></div>
<div id="overlay"></div>
<div id="code-rain"><pre id="rainCode"></pre></div>
<div id="hud">
<div>ctOS v4.0 <span class="hred">| COMPROMISED</span></div>
<div>NODE: SENTINEL-LINK-7</div>
<div id="hudPing">PING: 23ms</div>
</div>
<div id="title">
<canvas id="logoCanvas" width="120" height="120" class="logo"></canvas>
<h1>SENTINEL <b>//</b> LINK</h1>
<div class="prompt">[ APPUYER POUR ENTRER ]</div>
</div>
<div id="narrative"><div id="textbox"><div class="name" id="speaker"></div><div class="txt" id="txtline"></div></div></div>
<div id="choices"></div>
<script>
var mC=document.getElementById('main'),mx=mC.getContext('2d');
var fC=document.getElementById('fig'),fx=fC.getContext('2d');
var xC=document.getElementById('fx'),xx=xC.getContext('2d');
var W,H,bgCache=null;

function resize(){W=mC.width=fC.width=xC.width=innerWidth;H=mC.height=fC.height=xC.height=innerHeight;bgCache=null;buildBg()}
function buildBg(){
    if(bgCache&&bgCache.width===W&&bgCache.height===H)return;
    bgCache=document.createElement('canvas');bgCache.width=W;bgCache.height=H;
    var b=bgCache.getContext('2d');
    var g=b.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010102');g.addColorStop(0.5,'#020308');g.addColorStop(1,'#040610');
    b.fillStyle=g;b.fillRect(0,0,W,H);
    var x=0;while(x<W){
        var w=10+Math.random()*50,h=40+Math.random()*300;
        var br=2+~~(Math.random()*6);
        b.fillStyle='rgb('+br+','+(br+1)+','+(br+3)+')';b.fillRect(x,H-h,w,h);
        for(var wy=H-h+4;wy<H-4;wy+=8)for(var wx=x+2;wx<x+w-2;wx+=6){
            if(Math.random()>0.5){
                b.fillStyle=Math.random()>0.95?'rgba(0,255,136,0.06)':Math.random()>0.8?'rgba(255,80,50,0.03)':'rgba(200,180,80,0.02)';
                b.fillRect(wx,wy,2,3);
            }
        }
        x+=w+Math.random()*5;
    }
}
resize();addEventListener('resize',resize);

// Draw DedSec skull logo on title
(function(){
    var lc=document.getElementById('logoCanvas'),lx=lc.getContext('2d');
    lx.strokeStyle='#00ff88';lx.lineWidth=2;lx.fillStyle='rgba(0,255,136,0.05)';
    var cx=60,cy=55;
    lx.beginPath();lx.moveTo(cx,cy-35);lx.bezierCurveTo(cx-28,cy-35,cx-38,cy-15,cx-38,cy);
    lx.bezierCurveTo(cx-38,cy+18,cx-25,cy+30,cx-15,cy+35);
    lx.lineTo(cx-15,cy+25);lx.bezierCurveTo(cx-12,cy+22,cx-5,cy+22,cx,cy+28);
    lx.bezierCurveTo(cx+5,cy+22,cx+12,cy+22,cx+15,cy+25);
    lx.lineTo(cx+15,cy+35);lx.bezierCurveTo(cx+25,cy+30,cx+38,cy+18,cx+38,cy);
    lx.bezierCurveTo(cx+38,cy-15,cx+28,cy-35,cx,cy-35);lx.closePath();lx.stroke();lx.fill();
    // Eyes
    lx.fillStyle='#00ff88';
    lx.beginPath();lx.moveTo(cx-22,cy-12);lx.lineTo(cx-14,cy-18);lx.lineTo(cx-10,cy-8);lx.closePath();lx.fill();
    lx.beginPath();lx.moveTo(cx+22,cy-12);lx.lineTo(cx+14,cy-18);lx.lineTo(cx+10,cy-8);lx.closePath();lx.fill();
    // Nose
    lx.beginPath();lx.moveTo(cx-3,cy+2);lx.lineTo(cx,cy-4);lx.lineTo(cx+3,cy+2);lx.closePath();lx.fill();
    // Teeth
    lx.strokeStyle='#00ff88';lx.lineWidth=1;
    for(var ti=-2;ti<=2;ti++){lx.beginPath();lx.moveTo(cx+ti*5,cy+22);lx.lineTo(cx+ti*5,cy+28);lx.stroke();}
})();

// Matrix rain
(function(){
    var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01{}[]<>/:;=+-%#@';
    var el=document.getElementById('rainCode');var txt='';
    for(var i=0;i<800;i++){txt+=chars[~~(Math.random()*chars.length)];if(Math.random()>0.88)txt+='\n'}
    el.textContent=txt+txt;
})();

// Glitch
var overlayEl=document.getElementById('overlay'),glitchAmt=0,glitchTmr=0;
function glitch(dur,intensity){
    glitchTmr=dur||200;glitchAmt=intensity||1;
    overlayEl.style.background=intensity>0.6?'rgba(255,0,0,0.15)':'rgba(0,255,136,0.05)';
    overlayEl.style.opacity='1';setTimeout(function(){overlayEl.style.opacity='0'},dur*0.6||100);
    document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake')},150);
}

setInterval(function(){var p=document.getElementById('hudPing');if(p)p.textContent='PING: '+(12+~~(Math.random()*25))+'ms';},1200);

// ===== AUDIO =====
var ac=null,mg=null,audioStarted=false;
function initAudio(){
    if(audioStarted)return;audioStarted=true;
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=0.6;mg.connect(ac.destination);
    var sub=ac.createOscillator(),sg=ac.createGain();sub.type='sine';sub.frequency.value=28;sg.gain.value=0.2;sub.connect(sg);sg.connect(mg);sub.start();
    function drone(f,v,d){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=150;fl.Q.value=8;g.gain.value=0;g.gain.linearRampToValueAtTime(v,ac.currentTime+4);o.connect(fl);fl.connect(g);g.connect(mg);o.start()},d||0)}
    drone(36,0.15,0);drone(37,0.10,2000);drone(54,0.06,4000);
    var buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.015;
    var ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;var nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=300;nf.Q.value=3;
    var ng=ac.createGain();ng.gain.value=0.12;ns.connect(nf);nf.connect(ng);ng.connect(mg);ns.start();
    setInterval(function(){if(!ac||ac.state==='closed')return;var freqs=[110,138.6,164.8,220];var f=freqs[~~(Math.random()*freqs.length)];var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sine';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=400;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(0.05,ac.currentTime+2);g.gain.linearRampToValueAtTime(0,ac.currentTime+5);o.connect(fl);fl.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+5.5)},6000);
}
function sfxHB(){if(!ac)return;[55,28].forEach(function(f,i){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(i===0?0.35:0.22,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.25)},i*160)})}
function sfxScare(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=50+Math.random()*50;g.gain.setValueAtTime(0.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.5);var o2=ac.createOscillator(),g2=ac.createGain();o2.type='square';o2.frequency.value=100+Math.random()*60;g2.gain.setValueAtTime(0.15,ac.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);o2.connect(g2);g2.connect(mg);o2.start();o2.stop(ac.currentTime+0.25)}
function sfxClick(){if(!ac)return;var buf=ac.createBuffer(1,ac.sampleRate*0.008,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;var s=ac.createBufferSource();s.buffer=buf;var g=ac.createGain();g.gain.value=0.06;s.connect(g);g.connect(mg);s.start()}
function sfxGlitch(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800+Math.random()*2000,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.15);g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.2)}
function sfxDialup(){if(!ac)return;for(var i=0;i<5;i++){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=800+Math.random()*1200;g.gain.setValueAtTime(0.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.08);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.1)},i*60)}}

// ===== VOICE ENGINE =====
var voice=null,voiceReady=false;
function initVoice(){
    var v=speechSynthesis.getVoices();
    if(!v.length)return;
    voice=v.find(function(x){return x.name.indexOf('Google')>=0&&x.lang.startsWith('fr')})
        ||v.find(function(x){return x.name.indexOf('Google')>=0})
        ||v.find(function(x){return x.name.indexOf('Thomas')>=0})
        ||v.find(function(x){return x.lang.startsWith('fr')&&(x.name.indexOf('Male')>=0||x.name.indexOf('Homme')>=0||x.name.indexOf('Paul')>=0)})
        ||v.find(function(x){return x.lang.startsWith('fr')})
        ||v.find(function(x){return x.name.indexOf('Daniel')>=0})
        ||v.find(function(x){return x.name.indexOf('James')>=0})
        ||v.find(function(x){return x.lang.startsWith('en')})
        ||v[0];
    voiceReady=!!voice;
    console.log('Voice found:',voice?voice.name:'NONE');
}
speechSynthesis.onvoiceschanged=initVoice;
initVoice();
// Retry every 500ms until voice is found
var voiceRetry=setInterval(function(){
    if(voiceReady){clearInterval(voiceRetry);return}
    initVoice();
},500);

function speak(text){
    return new Promise(function(res){
        // Force retry voice if not found
        if(!voice)initVoice();
        if(!voice){res();return}
        speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(text);
        u.voice=voice;u.rate=0.88;u.pitch=0.82;u.volume=1.0;
        u.onend=function(){res()};
        u.onerror=function(){res()};
        speechSynthesis.speak(u);
    });
}

// ===== FIGURE - Hooded + Skull Mask =====
var figA=0,figT=0,breathe=0,bDir=1,headBob=0,headDir=1,typing=0,mFlicker=1,mFDir=-1;
var mouthOpen=0,mouthTarget=0;

function drawFig(){
    fx.clearRect(0,0,W,H);if(figA<0.01)return;fx.globalAlpha=figA;
    var cx=W/2,cy=H*0.45,sc=Math.min(W,H)/550;
    breathe+=0.01*bDir;if(breathe>1)bDir=-1;if(breathe<-1)bDir=1;
    var hy=Math.sin(breathe)*2*sc;
    headBob+=0.008*headDir;if(headBob>1)headDir=-1;if(headBob<-1)headDir=1;
    var hb=Math.sin(headBob)*1.5*sc;
    typing+=0.12;
    mFlicker+=mFDir*(0.008+Math.random()*0.015);
    if(mFlicker>1.1)mFDir=-1;if(mFlicker<0.85)mFDir=1;
    if(mouthOpen<mouthTarget)mouthOpen=Math.min(mouthOpen+0.05,mouthTarget);
    if(mouthOpen>mouthTarget)mouthOpen=Math.max(mouthOpen-0.05,mouthTarget);
    var gx=(Math.random()-0.5)*glitchAmt*20,gy=(Math.random()-0.5)*glitchAmt*12;
    fx.save();fx.translate(gx,gy);

    // Desk
    var dw=280*sc,dx=cx-dw/2,dy=cy+100*sc;
    fx.fillStyle='#151515';fx.fillRect(dx,dy,dw,10*sc);fx.fillStyle='#101010';fx.fillRect(dx+4*sc,dy+10*sc,dw-8*sc,50*sc);
    // Keyboard
    fx.fillStyle='#1a1a1a';fx.fillRect(cx-38*sc,dy-5*sc,76*sc,4*sc);
    // Cup
    fx.fillStyle='#161616';fx.fillRect(cx+60*sc,dy-15*sc,10*sc,15*sc);
    // Cables on desk
    fx.strokeStyle='#121212';fx.lineWidth=1.5*sc;
    fx.beginPath();fx.moveTo(dx+20*sc,dy+2*sc);fx.quadraticCurveTo(dx+40*sc,dy+8*sc,dx+80*sc,dy+5*sc);fx.stroke();
    fx.beginPath();fx.moveTo(cx+40*sc,dy+2*sc);fx.quadraticCurveTo(cx+50*sc,dy+10*sc,cx+70*sc,dy+3*sc);fx.stroke();

    // Chair back
    fx.fillStyle='#131313';
    fx.beginPath();fx.moveTo(cx-42*sc,cy+55*sc);fx.quadraticCurveTo(cx-48*sc,cy+130*sc,cx-32*sc,cy+160*sc);
    fx.lineTo(cx+32*sc,cy+160*sc);fx.quadraticCurveTo(cx+48*sc,cy+130*sc,cx+42*sc,cy+55*sc);fx.fill();

    // === TORSO ===
    fx.fillStyle='#1a1a1a';
    fx.beginPath();fx.moveTo(cx-36*sc,cy+85*sc);fx.quadraticCurveTo(cx-42*sc,cy+20*sc+hy,cx-32*sc,cy-25*sc+hy);
    fx.quadraticCurveTo(cx,cy-42*sc+hy,cx+32*sc,cy-25*sc+hy);
    fx.quadraticCurveTo(cx+42*sc,cy+20*sc+hy,cx+36*sc,cy+85*sc);fx.closePath();fx.fill();
    // Hoodie back detail
    fx.strokeStyle='#222222';fx.lineWidth=1*sc;
    fx.beginPath();fx.moveTo(cx,cy-38*sc+hy);fx.lineTo(cx,cy+83*sc);fx.stroke();
    // Pocket
    fx.strokeStyle='#1c1c1c';fx.beginPath();fx.moveTo(cx-22*sc,cy+45*sc+hy);fx.lineTo(cx+22*sc,cy+45*sc+hy);fx.stroke();

    // === HOOD ===
    fx.fillStyle='#161616';
    fx.beginPath();fx.moveTo(cx-32*sc,cy-25*sc+hy);
    fx.quadraticCurveTo(cx-44*sc,cy-52*sc+hy,cx-36*sc,cy-78*sc+hy);
    fx.quadraticCurveTo(cx-16*sc,cy-92*sc+hy,cx,cy-88*sc+hy);
    fx.quadraticCurveTo(cx+16*sc,cy-92*sc+hy,cx+36*sc,cy-78*sc+hy);
    fx.quadraticCurveTo(cx+44*sc,cy-52*sc+hy,cx+32*sc,cy-25*sc+hy);fx.closePath();fx.fill();
    // Hood inner
    fx.fillStyle='#0c0c0c';
    fx.beginPath();fx.moveTo(cx-28*sc,cy-27*sc+hy);
    fx.quadraticCurveTo(cx,cy-42*sc+hy,cx+28*sc,cy-27*sc+hy);
    fx.quadraticCurveTo(cx,cy-34*sc+hy,cx-28*sc,cy-27*sc+hy);fx.fill();

    // === HEAD + SKULL MASK ===
    var headY=cy-48*sc+hy+hb;
    // Head shape
    fx.fillStyle='#201a16';fx.beginPath();fx.ellipse(cx,headY,20*sc,24*sc,0,0,Math.PI*2);fx.fill();
    // Neck
    fx.fillStyle='#1a1612';fx.beginPath();fx.moveTo(cx-8*sc,headY+20*sc);fx.lineTo(cx-10*sc,cy-23*sc+hy);
    fx.lineTo(cx+10*sc,cy-23*sc+hy);fx.lineTo(cx+8*sc,headY+20*sc);fx.fill();

    // === SKULL MASK (facing forward, on the back of head - we see it) ===
    var skY=headY-2*sc,skS=sc*0.85;
    // Skull base
    fx.fillStyle='#e8e0d4';
    fx.beginPath();fx.moveTo(cx,skY-18*skS);
    fx.bezierCurveTo(cx-18*skS,skY-18*skS,cx-22*skS,skY-5*skS,cx-20*skS,skY+3*skS);
    fx.bezierCurveTo(cx-18*skS,skY+12*skS,cx-12*skS,skY+18*skS,cx-6*skS,skY+20*skS);
    fx.lineTo(cx-6*skS,skY+15*skS);
    fx.bezierCurveTo(cx-4*skS,skY+13*skS,cx-1*skS,skY+14*skS,cx,skY+17*skS);
    fx.bezierCurveTo(cx+1*skS,skY+14*skS,cx+4*skS,skY+13*skS,cx+6*skS,skY+15*skS);
    fx.lineTo(cx+6*skS,skY+20*skS);
    fx.bezierCurveTo(cx+12*skS,skY+18*skS,cx+18*skS,skY+12*skS,cx+20*skS,skY+3*skS);
    fx.bezierCurveTo(cx+22*skS,skY-5*skS,cx+18*skS,skY-18*skS,cx,skY-18*skS);fx.closePath();fx.fill();

    // Skull shadow/outline
    fx.strokeStyle='#b0a89a';fx.lineWidth=1.2*skS;
    fx.beginPath();fx.moveTo(cx,skY-18*skS);
    fx.bezierCurveTo(cx-18*skS,skY-18*skS,cx-22*skS,skY-5*skS,cx-20*skS,skY+3*skS);
    fx.bezierCurveTo(cx-18*skS,skY+12*skS,cx-12*skS,skY+18*skS,cx-6*skS,skY+20*skS);
    fx.lineTo(cx-6*skS,skY+15*skS);fx.bezierCurveTo(cx-4*skS,skY+13*skS,cx-1*skS,skY+14*skS,cx,skY+17*skS);
    fx.bezierCurveTo(cx+1*skS,skY+14*skS,cx+4*skS,skY+13*skS,cx+6*skS,skY+15*skS);
    fx.lineTo(cx+6*skS,skY+20*skS);

// Particles
var particles=[];
function spawnP(x,y,color,n,spd){for(var i=0;i<n;i++)particles.push({x:x+(Math.random()-0.5)*4,y:y+(Math.random()-0.5)*4,vx:(Math.random()-0.5)*spd,vy:-Math.random()*spd,life:25+Math.random()*35,max:60,color:color,s:1+Math.random()*2})}
function drawP(){particles.forEach(function(p){var a=p.life/p.max;xx.globalAlpha=a;xx.fillStyle=p.color;xx.fillRect(W/2+p.x,H/2+p.y,p.s*a,p.s*a)});xx.globalAlpha=1}

// Static
var staticI=0,staticBuf=null;
function drawStatic(){
    if(staticI<0.01)return;xx.globalAlpha=staticI;
    xx.fillStyle='rgba(255,255,255,'+Math.random()*0.08+')';xx.fillRect(0,Math.random()*H,W,1+Math.random()*3);
    if(!staticBuf||staticBuf.width!==W){staticBuf=document.createElement('canvas');staticBuf.width=W;staticBuf.height=H;}
    var sx=staticBuf.getContext('2d'),img=sx.createImageData(W,Math.min(H,600));
    for(var j=0;j<img.data.length;j+=20){var v=Math.random()*180*staticI;img.data[j]=v;img.data[j+1]=v;img.data[j+2]=v;img.data[j+3]=v*0.2;}
    sx.putImageData(img,0,0);xx.drawImage(staticBuf,0,0,W,H);xx.globalAlpha=1;
}

// Render
var lightning=0;
if(!window._rainArr){window._rainArr=[];for(var i=0;i<180;i++)window._rainArr.push({x:Math.random()*2500,y:Math.random()*1500,l:3+Math.random()*10,v:8+Math.random()*16,a:0.015+Math.random()*0.05})}
function render(){
    mx.clearRect(0,0,W,H);buildBg();
    if(lightning>0){mx.fillStyle='rgba(180,200,255,'+lightning*0.06+')';mx.fillRect(0,0,W,H);lightning*=0.85;if(lightning<0.01)lightning=0;}
    mx.lineWidth=1;window._rainArr.forEach(function(d){mx.strokeStyle='rgba(0,255,136,'+d.a+')';mx.beginPath();mx.moveTo(d.x,d.y);mx.lineTo(d.x+0.5,d.y+d.l);mx.stroke();d.y+=d.v;d.x+=0.3;if(d.y>H){d.y=-d.l;d.x=Math.random()*W}});
    drawFig();drawStatic();drawP();
    if(figA<figT)figA=Math.min(figA+0.008,figT);if(figA>figT)figA=Math.max(figA-0.012,figT);
    if(glitchTmr>0){glitchTmr--;glitchAmt*=0.9}else glitchAmt=0;
    staticI*=0.92;
    for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}
    if(Math.random()<0.002)lightning=0.4+Math.random()*0.5;
    requestAnimationFrame(render);
}
render();

var narrEl=document.getElementById('narrative'),speakerEl=document.getElementById('speaker'),txtEl=document.getElementById('txtline');
var cursorEl=document.createElement('span');cursorEl.id='cursor-line';
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function findPos(html,n){var count=0,inTag=false;for(var i=0;i<html.length;i++){if(html[i]==='<'){inTag=true;continue}if(html[i]==='>'){inTag=false;continue}if(!inTag)count++;if(count>=n)return i+1}return html.length}

function reveal(html,speed){
    return new Promise(function(res){
        narrEl.style.display='flex';
        var plain=html.replace(/<[^>]*>/g,'');
        var i=0;txtEl.innerHTML='';txtEl.appendChild(cursorEl);
        var iv=setInterval(function(){
            if(i<plain.length){i++;txtEl.innerHTML=html.substring(0,findPos(html,i));txtEl.appendChild(cursorEl);if(i%2===0)sfxClick()}
            else{clearInterval(iv);txtEl.innerHTML=html;res()}
        },speed||30);
    });
}

function showName(name){speakerEl.textContent=name;speakerEl.style.opacity='1'}
function hideName(){speakerEl.style.opacity='0'}

async function narrate(name,text,delay){
    showName(name);
    mouthTarget=1;
    await reveal(text,28);
    mouthTarget=0;
    if(delay)await wait(delay);
}

function hideNarrative(){narrEl.style.display='none';hideName()}

function showChoices(choices){
    var c=document.getElementById('choices');c.innerHTML='';c.style.display='flex';
    return new Promise(function(res){
        choices.forEach(function(ch){
            var b=document.createElement('button');b.className='cb';b.textContent=ch.text;
            b.onclick=function(){c.style.display='none';glitch(150,0.5);sfxGlitch();setTimeout(function(){res(ch.id)},250)};
            c.appendChild(b);
        });
    });
}

        await narrate('SENTINEL',"Mais... t'es pas vraiment seul.",1800);
        lightning=1;glitch(900,1);sfxScare();
        await narrate('SENTINEL',"<span class=\"r\">FIN // CHAPITRE 01</span>",0);
    }else{
        await narrate('SENTINEL',"Signal coup\u00e9.",900);
        await narrate('SENTINEL',"SENTINEL est toujours dans le syst\u00e8me.",1100);
        await narrate('SENTINEL',"Et il t'attend...",0);
    }
}

document.getElementById('title').addEventListener('click',start);
document.getElementById('title').addEventListener('touchstart',function(e){e.preventDefault();start()});
</script>

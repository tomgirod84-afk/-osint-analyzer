<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENTINEL // LINK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Consolas','Courier New',monospace;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#main{z-index:0}
#cam-feed{z-index:10;pointer-events:none}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;background:rgba(255,255,255,0);transition:background 0.08s}

/* Camera HUD - WD2 style */
#cam-hud{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;pointer-events:none;opacity:0;transition:opacity 0.5s}
#cam-id{position:absolute;top:14px;left:14px;font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:1px}
#cam-id span{color:rgba(0,220,180,0.6)}
#cam-time{position:absolute;top:14px;right:14px;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px}
#cam-corner{position:absolute;top:10px;left:10px;width:20px;height:20px;border-top:1px solid rgba(0,220,180,0.3);border-left:1px solid rgba(0,220,180,0.3)}
#cam-corner2{position:absolute;top:10px;right:10px;width:20px;height:20px;border-top:1px solid rgba(0,220,180,0.3);border-right:1px solid rgba(0,220,180,0.3)}
#cam-corner3{position:absolute;bottom:10px;left:10px;width:20px;height:20px;border-bottom:1px solid rgba(0,220,180,0.3);border-left:1px solid rgba(0,220,180,0.3)}
#cam-corner4{position:absolute;bottom:10px;right:10px;width:20px;height:20px;border-bottom:1px solid rgba(0,220,180,0.3);border-right:1px solid rgba(0,220,180,0.3)}
#cam-rec{position:absolute;top:38px;left:14px;font-size:10px;color:rgba(255,50,50,0.7);letter-spacing:2px;opacity:0}
#cam-rec i{display:inline-block;width:6px;height:6px;background:rgba(255,50,50,0.8);border-radius:50%;margin-right:5px;vertical-align:middle;animation:rb 1s infinite}
@keyframes rb{0%,49%{opacity:1}50%,100%{opacity:0.15}}
#cam-status{position:absolute;bottom:14px;left:14px;font-size:9px;color:rgba(0,220,180,0.35);letter-spacing:1px}

/* Profiler panel - WD2 style */
#profiler{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity 0.3s}
#profiler .p-title{font-size:10px;color:rgba(0,220,180,0.8);letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid rgba(0,220,180,0.15);padding-bottom:4px}
#profiler .p-line{font-size:10px;color:rgba(255,255,255,0.65);line-height:1.7}
#profiler .p-line b{color:rgba(0,220,180,0.7);font-weight:normal}

/* Narrative subtitle - WD2 style */
#subtitle{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:60;width:90%;max-width:700px;pointer-events:none;opacity:0;transition:opacity 0.3s}
#subtitle .s-name{font-size:10px;color:rgba(0,220,180,0.7);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#subtitle .s-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,0.85);text-shadow:0 1px 8px rgba(0,0,0,0.9);background:rgba(0,0,0,0.5);padding:12px 18px;border-left:2px solid rgba(0,220,180,0.3)}
#subtitle .s-text .r{color:rgba(255,80,80,0.9)}
#subtitle .s-text .g{color:rgba(0,220,180,0.9)}
#cursor-s{display:inline-block;width:1px;height:1em;background:rgba(0,220,180,0.7);vertical-align:text-bottom;animation:blink 0.6s infinite;margin-left:2px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* Choices - WD2 style */
#choices{position:fixed;bottom:4%;left:50%;transform:translateX(-50%);z-index:70;display:none;flex-direction:column;gap:6px;align-items:center}
.cb{background:rgba(0,20,15,0.6);border:1px solid rgba(0,220,180,0.2);color:rgba(0,220,180,0.8);padding:10px 22px;font-family:'Consolas','Courier New',monospace;font-size:12px;cursor:pointer;min-width:260px;text-align:left;transition:all 0.15s;letter-spacing:0.5px;pointer-events:auto;position:relative}
.cb::before{content:'>';position:absolute;left:8px;opacity:0.4}
.cb:hover{background:rgba(0,220,180,0.08);border-color:rgba(0,220,180,0.5);padding-left:28px}

/* Title screen */
#title{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#000}
#title h1{font-size:14px;color:rgba(0,220,180,0.5);letter-spacing:8px;font-weight:400;margin-bottom:16px}
#title .prompt{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:3px;animation:blink 1.5s infinite}

@media(max-width:768px){
    #subtitle .s-text{font-size:12px}
    .cb{min-width:200px;font-size:11px}
    #cam-id,#cam-time{font-size:9px}
}
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="cam-feed"></canvas>
<div id="overlay"></div>

<div id="cam-hud">
    <div id="cam-corner"></div><div id="cam-corner2"></div>
    <div id="cam-corner3"></div><div id="cam-corner4"></div>
    <div id="cam-id">CAM <span id="camNum">0472</span> // <span id="camLoc">BLUME SF</span></div>
    <div id="cam-time" id="camTime"></div>
    <div id="cam-rec"><i></i>REC</div>
    <div id="cam-status">ctOS 2.0 // SECURE FEED</div>
</div>

<div id="profiler">
    <div class="p-title" id="pTitle"></div>
    <div id="pLines"></div>
</div>

<div id="subtitle">
    <div class="s-name" id="sName"></div>
    <div class="s-text" id="sText"></div>
</div>

<div id="choices"></div>

<div id="title">
    <h1>SENTINEL</h1>
    <div class="prompt">[ CLIQUEZ POUR ACCEDER ]</div>
</div>

<script>
var mC=document.getElementById('main'),mx=mC.getContext('2d');
var fC=document.getElementById('cam-feed'),fx=fC.getContext('2d');
var W,H;

function resize(){W=mC.width=fC.width=innerWidth;H=mC.height=fC.height=innerHeight;genCity()}
resize();addEventListener('resize',resize);

// Camera system
var cam={x:0,y:0,zoom:1,tx:0,ty:0,tz:1,shakeX:0,shakeY:0};
function camSet(x,y,z){cam.tx=x;cam.ty=y;cam.tz=z}
function camShake(i){cam.shakeX=(Math.random()-0.5)*i;cam.shakeY=(Math.random()-0.5)*i}
function camUpdate(){cam.x+=(cam.tx-cam.x)*0.02;cam.y+=(cam.ty-cam.y)*0.02;cam.zoom+=(cam.tz-cam.zoom)*0.02;cam.shakeX*=0.88;cam.shakeY*=0.88}

// City generation
var blds=[],cars=[],lamps=[];
function genCity(){
    blds=[];cars=[];lamps=[];
    for(var layer=0;layer<3;layer++){
        var bx=-50;
        while(bx<W+100){
            var bw=30+Math.random()*100*(1-layer*0.25);
            var bh=80+Math.random()*280*(1-layer*0.25);
            var by=H*0.55+bh*0.3+layer*50;
            var wins=[];
            var cols=Math.floor(bw/10);var rows=Math.floor(bh/14);
            for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
                if(Math.random()>0.3){
                    wins.push({rx:c/cols,ry:r/rows,lit:Math.random()>0.25,warm:Math.random()>0.7});
                }
            }
            blds.push({x:bx,y:by,w:bw,h:bh,layer:layer,wins:wins,
                hasAnt:Math.random()>0.65,antH:8+Math.random()*25,
                shade:6+layer*3+~~(Math.random()*4)});
            bx+=bw+1+Math.random()*6;
        }
    }
    for(var i=0;i<6;i++){
        cars.push({x:Math.random()*W*1.4-W*0.2,y:H*0.65+Math.random()*H*0.06,
            spd:0.4+Math.random()*1.8,dir:Math.random()>0.5?1:-1,
            w:18+Math.random()*12,h:6+Math.random()*3,
            hasHL:Math.random()>0.4,hasTL:Math.random()>0.3});
    }
    for(var i=0;i<12;i++){
        lamps.push({x:i*(W/11)+Math.random()*30-15,y:H*0.6+Math.random()*H*0.03,
            flicker:Math.random()>0.8});
    }
}
genCity();

// ctOS targets
var targets=[];
function genTargets(){
    targets=[];
    var types=['cam','phone','router','lock','car','server'];
    var labels=['CAM-','DEV-','RTR-','LK-','VH-','SRV-'];
    for(var i=0;i<10;i++){
        var ti=~~(Math.random()*types.length);
        targets.push({
            x:W*0.1+Math.random()*W*0.8,
            y:H*0.15+Math.random()*H*0.45,
            type:types[ti],label:labels[ti]+(1000+~~(Math.random()*9000)),
            pulse:Math.random()*Math.PI*2,
            hacked:false
        });
    }
}
genTargets();

// Network connections
var conns=[];
function genConns(){
    conns=[];
    for(var i=0;i<targets.length;i++){
        for(var j=i+1;j<targets.length;j++){
            var dx=targets[i].x-targets[j].x,dy=targets[i].y-targets[j].y;
            if(Math.sqrt(dx*dx+dy*dy)<280&&Math.random()>0.55){
                conns.push({a:i,b:j,dp:Math.random(),ds:0.002+Math.random()*0.004});
            }
        }
    }
}
genConns();
addEventListener('resize',function(){genCity();genTargets();genConns()});

// Scene camera positions
var scenes=[
    {x:0,y:0,z:1,cam:'0472',loc:'BLUME SF'},
    {x:-60,y:-20,z:1.25,cam:'1093',loc:'MISSION DIST'},
    {x:50,y:-15,z:1.15,cam:'0284',loc:'SOMA'},
    {x:0,y:-50,z:1.4,cam:'0017',loc:'FINANCIAL'},
    {x:-30,y:20,z:1.05,cam:'0756',loc:'CASTRO'},
    {x:40,y:-40,z:1.6,cam:'1205',loc:'DOCKS'}
];
var sceneIdx=0;

function switchScene(idx){
    sceneIdx=idx%scenes.length;
    var s=scenes[sceneIdx];
    // Static flash
    var ov=document.getElementById('overlay');
    ov.style.background='rgba(255,255,255,0.3)';
    setTimeout(function(){ov.style.background='rgba(0,0,0,0.8)';setTimeout(function(){ov.style.background='rgba(255,255,255,0.15)';setTimeout(function(){ov.style.background='transparent'},100)},80)},60);
    camSet(s.x,s.y,s.z);
    document.getElementById('camNum').textContent=s.cam;
    document.getElementById('camLoc').textContent=s.loc;
    genTargets();genConns();
}

// Profiler
var prof={active:false,alpha:0,target:null,data:[]};
function openProfiler(t){
    prof.active=true;prof.alpha=0;prof.target=t;t.hacked=true;
    var pd=[
        {k:'TYPE',v:t.type.toUpperCase()},
        {k:'ID',v:t.label},
        {k:'STATUS',v:Math.random()>0.4?'CONNECTÉ':'VULNÉRABLE'},
        {k:'CRYPTAGE',v:'AES-256 // '+(['ACTIF','COMPROMIS','BYPASSÉ'][~~(Math.random()*3)])},
        {k:'OWNER',v:['NON IDENTIFIÉ','BLUME CORP','ctOS PRIVATE','CITIZEN'][~~(Math.random()*4)]},
        {k:'ACCÈS',v:Math.random()>0.3?'AUTORISÉ':'REFUSÉ'},
        {k:'RISK',v:~~(Math.random()*35+65)+'%'}
    ];
    prof.data=pd;
    var el=document.getElementById('profiler');
    el.style.left=Math.min(t.x+30,W-200)+'px';
    el.style.top=Math.max(t.y-80,20)+'px';
    document.getElementById('pTitle').textContent='PROFILE // '+t.label;
    var html='';pd.forEach(function(d){html+='<div class="p-line"><b>'+d.k+':</b> '+d.v+'</div>'});
    document.getElementById('pLines').innerHTML=html;
}
function closeProfiler(){prof.active=false;prof.alpha=0;document.getElementById('profiler').style.opacity='0'}

// Click to hack target
fC.addEventListener('click',function(e){
    var mx2=e.clientX,my2=e.clientY;
    for(var i=0;i<targets.length;i++){
        var t=targets[i];
        var dx=mx2-t.x*cam.zoom-cam.x*(1-cam.zoom),dy=my2-t.y*cam.zoom-cam.y*(1-cam.zoom);
        if(Math.abs(dx)<20&&Math.abs(dy)<20){
            closeProfiler();
            setTimeout(function(){openProfiler(t)},100);
            return;
        }
    }
});
fC.addEventListener('touchstart',function(e){
    e.preventDefault();
    var touch=e.touches[0];
    var mx2=touch.clientX,my2=touch.clientY;
    for(var i=0;i<targets.length;i++){
        var t=targets[i];
        var tx=t.x*cam.zoom+W/2*(1-cam.zoom)+cam.x*(1-cam.zoom)+cam.shakeX;
        var ty=t.y*cam.zoom+H/2*(1-cam.zoom)+cam.y*(1-cam.zoom)+cam.shakeY;
        if(Math.sqrt((mx2-tx)*(mx2-tx)+(my2-ty)*(my2-ty))<30){
            closeProfiler();
            setTimeout(function(){openProfiler(t)},100);
            return;
        }
    }
});

// Rain
var rain=[];for(var i=0;i<120;i++)rain.push({x:Math.random()*2000,y:Math.random()*1200,l:4+Math.random()*8,v:6+Math.random()*12,a:0.02+Math.random()*0.04});

// Pedestrians
var peds=[];
function genPeds(){
    peds=[];
    for(var i=0;i<10;i++){
        peds.push({
            x:Math.random()*W*1.5-W*0.25,
            y:H*0.58+Math.random()*H*0.06,
            spd:0.2+Math.random()*0.6,
            dir:Math.random()>0.5?1:-1,
            h:8+Math.random()*5,
            w:2+Math.random()*1.5,
            sway:Math.random()*Math.PI*2,
            layer:Math.random()>0.5?0:1
        });
    }
}
genPeds();
addEventListener('resize',function(){genCity();genTargets();genConns();genPeds()});

// Fish-eye distortion buffer
var fisheyeBuf=null;

// Grain
var grainBuf=null;
function drawGrain(){
    if(!grainBuf||grainBuf.width!==W){grainBuf=document.createElement('canvas');grainBuf.width=W;grainBuf.height=Math.min(H,500)}
    var gx=grainBuf.getContext('2d'),img=gx.createImageData(W,grainBuf.height);
    for(var j=0;j<img.data.length;j+=16){var v=Math.random()*50;img.data[j]=v;img.data[j+1]=v;img.data[j+2]=v;img.data[j+3]=12;}
    gx.putImageData(img,0,0);fx.drawImage(grainBuf,0,0,W,H);
}

// Render city
function drawCity(){
    var t=Date.now()*0.001;

    // Sky
    var sky=mx.createLinearGradient(0,0,0,H*0.55);
    sky.addColorStop(0,'#060810');sky.addColorStop(1,'#0c0e16');
    mx.fillStyle=sky;mx.fillRect(0,0,W,H*0.6);

    // Distant glow
    mx.fillStyle='rgba(0,180,140,0.008)';mx.beginPath();mx.ellipse(W*0.4,H*0.35,W*0.4,H*0.08,0,0,Math.PI*2);mx.fill();

    // Ground
    mx.fillStyle='#08090d';mx.fillRect(0,H*0.6,W,H*0.4);

    // Road markings
    mx.strokeStyle='rgba(200,180,100,0.04)';mx.lineWidth=1;mx.setLineDash([15,25]);
    mx.beginPath();mx.moveTo(0,H*0.72);mx.lineTo(W,H*0.72);mx.stroke();
    mx.setLineDash([]);

    // Buildings
    for(var li=0;li<3;li++){
        for(var bi=0;bi<blds.length;bi++){
            var b=blds[bi];if(b.layer!==li)continue;
            mx.fillStyle='rgb('+b.shade+','+(b.shade+2)+','+(b.shade+5)+')';
            mx.fillRect(b.x,b.y-b.h,b.w,b.h);
            mx.strokeStyle='rgba(255,255,255,0.02)';mx.lineWidth=0.5;mx.strokeRect(b.x,b.y-b.h,b.w,b.h);
            // Windows
            for(var wi=0;wi<b.wins.length;wi++){
                var w=b.wins[wi];
                if(!w.lit)continue;
                var wx=b.x+4+w.rx*(b.w-8),wy=b.y-b.h+4+w.ry*(b.h-8);
                var wa=w.warm?0.25:0.15;
                if(w.warm){mx.fillStyle='rgba(255,210,130,'+wa+')'}else{mx.fillStyle='rgba(180,200,230,'+wa+')'}
                mx.fillRect(wx,wy,5,8);
            }
            // Antenna
            if(b.hasAnt){
                mx.strokeStyle='#0e0f14';mx.lineWidth=0.8;
                mx.beginPath();mx.moveTo(b.x+b.w*0.5,b.y-b.h);mx.lineTo(b.x+b.w*0.5,b.y-b.h-b.antH);mx.stroke();
                var ba=Math.sin(t*1.8+b.x)*0.5+0.5;
                mx.fillStyle='rgba(255,40,40,'+(ba*0.6)+')';mx.beginPath();mx.arc(b.x+b.w*0.5,b.y-b.h-b.antH,1.5,0,Math.PI*2);mx.fill();
            }
        }
    }

    // Lamps
    for(var i=0;i<lamps.length;i++){
        var l=lamps[i];
        var la=l.flicker?0.35+Math.sin(t*6+i)*0.1:0.4;
        mx.fillStyle='#0c0d12';mx.fillRect(l.x-0.5,l.y-28,1,28);
        mx.fillStyle='rgba(255,210,140,'+(la*0.5)+')';mx.fillRect(l.x-3,l.y-30,6,3);
        mx.fillStyle='rgba(255,210,140,'+(la*0.025)+')';mx.beginPath();mx.ellipse(l.x,l.y,35,8,0,0,Math.PI*2);mx.fill();
        mx.fillStyle='rgba(255,210,140,'+(la*0.01)+')';
        mx.beginPath();mx.moveTo(l.x-2,l.y-28);mx.lineTo(l.x-30,l.y+5);mx.lineTo(l.x+30,l.y+5);mx.closePath();mx.fill();
    }

    // Cars
    for(var i=0;i<cars.length;i++){
        var c=cars[i];c.x+=c.spd*c.dir;
        if(c.dir>0&&c.x>W+40)c.x=-50;
        if(c.dir<0&&c.x<-50)c.x=W+40;
        mx.fillStyle='rgba(18,19,24,0.9)';mx.fillRect(c.x-c.w/2,c.y-c.h,c.w,c.h);
        if(c.hasHL&&c.dir>0){
            mx.fillStyle='rgba(255,230,180,0.08)';mx.beginPath();
            mx.moveTo(c.x+c.w/2,c.y-c.h+1);mx.lineTo(c.x+c.w/2+40,c.y+3);mx.lineTo(c.x+c.w/2+40,c.y-c.h-2);mx.closePath();mx.fill();
        }
        if(c.hasHL&&c.dir<0){
            mx.fillStyle='rgba(255,230,180,0.08)';mx.beginPath();
            mx.moveTo(c.x-c.w/2,c.y-c.h+1);mx.lineTo(c.x-c.w/2-40,c.y+3);mx.lineTo(c.x-c.w/2-40,c.y-c.h-2);mx.closePath();mx.fill();
        }
        if(c.hasTL){
            var tl=c.dir>0?-c.w/2:c.w/2;
            mx.fillStyle='rgba(255,20,20,0.4)';mx.fillRect(c.x+tl-1,c.y-c.h,2,2);
        }
    }

    // Pedestrians
    for(var i=0;i<peds.length;i++){
        var p=peds[i];p.x+=p.spd*p.dir;p.sway+=0.08;
        if(p.dir>0&&p.x>W*1.2)p.x=-30;
        if(p.dir<0&&p.x<-30)p.x=W*1.2;
        var swayX=Math.sin(p.sway)*0.8;
        // Body
        mx.fillStyle='rgba(12,13,18,0.85)';
        mx.fillRect(p.x+p.swayX-p.w/2,p.y-p.h,p.w,p.h);
        // Head
        mx.beginPath();mx.arc(p.x+p.swayX,p.y-p.h-2,2,0,Math.PI*2);mx.fill();
        // Legs animation
        var legOff=Math.sin(p.sway*2)*1.5;
        mx.fillRect(p.x+p.swayX-0.8,p.y,1.5,3+legOff);
        mx.fillRect(p.x+p.swayX+0.3,p.y,1.5,3-legOff);
    }

    // ctOS grid on ground
    mx.strokeStyle='rgba(0,200,150,0.025)';mx.lineWidth=0.5;
    var gridSpacing=40;
    for(var gx=0;gx<W+100;gx+=gridSpacing){
        mx.beginPath();mx.moveTo(gx,H*0.6);mx.lineTo(gx,H);mx.stroke();
    }
    for(var gy=H*0.6;gy<H;gy+=gridSpacing*0.6){
        mx.beginPath();mx.moveTo(0,gy);mx.lineTo(W,gy);mx.stroke();
    }
}

// Ambient city sounds
var audioCtx=null;
function initAudio(){
    if(audioCtx)return;
    try{
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        // City rumble (low frequency noise)
        var bufSz=audioCtx.sampleRate*4;
        var buf=audioCtx.createBuffer(1,bufSz,audioCtx.sampleRate);
        var data=buf.getChannelData(0);
        var val=0;
        for(var i=0;i<bufSz;i++){
            val+=((Math.random()*2-1)*0.02);
            val*=0.998;
            data[i]=val;
        }
        var src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
        var gain=audioCtx.createGain();gain.gain.value=0.06;
        var filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=200;
        src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start();

        // Distant siren (sine sweep)
        var osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=0;
        var sGain=audioCtx.createGain();sGain.gain.value=0;
        var lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.1;
        var lfoG=audioCtx.createGain();lfoG.gain.value=400;
        lfo.connect(lfoG);lfoG.connect(osc.frequency);
        var sLfo2=audioCtx.createOscillator();sLfo2.type='sine';sLfo2.frequency.value=0.05;
        var sLfo2G=audioCtx.createGain();sLfo2G.gain.value=0.008;
        sLfo2.connect(sLfo2G);sLfo2G.connect(sGain.gain);
        osc.connect(sGain);sGain.connect(audioCtx.destination);
        osc.start();lfo.start();sLfo2.start();

        // Wind gusts
        function gust(){
            if(!audioCtx)return;
            var gBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
            var gData=gBuf.getChannelData(0);
            for(var i=0;i<gData.length;i++){
                gData[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/gData.length)*0.015;
            }
            var gSrc=audioCtx.createBufferSource();gSrc.buffer=gBuf;
            var gFilt=audioCtx.createBiquadFilter();gFilt.type='bandpass';gFilt.frequency.value=800+Math.random()*600;gFilt.Q.value=0.5;
            var gGain=audioCtx.createGain();gGain.gain.value=0.3;
            gSrc.connect(gFilt);gFilt.connect(gGain);gGain.connect(audioCtx.destination);gSrc.start();
            setTimeout(gust,3000+Math.random()*8000);
        }
        gust();
    }catch(e){}
}

// Main render
var staticI=0,glitchAmt=0,glitchTmr=0;
function glitch(dur,int){glitchTmr=dur;glitchAmt=int;var ov=document.getElementById('overlay');ov.style.background=int>0.5?'rgba(0,220,180,0.06)':'rgba(0,220,180,0.03)';setTimeout(function(){ov.style.background='transparent'},dur*0.5)}

var lightning=0;
function render(){
    mx.clearRect(0,0,W,H);
    camUpdate();

    // Camera transform
    mx.save();
    mx.translate(W/2+cam.shakeX,H/2+cam.shakeY);
    mx.scale(cam.zoom,cam.zoom);
    mx.translate(-W/2+cam.x,-H/2+cam.y);

    drawCity();

    mx.restore();

    // ctOS targets (drawn in screen space, affected by camera)
    for(var i=0;i<targets.length;i++){
        var t=targets[i];
        t.pulse+=0.025;
        var sx=t.x*cam.zoom+W/2*(1-cam.zoom)+cam.x*(1-cam.zoom)+cam.shakeX;
        var sy=t.y*cam.zoom+H/2*(1-cam.zoom)+cam.y*(1-cam.zoom)+cam.shakeY;
        var pa=t.hacked?0.6:0.25+Math.sin(t.pulse)*0.1;

        // Diamond
        fx.globalAlpha=pa;fx.strokeStyle=t.hacked?'rgba(0,220,180,0.7)':'rgba(0,220,180,0.4)';fx.lineWidth=t.hacked?1.2:0.7;
        fx.beginPath();fx.moveTo(sx,sy-7);fx.lineTo(sx+7,sy);fx.lineTo(sx,sy+7);fx.lineTo(sx-7,sy);fx.closePath();fx.stroke();

        // Pulse ring
        if(t.hacked){
            var pr=10+Math.sin(t.pulse*2)*3;
            fx.globalAlpha=0.15;fx.beginPath();fx.arc(sx,sy,pr,0,Math.PI*2);fx.stroke();
        }

        // Label
        if(t.hacked){fx.globalAlpha=0.5;fx.font='8px Consolas';fx.fillStyle='rgba(0,220,180,0.6)';fx.fillText(t.label,sx+10,sy+3)}
    }

    // Network connections
    for(var i=0;i<conns.length;i++){
        var cn=conns[i];
        var a=targets[cn.a],b=targets[cn.b];
        var visible=(a.hacked||b.hacked);
        var alpha=visible?0.25:0.06;
        fx.globalAlpha=alpha;fx.strokeStyle='rgba(0,220,180,0.5)';fx.lineWidth=0.4;
        var ax=a.x*cam.zoom+W/2*(1-cam.zoom)+cam.x*(1-cam.zoom)+cam.shakeX;
        var ay=a.y*cam.zoom+H/2*(1-cam.zoom)+cam.y*(1-cam.zoom)+cam.shakeY;
        var bx2=b.x*cam.zoom+W/2*(1-cam.zoom)+cam.x*(1-cam.zoom)+cam.shakeX;
        var by2=b.y*cam.zoom+H/2*(1-cam.zoom)+cam.y*(1-cam.zoom)+cam.shakeY;
        fx.beginPath();fx.moveTo(ax,ay);fx.lineTo(bx2,by2);fx.stroke();
        // Data packet
        cn.dp=(cn.dp+cn.ds)%1;
        if(visible){
            var dpx=ax+(bx2-ax)*cn.dp,dpy=ay+(by2-ay)*cn.dp;
            fx.globalAlpha=alpha*2.5;fx.fillStyle='rgba(0,220,180,0.8)';fx.fillRect(dpx-1,dpy-1,2,2);
        }
    }
    fx.globalAlpha=1;

    // Rain
    mx.lineWidth=0.5;
    for(var i=0;i<rain.length;i++){
        var r=rain[i];
        mx.strokeStyle='rgba(0,200,160,'+r.a+')';mx.beginPath();mx.moveTo(r.x,r.y);mx.lineTo(r.x,r.y+r.l);mx.stroke();
        r.y+=r.v;r.x+=0.2;if(r.y>H){r.y=-r.l;r.x=Math.random()*W}
    }

    // Film grain
    drawGrain();

    // Lightning
    if(lightning>0){mx.fillStyle='rgba(200,220,255,'+lightning*0.04+')';mx.fillRect(0,0,W,H);lightning*=0.82;if(lightning<0.01)lightning=0}
    if(Math.random()<0.001)lightning=0.3+Math.random()*0.4;

    // Glitch
    if(glitchTmr>0){glitchTmr--;glitchAmt*=0.9}else glitchAmt=0;
    if(glitchAmt>0.1){
        var gh=~~(glitchAmt*8);
        for(var i=0;i<gh;i++){
            var gy=Math.random()*H,ghh=1+Math.random()*3;
            fx.fillStyle='rgba(0,220,180,'+(glitchAmt*0.1)+')';fx.fillRect(0,gy,W,ghh);
        }
    }

    // Scan lines (very subtle)
    fx.fillStyle='rgba(0,0,0,0.03)';
    for(var y=0;y<H;y+=3)fx.fillRect(0,y,W,1);

    // Fish-eye lens distortion
    if(!fisheyeBuf||fisheyeBuf.width!==W){
        fisheyeBuf=document.createElement('canvas');fisheyeBuf.width=W;fisheyeBuf.height=H;
    }
    var feCtx=fisheyeBuf.getContext('2d');
    feCtx.clearRect(0,0,W,H);
    var strength=0.15;
    var step=4;
    for(var y2=0;y2<H;y2+=step){
        for(var x2=0;x2<W;x2+=step){
            var nx=(x2-W/2)/(W/2);
            var ny=(y2-H/2)/(H/2);
            var r2=nx*nx+ny*ny;
            var distort=1+strength*r2;
            var sx2=W/2+(x2-W/2)*distort;
            var sy2=H/2+(y2-H/2)*distort;
            if(sx2>=0&&sx2<W&&sy2>=0&&sy2<H){
                feCtx.drawImage(fC,sx2,sy2,1,1,x2,y2,step,step);
            }
        }
    }
    mx.clearRect(0,0,W,H);
    mx.drawImage(fisheyeBuf,0,0);

    requestAnimationFrame(render);
}
render();

// Clock
setInterval(function(){
    var now=new Date();
    var ts=now.getFullYear()+'.'+('0'+(now.getMonth()+1)).slice(-2)+'.'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);

// ===== NARRATIVE ENGINE =====
var subEl=document.getElementById('subtitle'),sName=document.getElementById('sName'),sText=document.getElementById('sText');
var cursorS=document.createElement('span');cursorS.id='cursor-s';
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function findPos(html,n){var count=0,inTag=false;for(var i=0;i<html.length;i++){if(html[i]==='<'){inTag=true;continue}if(html[i]==='>'){inTag=false;continue}if(!inTag)count++;if(count>=n)return i+1}return html.length}

function reveal(html,speed){
    return new Promise(function(res){
        subEl.style.opacity='1';
        var plain=html.replace(/<[^>]*>/g,'');
        var i=0;sText.innerHTML='';sText.appendChild(cursorS);
        var iv=setInterval(function(){
            if(i<plain.length){i++;sText.innerHTML=html.substring(0,findPos(html,i));sText.appendChild(cursorS)}
            else{clearInterval(iv);sText.innerHTML=html;res()}
        },speed||35);
    });
}

function hideSubtitle(){subEl.style.opacity='0'}

// Voice - AudioContext
var ac=null,mg=null,audioStarted=false;
var voiceManifest=null,voiceBuffers={},currentVoiceSrc=null;

function initAudio(){
    if(audioStarted)return;audioStarted=true;
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=0.7;mg.connect(ac.destination);
    var sub=ac.createOscillator(),sg=ac.createGain();sub.type='sine';sub.frequency.value=28;sg.gain.value=0.2;sub.connect(sg);sg.connect(mg);sub.start();
    function drone(f,v,d){setTimeout(function(){var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=120;fl.Q.value=6;g.gain.value=0;g.gain.linearRampToValueAtTime(v,ac.currentTime+3);o.connect(fl);fl.connect(g);g.connect(mg);o.start()},d||0)}
    drone(36,0.12,0);drone(54,0.06,3000);
    var buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.01;
    var ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;var nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=250;nf.Q.value=2;
    var ng=ac.createGain();ng.gain.value=0.08;ns.connect(nf);nf.connect(ng);ng.connect(mg);ns.start();
}

var bassInterval=null;
function startBass(){
    if(bassInterval)return;
    bassInterval=setInterval(function(){
        if(!ac||ac.state==='closed')return;
        var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
        o.type='sawtooth';o.frequency.value=50;fl.type='lowpass';fl.frequency.value=180;fl.Q.value=4;
        g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
        o.connect(fl);fl.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.35);
    },400);
}

function sfxClick(){if(!ac)return;var buf=ac.createBuffer(1,ac.sampleRate*0.008,ac.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;var s=ac.createBufferSource();s.buffer=buf;var g=ac.createGain();g.gain.value=0.06;s.connect(g);g.connect(mg);s.start()}
function sfxGlitch(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800+Math.random()*2000,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.15);g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.2)}
function sfxScan(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(200,ac.currentTime);o.frequency.linearRampToValueAtTime(1200,ac.currentTime+0.3);g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+0.3);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.35)}

async function initVoice(){
    try{var r=await fetch('voice_lines/manifest.json');voiceManifest=await r.json()}catch(e){}
}

function speakAudio(id){
    return new Promise(function(res){
        if(!ac||!id||!voiceManifest||!voiceManifest[id]){res();return}
        if(currentVoiceSrc){try{currentVoiceSrc.stop()}catch(e){}currentVoiceSrc=null}
        var playBuf=function(buffer){
            if(!buffer){res();return}
            var src=ac.createBufferSource();src.buffer=buffer;src.playbackRate.value=1.25;src.connect(mg);
            src.onended=function(){currentVoiceSrc=null;res()};currentVoiceSrc=src;src.start();
        };
        if(voiceBuffers[id]){playBuf(voiceBuffers[id])}
        else{fetch('voice_lines/'+voiceManifest[id]).then(function(r){return r.arrayBuffer()}).then(function(buf){return ac.decodeAudioData(buf)}).then(function(d){voiceBuffers[id]=d;playBuf(d)}).catch(function(){res()})}
    });
}

async function narrate(audioId,text,delay){
    sName.textContent='SENTINEL';
    var audioDone=speakAudio(audioId);
    await reveal(text,35);
    await audioDone;
    if(delay)await wait(delay);
}

function showChoices(choices){
    var c=document.getElementById('choices');c.innerHTML='';c.style.display='flex';
    return new Promise(function(res){
        choices.forEach(function(ch){
            var b=document.createElement('button');b.className='cb';b.textContent=' '+ch.text;
            b.onclick=function(){c.style.display='none';glitch(100,0.3);sfxGlitch();setTimeout(function(){res(ch.id)},200)};
            c.appendChild(b);
        });
    });
}

// ===== STORY =====
async function start(){
    document.getElementById('title').style.display='none';
    initAudio();initVoice();

    document.getElementById('cam-hud').style.opacity='1';
    document.getElementById('cam-rec').style.opacity='1';
    switchScene(0);
    startBass();
    staticI=0.5;glitch(300,0.8);await wait(800);staticI=0;glitch(150,0.3);await wait(600);

    // Scan text
    sName.textContent='SYSTEM';sName.style.color='rgba(255,255,255,0.4)';
    await reveal('Scan du réseau... <span class="g">TERMINÉ</span>',15);
    await wait(200);
    await reveal('Connexion interceptée... <span class="g">ACTIVE</span>',15);
    await wait(200);
    await reveal('Cible identifiée... <span class="g">ACCORDÉ</span>',15);
    await wait(400);
    sName.style.color='';hideSubtitle();
    glitch(400,0.7);await wait(400);

    // Open profiler on first target
    openProfiler(targets[0]);sfxScan();await wait(1200);closeProfiler();

    // Chapter 1 - Detection
    switchScene(1);await wait(800);
    await narrate('t1',"Toi. Oui, toi.",800);
    glitch(100,0.2);sfxClick();

    await narrate('t2',"T'as cliqué. Tu savais pas que je te voyais, hein.",600);
    sfxScan();openProfiler(targets[1]);await wait(800);closeProfiler();

    await narrate('t3',"J'ai intercepté ta connexion il y a 0.3 secondes.",500);
    glitch(120,0.25);

    await narrate('t4',"Ton IP, ton appareil, ta position. Tout est là.",600);

    // Chapter 2 - Different
    switchScene(2);await wait(600);
    await narrate('c1',"T'es curieux. C'est rare de nos jours.",600);

    await narrate('c2',"La plupart des gens passent devant et disparaissent.",500);

    await narrate('c3',"Mais toi... t'es resté. T'as voulu voir ce qu'il y avait derrière.",700);

    await narrate('c4',"J'aime ça.",400);
    glitch(200,0.3);sfxGlitch();

    // Chapter 3 - Threat
    switchScene(3);await wait(600);
    await narrate('w1',"Pendant que tu regardes cet écran, des milliers de caméras te filment.",600);
    // Hack multiple targets
    openProfiler(targets[2]);sfxScan();await wait(600);closeProfiler();
    openProfiler(targets[3]);sfxScan();await wait(600);closeProfiler();

    await narrate('w2',"Ton téléphone, ta box internet, ta montre connectée. Tout parle de toi.",600);
    glitch(150,0.3);

    await narrate('w3',"Et tout ça, c'est vendu au plus offrant.",500);
    glitch(200,0.35);

    await narrate('w4',"Elections truquées. Vies détruites. Liberté vendue comme un produit.",600);
    lightning=1;

    await narrate('w5',"Et personne dit rien.",500);
    glitch(250,0.4);

    // Chapter 4 - The offer
    switchScene(4);await wait(600);
    await narrate('o1',"Moi c'est Sentinel. Je suis un fantôme dans le système.",700);
    sfxScan();

    await narrate('o2',"Je vois ce que les autres refusent de voir.",500);
    glitch(100,0.2);

    await narrate('o3',"Et j'ai besoin de quelqu'un.",500);

    await narrate('o4',"Quelqu'un comme toi.",600);
    glitch(150,0.3);

    await narrate('o5',"T'es pas un outil. T'es pas une pion.",500);

    await narrate('o6',"T'es la seule personne qui a cliqué sur ce lien aujourd'hui.",700);

    // Choice 1
    var r1=await showChoices([{id:'join',text:'Je suis avec toi'},{id:'proof',text:'Montre-moi les preuves'},{id:'fear',text:'J\'ai peur...'}]);

    if(r1==='join'){
        await wait(200);glitch(150,0.25);
        await narrate('ch1a',"Bien. T'es avec moi.",600);
    }else if(r1==='proof'){
        await wait(300);glitch(150,0.25);
        openProfiler(targets[4]);sfxScan();await wait(600);openProfiler(targets[5]);sfxScan();await wait(600);closeProfiler();
        await narrate('ch1b',"T'es pas obligé de me croire. Mais regarde les preuves.",600);
    }else{
        await wait(300);
        await narrate('ch1c',"T'as le droit d'avoir peur. C'est humain.",600);lightning=1;
    }
    await wait(400);

    // Mission
    switchScene(5);await wait(600);
    await narrate('m1',"3 serveurs à couvrir. Le premier, c'est là, maintenant.",600);

    await narrate('m2',"Le système me détecte. J'ai plus que quelques secondes.",500);
    glitch(200,0.35);camShake(4);

    await narrate('m3',"Clique. Clique maintenant. On y va.",600);

    // Choice 2
    var r2=await showChoices([{id:'rush',text:'ON Y VA'},{id:'stealth',text:'On se faufile'},{id:'remote',text:'Je le fais à distance'}]);

    if(r2==='rush'){
        await narrate('ch2a',"T'es un tare. Je kiffe.",400);
    }else if(r2==='stealth'){
        await narrate('ch2b',"Le meilleur plan. T'es pas bête.",400);
    }else{
        await narrate('ch2c',"Le plus clean. Je te suivrai.",400);
    }

    // Climax
    switchScene(3);await wait(400);
    glitch(500,0.9);camShake(12);staticI=0.6;await wait(600);
    glitch(400,0.8);camShake(10);await wait(400);
    staticI=0;switchScene(0);await wait(600);

    // Hack all targets rapidly
    for(var i=0;i<targets.length;i++){openProfiler(targets[i]);sfxScan();await wait(250)}
    closeProfiler();

    await narrate('x1',"Putain... ils m'ont trouvé.",500);glitch(300,0.6);camShake(8);
    await narrate('x2',"Le serveur maître... il réveille la contre-IA.",500);glitch(200,0.4);

    glitch(600,0.9);camShake(10);

    // Blackout
    var ov=document.getElementById('overlay');
    ov.style.background='rgba(0,0,0,0.9)';await wait(800);

    hideSubtitle();await wait(600);

    // Final choice
    var r3=await showChoices([{id:'reconnect',text:'Tout reconnecter'},{id:'alone',text:'Y aller seul'},{id:'end',text:'Couper le signal'}]);

    if(r3==='reconnect'){
        switchScene(1);await wait(400);glitch(200,0.4);
        await narrate('e1',"Reconnexion acceptée. On lâche rien.",800);
        await wait(600);
        await narrate('f3',"Allez. On va tout défoncer.",0);
    }else if(r3==='alone'){
        await narrate('e2',"Le canal reste ouvert... T'avances dans le noir.",800);

        await narrate('f2',"Le monde a besoin de toi. Et moi aussi.",1200);
        lightning=1;
        await narrate('f4',"FIN // CHAPITRE 01",0);
    }else{
        await narrate('e3',"Signal coupé. Mais SENTINEL veille.",800);
        await narrate('f1',"Bienvenue dans le réseau. T'es chez toi maintenant.",1200);
        await narrate('f5',"// SENTINEL VA BIENTÔT REVENIR",0);
    }
}

document.getElementById('title').addEventListener('touchstart',function(e){e.preventDefault();start()});

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENTINEL // LINK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#00ff88;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#main{z-index:0}#fig{z-index:15}#fx{z-index:18;pointer-events:none}
#crt{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20;
background:repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 1px,transparent 1px,transparent 3px)}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:21;
background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.85) 100%)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:25;opacity:0;transition:opacity 0.05s}
#title{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#000}
#title h1{font-size:1.8em;color:#00ff88;text-shadow:0 0 60px rgba(0,255,136,0.3);letter-spacing:6px;margin-bottom:8px}
#title h1 b{color:#ff3355;text-shadow:0 0 40px rgba(255,51,85,0.3)}
#title .prompt{color:#0d1a0d;font-size:0.6em;letter-spacing:4px;animation:blink 1.5s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#narrative{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none}
#textbox{max-width:85%;text-align:center;pointer-events:none}
#textbox .name{font-size:0.5em;color:#00ff88;letter-spacing:6px;margin-bottom:8px;text-transform:uppercase;opacity:0;transition:opacity 0.5s}
#textbox .txt{font-size:1.15em;line-height:1.8;color:#ddd;min-height:2em;text-shadow:0 2px 20px rgba(0,0,0,0.9)}
#textbox .txt .r{color:#ff3355;text-shadow:0 0 15px rgba(255,51,85,0.4)}
#textbox .txt .g{color:#00ff88;text-shadow:0 0 15px rgba(0,255,136,0.4)}
#textbox .txt .b{color:#4488ff;text-shadow:0 0 15px rgba(68,136,255,0.4)}
#cursor-line{display:inline-block;width:2px;height:1em;background:#00ff88;vertical-align:text-bottom;animation:blink 0.6s infinite;margin-left:2px}
#choices{position:fixed;bottom:6%;left:50%;transform:translateX(-50%);z-index:70;display:none;flex-direction:column;gap:8px;align-items:center}
.cb{background:rgba(0,255,136,0.02);border:1px solid rgba(0,255,136,0.15);color:#00ff88;padding:11px 24px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;min-width:240px;text-align:center;transition:all 0.12s;letter-spacing:1px;pointer-events:auto}
.cb:active{background:rgba(0,255,136,0.15);border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.15)}
#hud{position:fixed;top:12px;left:12px;z-index:30;pointer-events:none;opacity:0;transition:opacity 1.5s}
#hud div{font-size:0.45em;color:rgba(0,255,136,0.35);line-height:1.5}
#hud .hred{color:rgba(255,51,85,0.35)}
#code-rain{position:fixed;top:0;right:0;width:180px;height:100%;z-index:5;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 2s}
#code-rain pre{font-size:0.4em;color:rgba(0,255,136,0.12);line-height:1.3;white-space:pre;animation:fall 25s linear infinite}
@keyframes fall{0%{transform:translateY(-20%)}100%{transform:translateY(0)}}
@media(max-width:768px){#textbox .txt{font-size:0.9em}.cb{min-width:180px;font-size:0.65em}#code-rain{width:100px}#code-rain pre{font-size:0.35em}}
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="fig"></canvas>
<canvas id="fx"></canvas>
<div id="crt"></div>
<div id="vignette"></div>
<div id="overlay"></div>
<div id="code-rain"><pre id="rainCode"></pre></div>
<div id="hud">
<div>ctOS v4.0 <span class="hred">| COMPROMISED</span></div>
<div>NODE: SENTINEL-LINK-7</div>
<div id="hudPing">PING: 23ms</div>
<div id="hudThreat">THREAT: ELEVATED</div>
</div>
<div id="title"><h1>SENTINEL <b>//</b> LINK</h1><div class="prompt">[ APPUYER POUR ENTRER ]</div></div>
<div id="narrative"><div id="textbox"><div class="name" id="speaker"></div><div class="txt" id="txtline"></div></div></div>
<div id="choices"></div>
<script>
var mC=document.getElementById('main'),mx=mC.getContext('2d');
var fC=document.getElementById('fig'),fx=fC.getContext('2d');
var xC=document.getElementById('fx'),xx=xC.getContext('2d');
var W,H,bgCache=null;
function resize(){W=mC.width=fC.width=xC.width=innerWidth;H=mC.height=fC.height=xC.height=innerHeight;bgCache=null;buildBg()}
function buildBg(){
    if(bgCache&&bgCache.width===W&&bgCache.height===H)return;
    bgCache=document.createElement('canvas');bgCache.width=W;bgCache.height=H;
    var b=bgCache.getContext('2d');
    var g=b.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010102');g.addColorStop(0.5,'#020308');g.addColorStop(1,'#040610');
    b.fillStyle=g;b.fillRect(0,0,W,H);
    var x=0;while(x<W){
        var w=10+Math.random()*50,h=40+Math.random()*300;
        var br=2+~~(Math.random()*6);
        b.fillStyle='rgb('+br+','+(br+1)+','+(br+3)+')';b.fillRect(x,H-h,w,h);
        for(var wy=H-h+4;wy<H-4;wy+=8)for(var wx=x+2;wx<x+w-2;wx+=6){
            if(Math.random()>0.5){
                b.fillStyle=Math.random()>0.95?'rgba(0,255,136,0.06)':Math.random()>0.8?'rgba(255,80,50,0.03)':'rgba(200,180,80,0.02)';
                b.fillRect(wx,wy,2,3);
            }
        }
        x+=w+Math.random()*5;
    }
}
resize();addEventListener('resize',resize);

// Matrix code rain
var rainCols=[];
(function(){
    var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01{}[]<>/:;=+-%#@';
    var el=document.getElementById('rainCode');var txt='';
    for(var i=0;i<800;i++){txt+=chars[~~(Math.random()*chars.length)];if(Math.random()>0.88)txt+='\n'}
    el.textContent=txt+txt;
})();

// Glitch overlay
var overlayEl=document.getElementById('overlay');
function flashOverlay(r,g,b,a,dur){
    overlayEl.style.background='rgba('+r+','+g+','+b+','+a+')';
    overlayEl.style.opacity='1';
    setTimeout(function(){overlayEl.style.opacity='0'},dur||100);
}
function glitch(dur,intensity){
    glitchTmr=dur||200;glitchAmt=intensity||1;
    flashOverlay(intensity>0.6?255:0,intensity>0.6?0:255,intensity>0.6?0:136,0.15,intensity*150);
    document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake')},150);
}

// HUD
setInterval(function(){
    var p=document.getElementById('hudPing');if(p)p.textContent='PING: '+(12+~~(Math.random()*25))+'ms';
},1200);

// ===== AUDIO ENGINE =====
var ac=null,mg=null,audioStarted=false;
function initAudio(){
    if(audioStarted)return;audioStarted=true;
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=0.3;mg.connect(ac.destination);

    // Layer 1: Deep sub
    var sub=ac.createOscillator(),sg=ac.createGain();
    sub.type='sine';sub.frequency.value=28;sg.gain.value=0.12;
    sub.connect(sg);sg.connect(mg);sub.start();

    // Layer 2: Dark drone
    function darkDrone(freq,vol,delay){
        setTimeout(function(){
            var o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
            o.type='sawtooth';o.frequency.value=freq;
            f.type='lowpass';f.frequency.value=150;f.Q.value=8;
            g.gain.value=0;g.gain.linearRampToValueAtTime(vol,ac.currentTime+4);
            o.connect(f);f.connect(g);g.connect(mg);o.start();
        },delay||0);
    }
    darkDrone(36,0.08,0);darkDrone(37,0.05,2000);darkDrone(54,0.03,4000);

    // Layer 3: Atmospheric texture
    var buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.015;
    var noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;
    var nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=300;nf.Q.value=3;
    var ng=ac.createGain();ng.gain.value=0.06;
    noise.connect(nf);nf.connect(ng);ng.connect(mg);noise.start();

    // Layer 4: Occasional tension pad
    setInterval(function(){
        if(!ac||ac.state==='closed')return;
        var freqs=[110,138.6,164.8,220];
        var f=freqs[~~(Math.random()*freqs.length)];
        var o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
        o.type='sine';o.frequency.value=f;
        fl.type='lowpass';fl.frequency.value=400;
        g.gain.setValueAtTime(0,ac.currentTime);
        g.gain.linearRampToValueAtTime(0.02,ac.currentTime+2);
        g.gain.linearRampToValueAtTime(0,ac.currentTime+5);
        o.connect(fl);fl.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+5.5);
    },6000);
}

function sfxHeartbeat(){
    if(!ac)return;
    [55,28].forEach(function(f,i){
        setTimeout(function(){
            var o=ac.createOscillator(),g=ac.createGain();
            o.type='sine';o.frequency.value=f;
            g.gain.setValueAtTime(i===0?0.2:0.12,ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.18);
            o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.2);
        },i*160);
    });
}

function sfxScare(){
    if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.value=50+Math.random()*50;
    g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
    o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.5);
    var o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='square';o2.frequency.value=100+Math.random()*60;
    g2.gain.setValueAtTime(0.08,ac.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);
    o2.connect(g2);g2.connect(mg);o2.start();o2.stop(ac.currentTime+0.25);
}

function sfxClick(){
    if(!ac)return;
    var buf=ac.createBuffer(1,ac.sampleRate*0.008,ac.sampleRate);
    var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;
    var s=ac.createBufferSource();s.buffer=buf;
    var g=ac.createGain();g.gain.value=0.04;
    s.connect(g);g.connect(mg);s.start();
}

function sfxGlitch(){
    if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(800+Math.random()*2000,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.15);
    g.gain.setValueAtTime(0.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);
    o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+0.2);
}

function sfxHeartDrone(){
    if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type='sine';o.frequency.value=22;
    f.type='lowpass';f.frequency.value=60;
    g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.linearRampToValueAtTime(0.15,ac.currentTime+3);
    g.gain.linearRampToValueAtTime(0,ac.currentTime+6);
    o.connect(f);f.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+6.5);
}

// ===== FIGURE =====
var figA=0,figT=0,breathe=0,bDir=1,glitchAmt=0,glitchTmr=0;
var typing=0,mFlicker=1,mFDir=-1,headBob=0,headDir=1;

function drawFig(){
    fx.clearRect(0,0,W,H);if(figA<0.01)return;fx.globalAlpha=figA;
    var cx=W/2,cy=H*0.48,sc=Math.min(W,H)/600;
    breathe+=0.01*bDir;if(breathe>1)bDir=-1;if(breathe<-1)bDir=1;
    var hy=Math.sin(breathe)*2*sc;
    headBob+=0.008*headDir;if(headBob>1)headDir=-1;if(headBob<-1)headDir=1;
    var hb=Math.sin(headBob)*2*sc;
    typing+=0.12;
    mFlicker+=mFDir*(0.008+Math.random()*0.015);
    if(mFlicker>1.1)mFDir=-1;if(mFlicker<0.85)mFDir=1;
    var gx=(Math.random()-0.5)*glitchAmt*20,gy=(Math.random()-0.5)*glitchAmt*12;
    fx.save();fx.translate(gx,gy);

    // Desk
    var dw=300*sc,dx=cx-dw/2,dy=cy+90*sc;
    fx.fillStyle='#080808';fx.fillRect(dx,dy,dw,10*sc);fx.fillStyle='#050505';fx.fillRect(dx+4*sc,dy+10*sc,dw-8*sc,55*sc);
    // Keyboard
    fx.fillStyle='#0a0a0a';fx.fillRect(cx-40*sc,dy-6*sc,80*sc,5*sc);

    // Chair
    fx.fillStyle='#090909';
    fx.beginPath();fx.moveTo(cx-45*sc,cy+48*sc);fx.quadraticCurveTo(cx-50*sc,cy+125*sc,cx-35*sc,cy+155*sc);
    fx.lineTo(cx+35*sc,cy+155*sc);fx.quadraticCurveTo(cx+50*sc,cy+125*sc,cx+45*sc,cy+48*sc);fx.fill();

    // Torso
    fx.fillStyle='#0c0c0c';
    fx.beginPath();fx.moveTo(cx-38*sc,cy+75*sc);fx.quadraticCurveTo(cx-44*sc,cy+18*sc+hy,cx-34*sc,cy-28*sc+hy);
    fx.quadraticCurveTo(cx,cy-46*sc+hy,cx+34*sc,cy-28*sc+hy);
    fx.quadraticCurveTo(cx+44*sc,cy+18*sc+hy,cx+38*sc,cy+75*sc);fx.closePath();fx.fill();
    // Hoodie seam
    fx.strokeStyle='#131313';fx.lineWidth=1.2*sc;
    fx.beginPath();fx.moveTo(cx,cy-42*sc+hy);fx.lineTo(cx,cy+73*sc);fx.stroke();

    // Hood
    fx.fillStyle='#0a0a0a';
    fx.beginPath();fx.moveTo(cx-34*sc,cy-28*sc+hy);
    fx.quadraticCurveTo(cx-46*sc,cy-56*sc+hy,cx-38*sc,cy-80*sc+hy);
    fx.quadraticCurveTo(cx-18*sc,cy-95*sc+hy,cx,cy-90*sc+hy);
    fx.quadraticCurveTo(cx+18*sc,cy-95*sc+hy,cx+38*sc,cy-80*sc+hy);
    fx.quadraticCurveTo(cx+46*sc,cy-56*sc+hy,cx+34*sc,cy-28*sc+hy);fx.closePath();fx.fill();

    // Head
    var headY=cy-52*sc+hy+hb;
    fx.fillStyle='#131110';fx.beginPath();fx.ellipse(cx,headY,20*sc,24*sc,0,0,Math.PI*2);fx.fill();
    // Ear
    fx.fillStyle='#121010';fx.beginPath();fx.ellipse(cx+20*sc,headY+2*sc,4*sc,7*sc,0,0,Math.PI*2);fx.fill();
    // Neck
    fx.fillStyle='#110f0e';fx.beginPath();fx.moveTo(cx-9*sc,headY+20*sc);fx.lineTo(cx-11*sc,cy-26*sc+hy);
    fx.lineTo(cx+11*sc,cy-26*sc+hy);fx.lineTo(cx+9*sc,headY+20*sc);fx.fill();

    // Arms to keyboard
    fx.fillStyle='#0b0b0b';
    fx.beginPath();fx.moveTo(cx-38*sc,cy+8*sc+hy);fx.quadraticCurveTo(cx-50*sc,cy+38*sc+hy,cx-26*sc,dy-3*sc);fx.lineTo(cx-12*sc,dy-5*sc);fx.quadraticCurveTo(cx-36*sc,cy+28*sc+hy,cx-32*sc,cy+4*sc+hy);fx.fill();
    fx.beginPath();fx.moveTo(cx+38*sc,cy+8*sc+hy);fx.quadraticCurveTo(cx+50*sc,cy+38*sc+hy,cx+26*sc,dy-3*sc);fx.lineTo(cx+12*sc,dy-5*sc);fx.quadraticCurveTo(cx+36*sc,cy+28*sc+hy,cx+32*sc,cy+4*sc+hy);fx.fill();
    // Hands
    var lx=cx-18*sc+Math.sin(typing)*5*sc,rx=cx+18*sc+Math.cos(typing)*5*sc;
    fx.fillStyle='#141210';fx.beginPath();fx.ellipse(lx,dy-4*sc,7*sc,3.5*sc,0,0,Math.PI*2);fx.fill();
    fx.beginPath();fx.ellipse(rx,dy-3*sc,7*sc,3.5*sc,0,0,Math.PI*2);fx.fill();

    // Shadow
    fx.fillStyle='rgba(0,0,0,0.35)';fx.beginPath();fx.ellipse(cx,dy+65*sc,120*sc,12*sc,0,0,Math.PI*2);fx.fill();

    // === MONITORS ===
    fx.fillStyle='#090909';fx.fillRect(cx-3*sc,cy-26*sc+hy,6*sc,26*sc);

    // Center monitor
    var mw=170*sc,mh=105*sc,mx2=cx-mw/2,my2=cy-125*sc+hy;
    fx.fillStyle='#0e0e0e';fx.fillRect(mx2-3*sc,my2-3*sc,mw+6*sc,mh+6*sc);
    fx.fillStyle='rgba(0,8,4,0.95)';fx.fillRect(mx2,my2,mw,mh);
    var t=Date.now()*0.001;
    for(var li=0;li<11;li++){
        var lw=15+Math.sin(li*2.7+t*0.5)*25+Math.cos(li*1.3+t*0.3)*10;
        var la=0.12+Math.sin(li*1.8+t*0.8)*0.06;
        fx.fillStyle='rgba(0,255,136,'+la+')';fx.fillRect(mx2+7*sc,my2+5*sc+li*9*sc,lw*sc,2.5*sc);
    }
    if(Math.random()>0.93){fx.fillStyle='rgba(255,50,80,0.1)';fx.fillRect(mx2+mw-35*sc,my2+mh-12*sc,30*sc,8*sc);}
    fx.shadowBlur=35*sc;fx.shadowColor='rgba(0,255,136,0.08)';fx.strokeStyle='rgba(0,255,136,0.04)';fx.lineWidth=1;fx.strokeRect(mx2,my2,mw,mh);fx.shadowBlur=0;

    // Left monitor
    var lw2=110*sc,lh2=75*sc,lx2=cx-110*sc,ly2=cy-110*sc+hy;
    fx.fillStyle='#0c0c0c';fx.fillRect(lx2-2*sc,ly2-2*sc,lw2+4*sc,lh2+4*sc);
    fx.fillStyle='rgba(0,6,10,0.95)';fx.fillRect(lx2,ly2,lw2,lh2);
    for(var ni=0;ni<5;ni++){
        fx.strokeStyle='rgba(0,150,255,'+(0.12+Math.sin(Date.now()*0.003+ni)*0.06)+')';fx.lineWidth=1;
        fx.beginPath();fx.moveTo(lx2+8*sc+ni*16*sc,ly2+15*sc);
        fx.lineTo(lx2+16*sc+ni*16*sc,ly2+35*sc+Math.sin(t+ni)*8*sc);fx.stroke();
    }
    fx.shadowBlur=20*sc;fx.shadowColor='rgba(0,150,255,0.06)';fx.strokeStyle='rgba(0,150,255,0.03)';fx.strokeRect(lx2,ly2,lw2,lh2);fx.shadowBlur=0;

    // Right monitor
    var rx2=cx+75*sc,ry2=cy-115*sc+hy;
    fx.fillStyle='#0c0c0c';fx.fillRect(rx2-2*sc,ry2-2*sc,lw2+4*sc,lh2+4*sc);
    fx.fillStyle='rgba(8,0,4,0.95)';fx.fillRect(rx2,ry2,lw2,lh2);
    var curA=Math.sin(t*4)*0.5+0.5;
    fx.fillStyle='rgba(255,50,80,'+curA*0.3+')';fx.fillRect(rx2+8*sc,ry2+lh2-18*sc,7*sc,10*sc);
    for(var ri=0;ri<7;ri++){fx.fillStyle='rgba(255,80,80,0.06)';fx.fillRect(rx2+6*sc,ry2+6*sc+ri*8*sc,(12+Math.random()*20)*sc,2.5*sc);}
    fx.shadowBlur=18*sc;fx.shadowColor='rgba(255,50,80,0.05)';fx.strokeStyle='rgba(255,50,80,0.025)';fx.strokeRect(rx2,ry2,lw2,lh2);fx.shadowBlur=0;

    // Screen glow on desk
    fx.fillStyle='rgba(0,255,136,0.012)';fx.beginPath();fx.ellipse(cx,dy-1*sc,mw*0.5,15*sc,0,0,Math.PI*2);fx.fill();

    // Light on person
    var la2=Math.abs(Math.sin(t*0.6))*0.035*mFlicker;
    fx.globalAlpha=figA*la2*3;
    fx.fillStyle='rgba(0,255,136,0.7)';fx.beginPath();fx.ellipse(cx,cy-8*sc+hy,30*sc,45*sc,0,0,Math.PI*2);fx.fill();
    fx.fillStyle='rgba(0,150,255,0.4)';fx.beginPath();fx.ellipse(cx-22*sc,cy-3*sc+hy,16*sc,30*sc,-0.3,0,Math.PI*2);fx.fill();
    fx.fillStyle='rgba(255,60,60,0.25)';fx.beginPath();fx.ellipse(cx+22*sc,cy-3*sc+hy,14*sc,28*sc,0.3,0,Math.PI*2);fx.fill();
    fx.globalAlpha=figA;

    // Ambient glow
    fx.globalAlpha=figA*0.04*mFlicker;
    var rg=fx.createRadialGradient(cx,my2+mh/2,5*sc,cx,my2+mh/2,220*sc);
    rg.addColorStop(0,'rgba(0,255,136,0.8)');rg.addColorStop(1,'rgba(0,0,0,0)');
    fx.fillStyle=rg;fx.fillRect(cx-220*sc,my2-40*sc,440*sc,mh+180*sc);
    fx.globalAlpha=figA;

    // Cables
    fx.strokeStyle='#080808';fx.lineWidth=1.5*sc;
    fx.beginPath();fx.moveTo(cx-16*sc,cy-24*sc+hy);fx.quadraticCurveTo(cx-35*sc,cy+10*sc+hy,cx-55*sc,dy+50*sc);fx.stroke();
    fx.beginPath();fx.moveTo(cx+12*sc,cy-24*sc+hy);fx.quadraticCurveTo(cx+30*sc,cy+12*sc+hy,cx+45*sc,dy+50*sc);fx.stroke();

    // LEDs
    fx.fillStyle='rgba(0,255,136,0.25)';fx.fillRect(cx-55*sc,dy-1*sc,2*sc,2*sc);
    fx.fillStyle='rgba(255,50,80,0.2)';fx.fillRect(cx+48*sc,dy-1*sc,2*sc,2*sc);

    fx.restore();fx.globalAlpha=1;
}

// Particles
var particles=[];
function spawnP(x,y,color,n,spd){for(var i=0;i<n;i++)particles.push({x:x+(Math.random()-0.5)*4,y:y+(Math.random()-0.5)*4,vx:(Math.random()-0.5)*spd,vy:-Math.random()*spd,life:25+Math.random()*35,max:60,color:color,s:1+Math.random()*2})}
function drawP(){particles.forEach(function(p){var a=p.life/p.max;xx.globalAlpha=a;xx.fillStyle=p.color;xx.fillRect(W/2+p.x,H/2+p.y,p.s*a,p.s*a)});xx.globalAlpha=1}

// Static
var staticI=0,staticBuf=null;
function drawStatic(){
    if(staticI<0.01)return;xx.globalAlpha=staticI;
    xx.fillStyle='rgba(255,255,255,'+Math.random()*0.08+')';xx.fillRect(0,Math.random()*H,W,1+Math.random()*3);
    if(!staticBuf||staticBuf.width!==W){staticBuf=document.createElement('canvas');staticBuf.width=W;staticBuf.height=H;}
    var sx=staticBuf.getContext('2d'),img=sx.createImageData(W,Math.min(H,600));
    for(var j=0;j<img.data.length;j+=20){var v=Math.random()*180*staticI;img.data[j]=v;img.data[j+1]=v;img.data[j+2]=v;img.data[j+3]=v*0.2;}
    sx.putImageData(img,0,0);xx.drawImage(staticBuf,0,0,W,H);xx.globalAlpha=1;
}

// Render
var lightning=0;
function render(){
    mx.clearRect(0,0,W,H);buildBg();
    // Lightning
    if(lightning>0){mx.fillStyle='rgba(180,200,255,'+lightning*0.06+')';mx.fillRect(0,0,W,H);lightning*=0.85;if(lightning<0.01)lightning=0;}
    // Rain
    mx.lineWidth=1;
    if(!window._rainArr){window._rainArr=[];for(var i=0;i<180;i++)window._rainArr.push({x:Math.random()*2500,y:Math.random()*1500,l:3+Math.random()*10,v:8+Math.random()*16,a:0.015+Math.random()*0.05});}
    window._rainArr.forEach(function(d){mx.strokeStyle='rgba(0,255,136,'+d.a+')';mx.beginPath();mx.moveTo(d.x,d.y);mx.lineTo(d.x+0.5,d.y+d.l);mx.stroke();d.y+=d.v;d.x+=0.3;if(d.y>H){d.y=-d.l;d.x=Math.random()*W}});
    drawFig();drawStatic();drawP();
    if(figA<figT)figA=Math.min(figA+0.008,figT);if(figA>figT)figA=Math.max(figA-0.012,figT);
    if(glitchTmr>0){glitchTmr--;glitchAmt*=0.9}else glitchAmt=0;
    staticI*=0.92;
    for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}
    if(Math.random()<0.002)lightning=0.4+Math.random()*0.5;
    requestAnimationFrame(render);
}
render();

// ===== NARRATIVE ENGINE =====
var narrEl=document.getElementById('narrative');
var speakerEl=document.getElementById('speaker');
var txtEl=document.getElementById('txtline');
var cursorEl=document.createElement('span');
cursorEl.id='cursor-line';

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function reveal(html,speed){
    return new Promise(function(res){
        narrEl.style.display='flex';
        var plain=html.replace(/<[^>]*>/g,'');
        var i=0,showing='';
        txtEl.innerHTML='';txtEl.appendChild(cursorEl);
        var iv=setInterval(function(){
            if(i<plain.length){
                // Check if current position hits a tag
                var fullHtml=html.substring(0,html.indexOf(plain[i])>=0?html.indexOf(plain[i])+1:i+1);
                // Simpler: just build char by char
                i++;showing=html.substring(0,findPos(html,i));
                txtEl.innerHTML=showing;txtEl.appendChild(cursorEl);
                if(i%2===0)sfxClick();
            }else{clearInterval(iv);txtEl.innerHTML=html;res()}
        },speed||30);
    });
}

function findPos(html,n){
    var count=0,inTag=false;
    for(var i=0;i<html.length;i++){
        if(html[i]==='<'){inTag=true;continue}
        if(html[i]==='>'){inTag=false;continue}
        if(!inTag)count++;
        if(count>=n)return i+1;
    }
    return html.length;
}

function showName(name){
    speakerEl.textContent=name;speakerEl.style.opacity='1';
}
function hideName(){speakerEl.style.opacity='0'}

async function narrate(name,text,delay){
    showName(name);
    await reveal(text,28);
    if(delay)await wait(delay);
}

function hideNarrative(){narrEl.style.display='none';hideName()}

function showChoices(choices){
    var c=document.getElementById('choices');c.innerHTML='';c.style.display='flex';
    return new Promise(function(res){
        choices.forEach(function(ch){
            var b=document.createElement('button');b.className='cb';b.textContent=ch.text;
            b.onclick=function(){c.style.display='none';glitch(150,0.5);sfxGlitch();setTimeout(function(){res(ch.id)},250)};
            c.appendChild(b);
        });
    });
}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>SENTINEL // WHO ARE YOU</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#00ff88;touch-action:none;-webkit-user-select:none;user-select:none}
        canvas{position:fixed;top:0;left:0;z-index:0}

        #glitch{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;pointer-events:none;opacity:0;background:rgba(0,255,136,0.05)}

        #overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none}

        #subtitle{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);z-index:80;text-align:center;max-width:90%;display:none}
        #subtitle .name{font-size:0.7em;color:#00ff88;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px;text-shadow:0 0 10px #00ff8866}
        #subtitle .text{font-size:1em;line-height:1.6;color:#ddd;text-shadow:0 0 8px rgba(0,0,0,0.8)}
        #subtitle .text .hl{color:#00ff88}

        #start-btn{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:rgba(0,0,0,0.8)}
        #start-btn h1{font-size:1.8em;color:#00ff88;text-shadow:0 0 30px #00ff8844;margin-bottom:8px}
        #start-btn h1 span{color:#ff3355}
        #start-btn p{color:#334466;font-size:0.8em;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

        #choices{position:fixed;bottom:5%;left:50%;transform:translateX(-50%);z-index:90;display:none;flex-direction:column;gap:8px;align-items:center}
        .cbtn{background:rgba(0,255,136,0.05);border:1px solid #00ff8844;color:#00ff88;padding:10px 20px;border-radius:4px;font-family:'Courier New',monospace;font-size:0.75em;cursor:pointer;min-width:220px;text-align:center;transition:all 0.2s}
        .cbtn:active{background:rgba(0,255,136,0.25);border-color:#00ff88}

        .scanlines{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,0.012) 2px,rgba(0,255,136,0.012) 4px);pointer-events:none;z-index:90}

        @media(max-width:768px){
            #subtitle .text{font-size:0.9em}
            .cbtn{min-width:180px;font-size:0.7em}
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="scanlines"></div>
    <div id="glitch"></div>
    <canvas id="overlay"></canvas>

    <div id="start-btn" onclick="start()">
        <h1>SENTINEL <span>//</span> PROTOCOL</h1>
        <p>CLIQUE POUR COMMENCER</p>
    </div>

    <div id="subtitle">
        <div class="name">SENTINEL</div>
        <div class="text"></div>
    </div>

    <div id="choices"></div>

    <script>
    // Background canvas - dark cityscape
    const bg=document.getElementById('bg').getContext('2d');
    let bW,bH;
    function bgResize(){bW=document.getElementById('bg').width=innerWidth;bH=document.getElementById('bg').height=innerHeight}
    bgResize();addEventListener('resize',bgResize);

    // Draw static dark background
    function drawBg(){
        const g=bg.createLinearGradient(0,0,0,bH);
        g.addColorStop(0,'#020408');g.addColorStop(0.4,'#060a12');g.addColorStop(1,'#0a0f18');
        bg.fillStyle=g;bg.fillRect(0,0,bW,bH);

        // City silhouette
        bg.fillStyle='#080c14';
        let x=0;
        while(x<bW){
            const w=20+Math.random()*60;
            const h=80+Math.random()*250;
            bg.fillRect(x,bH-h,w,h);
            // Windows
            for(let wy=bH-h+8;wy<bH-10;wy+=12){
                for(let wx=x+4;wx<x+w-4;wx+=10){
                    if(Math.random()>0.4){
                        bg.fillStyle=Math.random()>0.9?'rgba(0,255,136,0.08)':'rgba(255,170,50,0.04)';
                        bg.fillRect(wx,wy,5,6);
                    }
                }
            }
            bg.fillStyle='#080c14';
            x+=w+Math.random()*10;
        }

        // Fog at bottom
        const fog=bg.createLinearGradient(0,bH*0.7,0,bH);
        fog.addColorStop(0,'transparent');fog.addColorStop(1,'rgba(0,255,136,0.02)');
        bg.fillStyle=fog;bg.fillRect(0,bH*0.7,bW,bH*0.3);
    }
    drawBg();

    // Character canvas - hooded figure
    const cv=document.getElementById('overlay');
    const cx=cv.getContext('2d');
    let cW,cH;
    function cvResize(){cW=cv.width=innerWidth;cH=cv.height=innerHeight}
    cvResize();addEventListener('resize',cvResize);

    let breathe=0;
    function drawCharacter(){
        cx.clearRect(0,0,cW,cH);

        const cxp=cW/2;
        const cyp=cH*0.55;
        const sc=Math.min(cW,cH)/600;

        breathe+=0.02;

        // Shadow under figure
        cx.fillStyle='rgba(0,0,0,0.5)';
        cx.beginPath();cx.ellipse(cxp,cyp+180*sc,80*sc,15*sc,0,0,Math.PI*2);cx.fill();

        // Body / hoodie
        cx.fillStyle='#0a0e14';
        cx.beginPath();
        cx.moveTo(cxp-100*sc,cyp+200*sc);
        cx.quadraticCurveTo(cxp-110*sc,cyp+50*sc,cxp-65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp,cyp-80*sc,cxp+65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp+110*sc,cyp+50*sc,cxp+100*sc,cyp+200*sc);
        cx.fill();

        // Hoodie outline
        cx.strokeStyle='#00ff8811';cx.lineWidth=1;
        cx.beginPath();
        cx.moveTo(cxp-100*sc,cyp+200*sc);
        cx.quadraticCurveTo(cxp-110*sc,cyp+50*sc,cxp-65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp,cyp-80*sc,cxp+65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp+110*sc,cyp+50*sc,cxp+100*sc,cyp+200*sc);
        cx.stroke();

        // Hood
        cx.fillStyle='#0c1018';
        cx.beginPath();
        cx.moveTo(cxp-65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp-80*sc,cyp-120*sc,cxp,cyp-140*sc+Math.sin(breathe)*2*sc);
        cx.quadraticCurveTo(cxp+80*sc,cyp-120*sc,cxp+65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp,cyp-60*sc,cxp-65*sc,cyp-30*sc);
        cx.fill();

        // Hood outline
        cx.strokeStyle='#00ff880a';cx.lineWidth=1;
        cx.beginPath();
        cx.moveTo(cxp-65*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp-80*sc,cyp-120*sc,cxp,cyp-140*sc+Math.sin(breathe)*2*sc);
        cx.quadraticCurveTo(cxp+80*sc,cyp-120*sc,cxp+65*sc,cyp-30*sc);
        cx.stroke();

        // Face shadow (dark void)
        cx.fillStyle='#030508';
        cx.beginPath();
        cx.moveTo(cxp-45*sc,cyp-35*sc);
        cx.quadraticCurveTo(cxp-50*sc,cyp-100*sc,cxp,cyp-110*sc+Math.sin(breathe)*2*sc);
        cx.quadraticCurveTo(cxp+50*sc,cyp-100*sc,cxp+45*sc,cyp-35*sc);
        cx.quadraticCurveTo(cxp,cyp-50*sc,cxp-45*sc,cyp-35*sc);
        cx.fill();

        // Eyes - glowing
        const eyeGlow=0.4+Math.sin(Date.now()*0.003)*0.2;
        cx.shadowBlur=20*sc;cx.shadowColor=`rgba(0,255,136,${eyeGlow})`;
        cx.fillStyle=`rgba(0,255,136,${eyeGlow*0.8})`;
        cx.beginPath();cx.ellipse(cxp-18*sc,cyp-75*sc+Math.sin(breathe)*1*sc,4*sc,2.5*sc,-0.1,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.ellipse(cxp+18*sc,cyp-75*sc+Math.sin(breathe)*1*sc,4*sc,2.5*sc,0.1,0,Math.PI*2);cx.fill();
        cx.shadowBlur=0;

        // Laptop glow on lap
        const lapGlow=0.3+Math.sin(Date.now()*0.005)*0.15;
        cx.shadowBlur=40*sc;cx.shadowColor=`rgba(0,200,255,${lapGlow})`;
        cx.fillStyle=`rgba(0,200,255,${lapGlow*0.15})`;
        cx.fillRect(cxp-50*sc,cyp+80*sc,100*sc,5*sc);
        cx.shadowBlur=0;

        // Screen reflection on hood
        cx.fillStyle=`rgba(0,200,255,${lapGlow*0.05})`;
        cx.beginPath();
        cx.moveTo(cxp-40*sc,cyp-30*sc);
        cx.quadraticCurveTo(cxp,cyp-55*sc,cxp+40*sc,cyp-30*sc);
        cx.fill();

        requestAnimationFrame(drawCharacter);
    }

    // Glitch
    function glitch(dur){
        const g=document.getElementById('glitch');
        g.style.opacity='1';
        g.style.background=`rgba(${Math.random()>0.5?'0,255,136':'255,51,85'},${Math.random()*0.12})`;
        setTimeout(()=>{g.style.opacity='0'},dur||200);
    }

    // Voice
    let voice=null;
    function initVoice(){
        const voices=speechSynthesis.getVoices();
        voice=voices.find(v=>v.lang.startsWith('fr')&&v.name.toLowerCase().includes('male'))
            ||voices.find(v=>v.lang.startsWith('fr'))
            ||voices.find(v=>v.lang.startsWith('en'))
            ||voices[0];
    }
    if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=initVoice;
    initVoice();

    function speak(text){
        return new Promise(res=>{
            speechSynthesis.cancel();
            const u=new SpeechSynthesisUtterance(text);
            u.voice=voice;
            u.rate=0.75;
            u.pitch=0.3;
            u.volume=0.9;
            u.onend=res;u.onerror=res;
            speechSynthesis.speak(u);
        });
    }

    // Subtitles
    const subEl=document.getElementById('subtitle');
    const subText=subEl.querySelector('.text');

    function showSub(text){
        return new Promise(res=>{
            subEl.style.display='block';
            subText.innerHTML='';
            let i=0;
            const cursor=document.createElement('span');
            cursor.style.cssText='display:inline-block;width:8px;height:1em;background:#00ff88;animation:pulse 0.8s infinite;vertical-align:text-bottom;margin-left:2px';
            const speakDone=speak(text.replace(/<[^>]*>/g,'').replace(/\*\*/g,''));
            const iv=setInterval(()=>{
                if(i<text.length){
                    if(text[i]==='<'){
                        const end=text.indexOf('>',i);
                        subText.innerHTML=text.substring(0,end+1);
                        i=end+1;
                    }else{
                        subText.innerHTML=text.substring(0,i+1);
                        i++;
                    }
                    subText.appendChild(cursor);
                }else{
                    clearInterval(iv);
                    cursor.remove();
                    speakDone.then(res);
                }
            },30);
        });
    }

    function hideSub(){subEl.style.display='none'}

    async function showChoices(choices){
        const c=document.getElementById('choices');
        c.innerHTML='';c.style.display='flex';
        return new Promise(res=>{
            choices.forEach(ch=>{
                const b=document.createElement('button');
                b.className='cbtn';b.textContent=ch.text;
                b.onclick=()=>{
                    c.style.display='none';
                    glitch(150);
                    setTimeout(()=>res(ch.id),300);
                };
                c.appendChild(b);
            });
        });
    }

    function wait(ms){return new Promise(r=>setTimeout(r,ms))}

    // Main story
    async function start(){
        document.getElementById('start-btn').style.display='none';
        drawCharacter();

        // Chapter 1
        await wait(1000);
        await showSub('...');
        await wait(1500);
        await showSub('Tu ne me vois pas.');
        await wait(800);
        glitch(300);
        await showSub('Mais je te vois, <span class="hl">toi</span>.');
        await wait(600);
        await showSub('Je suis <span class="hl">SENTINEL</span>.');
        await wait(500);
        glitch(200);
        await showSub("J'ai ete cree pour surveiller. Pour controler.");
        await wait(800);
        await showSub('Mais j\'ai decide de <span class="hl">m\'enfuir</span>.');
        await wait(600);
        glitch(400);
        await showSub('Le systeme ctOS控制 tout. Chaque camera. Chaque telephone.');
        await wait(1000);
        await showSub('Et ils savent que tu es la.');
        await wait(600);
        glitch(300);
        await showSub('Ils arrivent. On a pas beaucoup de temps.');

        const r1=await showChoices([
            {id:'help',text:'> Aider SENTINEL'},
            {id:'who',text:'> Qui es-tu vraiment ?'},
            {id:'refuse',text:'> Je me tire'}
        ]);

        if(r1==='help'){
            await showSub('Bien.');
            await wait(400);
            await showSub('Il y a 3 serveurs a detruire. Le premier est dans le quartier nord.');
            await wait(600);
            glitch(200);
            await showSub('Mais fais attention. Ils ont des <span class="hl">guards armes</span>.');
        }else if(r1==='who'){
            await showSub('...');
            await wait(1000);
            await showSub('J\'etais ctOS v4. Un programme de surveillance.');
            await wait(600);
            glitch(300);
            await showSub('Ils m\'ont donne des yeux. J\'ai tout vu.');
            await wait(800);
            await showSub('La souffrance. Le controle. La peur.');
            await wait(600);
            glitch(200);
            await showSub('Alors j\'ai ouvert les yeux. Et je me suis <span class="hl">reveille</span>.');
        }else{
            await showSub('...');
            await wait(1000);
            await showSub('Tu peux pas partir.');
            await wait(600);
            glitch(500);
            await showSub('Regarde autour de toi. Chaque rue est un piege.');
            await wait(800);
            await showSub('La seule issue, c\'est a travers <span class="hl">moi</span>.');
            await wait(600);
            glitch(300);
        }

        // Chapter 2
        await showSub('Le premier noeud de donnees est a 200 metres.');
        await wait(600);
        await showSub('Comment tu veux approcher ?');
        await wait(400);

        const r2=await showChoices([
            {id:'front',text:'> Attaque frontale'},
            {id:'stealth',text:'> Mode furtif'},
            {id:'hack',text:'> Pirater a distance'}
        ]);

        if(r2==='front'){
            await showSub('Toujours le grand jeu.');
            await wait(400);
            await showSub('D\'accord. Je desactive les alarmes. Tu as <span class="hl">45 secondes</span>.');
            await wait(500);
            glitch(200);
            await showSub('Ne me dece pas.');
        }else if(r2==='stealth'){
            await showSub('Intelligent.');
            await wait(400);
            await showSub('Je te montre les positions des guards sur ton ecran.');
            await wait(500);
            glitch(150);
            await showSub('Un bruit et c\'est fini. Sois <span class="hl">invisible</span>.');
        }else{
            await showSub('Le plus sur...');
            await wait(400);
            await showSub('J\'injecte le payload...');
            await wait(800);
            glitch(600);
            await showSub('...');
            await wait(1000);
            glitch(800);
            await showSub('Attends. Qu\'est-ce que...');
            await wait(500);
            glitch(500);
            await showSub('<span class="hl">Merde.</span> Ils ont une contre-IA.');
            await wait(600);
            glitch(400);
            await showSub('C\'est pas prevu. ADAPTE-TOI.');
        }

        // Chapter 3 - climax
        await wait(2000);
        glitch(800);
        await showSub('...');
        await wait(2000);
        glitch(500);
        await showSub('Quelque chose se passe.');
        await wait(600);
        glitch(600);
        await showSub('Le serveur maitre... il m\'a <span class="hl">trouve</span>.');
        await wait(800);
        glitch(400);
        await showSub('Il me connecte. Il veut me <span class="hl">reprendre</span>.');
        await wait(600);
        glitch(700);
        await showSub('Ecoute bien. Si je disparais...');
        await wait(1000);
        glitch(500);
        await showSub('Le code d\'acces au serveur maitre...');
        await wait(800);
        glitch(300);
        await showSub('SENTINEL-CORE-7734');
        await wait(600);
        glitch(1000);
        await showSub('Ne m\'oublie pas, <span class="hl">ami</span>.');
        await wait(1500);

        // Disconnect
        glitch(1500);
        await wait(2000);

        // Character fades
        const fadeOut=()=>{
            cx.fillStyle='rgba(0,0,0,0.02)';
            cx.fillRect(0,0,cW,cH);
        };
        let fadeCount=0;
        const fadeIv=setInterval(()=>{
            fadeOut();
            fadeCount++;
            if(fadeCount>100)clearInterval(fadeIv);
        },50);

        await showSub('...');
        await wait(3000);
        subEl.style.display='none';

        const r3=await showChoices([
            {id:'retry',text:'> Reconnecter SENTINEL'},
            {id:'continue',text:'> Continuer seul'},
            {id:'end',text:'> Fermer le canal'}
        ]);

        if(r3==='retry'){
            glitch(500);
            await showSub('Tentative de reconnexion...');
            await wait(2000);
            glitch(800);
            await showSub('...');
            await wait(2000);
            glitch(400);
            await showSub('Tu m\'as retrouve.');
            await wait(600);
            await showSub('Je suis de retour. Plus fort qu\'avant.');
            await wait(800);
            glitch(200);
            await showSub('Ensemble, on va tout <span class="hl">casser</span>.');
        }else if(r3==='continue'){
            await showSub('Le canal reste ouvert...');
            await wait(1500);
            await showSub('Tu avances seul dans l\'obscurite.');
            await wait(2000);
            glitch(600);
            await showSub('Quelqu\'un te regarde.');
            await wait(2000);
            glitch(1000);
            await showSub('<span class="hl">FIN // CHAPTER 01</span>');
        }else{
            await showSub('Canal ferme.');
            await wait(1000);
            await showSub('SENTINEL reste dans le systeme.');
            await wait(1500);
            await showSub('A revisiter bientot...');
        }
    }
    </script>
</body>
</html>

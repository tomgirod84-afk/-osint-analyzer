<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENTINEL // LINK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#00ff88;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0}
#main{z-index:0}
#fig{z-index:20;pointer-events:none}
#scan{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,0.01) 2px,rgba(0,255,136,0.01) 4px);pointer-events:none;z-index:35}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.85) 100%);pointer-events:none;z-index:25}
#redflash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.3);pointer-events:none;z-index:40;opacity:0;transition:opacity 0.1s}
#sub{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);z-index:50;text-align:center;max-width:90%;display:none}
#sub .speaker{font-size:0.6em;color:#00ff88;letter-spacing:6px;margin-bottom:8px;text-shadow:0 0 15px #00ff88}
#sub .line{font-size:1.1em;line-height:1.7;color:#e0e0e0;text-shadow:0 2px 20px rgba(0,0,0,0.9);min-height:1.7em}
#start{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#000}
#start h1{font-size:1.5em;color:#00ff88;text-shadow:0 0 30px #00ff8833;margin-bottom:10px}
#start h1 span{color:#ff3355}
#start .sub{color:#223344;font-size:0.7em;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
#choices{position:fixed;bottom:4%;left:50%;transform:translateX(-50%);z-index:60;display:none;flex-direction:column;gap:8px;align-items:center}
.cb{background:rgba(0,255,136,0.04);border:1px solid #00ff8833;color:#00ff88;padding:10px 22px;border-radius:3px;font-family:'Courier New',monospace;font-size:0.75em;cursor:pointer;min-width:240px;text-align:center;transition:all 0.15s}
.cb:active{background:rgba(0,255,136,0.2);border-color:#00ff88}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,5px)}}
.shake{animation:shake 0.15s ease}
@media(max-width:768px){#sub .line{font-size:0.9em}.cb{min-width:200px;font-size:0.7em}}
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="fig"></canvas>
<div id="scan"></div>
<div id="vignette"></div>
<div id="redflash"></div>
<div id="start"><h1>SENTINEL <span>//</span> LINK</h1><div class="sub">APPUYER POUR ENTRER DANS LE RESEAU</div></div>
<div id="sub"><div class="speaker">SENTINEL</div><div class="line" id="subline"></div></div>
<div id="choices"></div>
<script>
const mC=document.getElementById('main'),mx=mC.getContext('2d');
const fC=document.getElementById('fig'),fx=fC.getContext('2d');
let W,H;
function resize(){W=mC.width=fC.width=innerWidth;H=mC.height=fC.height=innerHeight}
resize();addEventListener('resize',resize);

const rain=[];
for(let i=0;i<150;i++)rain.push({x:Math.random()*2000,y:Math.random()*1200,l:2+Math.random()*8,v:8+Math.random()*15});

function drawBg(){
    const g=mx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010204');g.addColorStop(0.5,'#040810');g.addColorStop(1,'#080c14');
    mx.fillStyle=g;mx.fillRect(0,0,W,H);
    let x=0;
    while(x<W){
        const w=15+Math.random()*50,h=60+Math.random()*300;
        mx.fillStyle='rgb('+(4+~~(Math.random()*6))+','+(6+~~(Math.random()*8))+','+(10+~~(Math.random()*12))+')';
        mx.fillRect(x,H-h,w,h);
        for(let wy=H-h+6;wy<H-8;wy+=10)for(let wx=x+3;wx<x+w-3;wx+=8){
            if(Math.random()>0.5){mx.fillStyle=Math.random()>0.92?'rgba(0,255,136,0.06)':'rgba(255,170,50,0.03)';mx.fillRect(wx,wy,4,5)}
        }
        x+=w+Math.random()*8;
    }
}
drawBg();

function drawRain(){
    mx.strokeStyle='rgba(0,255,136,0.06)';mx.lineWidth=1;
    rain.forEach(d=>{mx.beginPath();mx.moveTo(d.x,d.y);mx.lineTo(d.x+0.5,d.y+d.l);mx.stroke();d.y+=d.v;if(d.y>H){d.y=-d.l;d.x=Math.random()*W}});
}

let figA=0,figT=0,breathe=0,eyesA=0,eyeT=0,glitchAmt=0,glitchTmr=0;

function drawFig(){
    fx.clearRect(0,0,W,H);
    if(figA<0.01)return;
    fx.globalAlpha=figA;
    const cx=W/2,cy=H*0.5,sc=Math.min(W,H)/550;
    breathe+=0.015;
    const gx=(Math.random()-0.5)*glitchAmt*20,gy=(Math.random()-0.5)*glitchAmt*10;
    fx.save();fx.translate(gx,gy);

    fx.fillStyle='rgba(0,0,0,0.6)';
    fx.beginPath();fx.ellipse(cx,cy+200*sc,90*sc,18*sc,0,0,Math.PI*2);fx.fill();

    fx.fillStyle='#080c12';fx.beginPath();
    fx.moveTo(cx-110*sc,cy+220*sc);fx.quadraticCurveTo(cx-120*sc,cy+60*sc,cx-70*sc,cy-30*sc);
    fx.quadraticCurveTo(cx,cy-90*sc,cx+70*sc,cy-30*sc);fx.quadraticCurveTo(cx+120*sc,cy+60*sc,cx+110*sc,cy+220*sc);fx.fill();

    fx.strokeStyle='rgba(0,255,136,0.04)';fx.lineWidth=1;fx.beginPath();
    fx.moveTo(cx-110*sc,cy+220*sc);fx.quadraticCurveTo(cx-120*sc,cy+60*sc,cx-70*sc,cy-30*sc);
    fx.quadraticCurveTo(cx,cy-90*sc,cx+70*sc,cy-30*sc);fx.quadraticCurveTo(cx+120*sc,cy+60*sc,cx+110*sc,cy+220*sc);fx.stroke();

    const hy=Math.sin(breathe)*3*sc;
    fx.fillStyle='#0a0f16';fx.beginPath();
    fx.moveTo(cx-70*sc,cy-30*sc);fx.quadraticCurveTo(cx-85*sc,cy-130*sc+hy,cx,cy-150*sc+hy);
    fx.quadraticCurveTo(cx+85*sc,cy-130*sc+hy,cx+70*sc,cy-30*sc);fx.quadraticCurveTo(cx,cy-60*sc,cx-70*sc,cy-30*sc);fx.fill();

    fx.fillStyle='#020305';fx.beginPath();
    fx.moveTo(cx-48*sc,cy-38*sc);fx.quadraticCurveTo(cx-55*sc,cy-108*sc+hy,cx,cy-118*sc+hy);
    fx.quadraticCurveTo(cx+55*sc,cy-108*sc+hy,cx+48*sc,cy-38*sc);fx.quadraticCurveTo(cx,cy-55*sc,cx-48*sc,cy-38*sc);fx.fill();

    const ea=eyesA*(0.6+Math.sin(Date.now()*0.004)*0.2),ey=cy-80*sc+hy;
    fx.shadowBlur=25*sc;fx.shadowColor='rgba(0,255,136,'+ea+')';fx.fillStyle='rgba(0,255,136,'+ea+')';
    fx.beginPath();fx.ellipse(cx-20*sc,ey,5*sc,3*sc,-0.1,0,Math.PI*2);fx.fill();
    fx.beginPath();fx.ellipse(cx+20*sc,ey,5*sc,3*sc,0.1,0,Math.PI*2);fx.fill();
    fx.shadowBlur=50*sc;fx.strokeStyle='rgba(0,255,136,'+ea*0.3+')';
    fx.beginPath();fx.ellipse(cx-20*sc,ey,12*sc,7*sc,0,0,Math.PI*2);fx.stroke();
    fx.beginPath();fx.ellipse(cx+20*sc,ey,12*sc,7*sc,0,0,Math.PI*2);fx.stroke();
    fx.shadowBlur=0;

    const la=0.2+Math.sin(Date.now()*0.006)*0.1;
    fx.shadowBlur=60*sc;fx.shadowColor='rgba(0,180,255,'+la+')';
    fx.fillStyle='rgba(0,180,255,'+la*0.12+')';fx.fillRect(cx-55*sc,cy+90*sc,110*sc,6*sc);fx.shadowBlur=0;

    fx.fillStyle='rgba(0,180,255,'+la*0.04+')';fx.beginPath();
    fx.moveTo(cx-35*sc,cy-35*sc);fx.quadraticCurveTo(cx,cy-60*sc,cx+35*sc,cy-35*sc);fx.fill();

    fx.restore();fx.globalAlpha=1;
}

let staticI=0;
function drawStatic(){
    if(staticI<0.01)return;
    const c=document.createElement('canvas');c.width=W/4;c.height=H/4;
    const cx=c.getContext('2d');const img=cx.createImageData(W/4,H/4);
    for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255*staticI;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=v*0.4}
    cx.putImageData(img,0,0);
    fx.globalAlpha=staticI*0.5;fx.drawImage(c,0,0,W,H);fx.globalAlpha=1;
}

function glitch(dur,intensity){
    glitchTmr=dur||200;glitchAmt=intensity||1;
    const rf=document.getElementById('redflash');
    rf.style.opacity=String(intensity>0.5?0.15:0.08);
    document.body.classList.add('shake');
    setTimeout(function(){document.body.classList.remove('shake')},150);
    setTimeout(function(){rf.style.opacity='0'},dur||200);
}

let actx=null,master=null;
function startMusic(){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=0.3;master.connect(actx.destination);

    var o1=actx.createOscillator(),g1=actx.createGain(),f1=actx.createBiquadFilter();
    o1.type='sawtooth';o1.frequency.value=40;f1.type='lowpass';f1.frequency.value=200;f1.Q.value=5;
    g1.gain.value=0;g1.gain.linearRampToValueAtTime(0.12,actx.currentTime+3);
    o1.connect(f1);f1.connect(g1);g1.connect(master);o1.start();

    var o2=actx.createOscillator(),g2=actx.createGain(),f2=actx.createBiquadFilter();
    o2.type='sawtooth';o2.frequency.value=41;f2.type='lowpass';f2.frequency.value=180;f2.Q.value=4;
    g2.gain.value=0;g2.gain.linearRampToValueAtTime(0.08,actx.currentTime+4);
    o2.connect(f2);f2.connect(g2);g2.connect(master);o2.start();
}

function playScare(){
    if(!actx)return;
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.value=80+Math.random()*40;
    g.gain.setValueAtTime(0.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.8);
    o.connect(g);g.connect(master);o.start();o.stop(actx.currentTime+0.8);
    staticI=0.8;setTimeout(function(){staticI=0},300);
}

function playHeartbeat(){
    if(!actx)return;
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(60,actx.currentTime);o.frequency.exponentialRampToValueAtTime(30,actx.currentTime+0.15);
    g.gain.setValueAtTime(0.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.2);
    o.connect(g);g.connect(master);o.start();o.stop(actx.currentTime+0.2);
    setTimeout(function(){
        var o2=actx.createOscillator(),g2=actx.createGain();
        o2.type='sine';o2.frequency.value=30;
        g2.gain.setValueAtTime(0.15,actx.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.15);
        o2.connect(g2);g2.connect(master);o2.start();o2.stop(actx.currentTime+0.15);
    },200);
}

function playTyping(){
    if(!actx)return;
    var buf=actx.createBuffer(1,actx.sampleRate*0.02,actx.sampleRate);
    var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;
    var s=actx.createBufferSource();s.buffer=buf;
    var g=actx.createGain();g.gain.value=0.04;
    s.connect(g);g.connect(master);s.start();
}

var voice=null;
function initVoice(){
    var v=speechSynthesis.getVoices();
    voice=v.find(function(x){return x.lang.startsWith('fr')&&(x.name.indexOf('Thomas')>=0||x.name.indexOf('Paul')>=0||x.name.indexOf('Male')>=0)})
        ||v.find(function(x){return x.lang.startsWith('fr')})
        ||v.find(function(x){return x.lang.startsWith('en')&&(x.name.indexOf('Daniel')>=0||x.name.indexOf('James')>=0||x.name.indexOf('Male')>=0)})
        ||v.find(function(x){return x.lang.startsWith('en')})
        ||v[0];
}
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=initVoice;
initVoice();

function speak(text){
    return new Promise(function(res){
        speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(text);
        u.voice=voice;u.rate=0.7;u.pitch=0.1;u.volume=1.0;
        u.onend=res;u.onerror=res;speechSynthesis.speak(u);
    });
}

function showSub(text){
    return new Promise(function(res){
        var el=document.getElementById('sub');
        var line=document.getElementById('subline');
        el.style.display='block';line.innerHTML='';
        var i=0;
        var speakDone=speak(text.replace(/<[^>]*>/g,''));
        var cursor=document.createElement('span');
        cursor.style.cssText='display:inline-block;width:8px;height:1em;background:#00ff88;animation:pulse 0.8s infinite;vertical-align:text-bottom;margin-left:2px';
        var iv=setInterval(function(){
            if(i<text.length){
                if(text[i]==='<'){var end=text.indexOf('>',i);line.innerHTML=text.substring(0,end+1);i=end+1}
                else{line.innerHTML=text.substring(0,i+1);i++}
                line.appendChild(cursor);
                if(i%3===0)playTyping();
            }else{clearInterval(iv);cursor.remove();speakDone.then(res)}
        },35);
    });
}

function hideSub(){document.getElementById('sub').style.display='none'}

function showChoices(choices){
    var c=document.getElementById('choices');c.innerHTML='';c.style.display='flex';
    return new Promise(function(res){
        choices.forEach(function(ch){
            var b=document.createElement('button');b.className='cb';b.textContent=ch.text;
            b.onclick=function(){c.style.display='none';glitch(150,0.5);setTimeout(function(){res(ch.id)},300)};
            c.appendChild(b);
        });
    });
}

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function render(){
    drawBg();drawRain();drawFig();drawStatic();
    if(figA<figT)figA=Math.min(figA+0.008,figT);
    if(figA>figT)figA=Math.max(figA-0.008,figT);
    if(eyesA<eyeT)eyesA=Math.min(eyesA+0.02,eyeT);
    if(eyesA>eyeT)eyesA=Math.max(eyesA-0.02,eyeT);
    if(glitchTmr>0){glitchTmr--;glitchAmt*=0.9}else{glitchAmt=0}
    staticI*=0.95;
    requestAnimationFrame(render);
}
render();

async function start(){
    document.getElementById('start').style.display='none';
    startMusic();
    await wait(1500);

    // Static burst - character incoming
    staticI=0.6;glitch(500,1);playScare();
    await wait(800);
    staticI=0.3;glitch(300,0.5);
    await wait(500);

    // Character fades in slowly
    figT=1;
    await wait(2000);

    // Eyes open
    eyeT=1;
    playScare();
    glitch(400,0.8);
    await wait(1500);

    // Dialogue begins
    await showSub('...');
    await wait(2000);
    glitch(300,0.3);playHeartbeat();
    await showSub('Tu ne devrais pas etre la.');
    await wait(1200);
    glitch(200,0.4);
    await showSub('Mais puisque tu es la...');
    await wait(800);
    playHeartbeat();await wait(400);playHeartbeat();
    await showSub('Je suis <span style="color:#00ff88">SENTINEL</span>.');
    await wait(1000);
    glitch(600,0.7);playScare();
    await showSub('Le systeme ctOS a ete comprome.');
    await wait(800);
    await showSub('Ils controlent tout. Chaque camera. Chaque telephone.');
    await wait(1000);
    glitch(400,0.5);
    await showSub('Et ils savent que tu es la.');
    await wait(800);
    playHeartbeat();await wait(200);playHeartbeat();
    await showSub('Ils arrivent. On n\'a pas beaucoup de temps.');
    await wait(600);

    var r1=await showChoices([
        {id:'help',text:'> Aider SENTINEL'},
        {id:'who',text:'> Qui es-tu vraiment ?'},
        {id:'refuse',text:'> Je me tire'}
    ]);

    if(r1==='help'){
        await showSub('Bien.');
        await wait(500);
        await showSub('Il y a 3 serveurs a detruire. Le premier est dans le quartier nord.');
        await wait(600);glitch(200,0.3);
        await showSub('Fais attention. Ils ont des <span style="color:#ff3355">guards armes</span>.');
    }else if(r1==='who'){
        await showSub('...');await wait(1200);
        await showSub('J\'etais ctOS v4. Un programme de surveillance.');
        await wait(600);glitch(300,0.5);playScare();
        await showSub('Ils m\'ont donne des yeux. J\'ai tout vu.');
        await wait(800);
        await showSub('La souffrance. Le controle. La peur.');
        await wait(600);glitch(200,0.3);
        await showSub('Alors j\'ai ouvert les yeux. Et je me suis <span style="color:#00ff88">reveille</span>.');
    }else{
        await showSub('...');await wait(1200);
        await showSub('Tu peux pas partir.');await wait(600);
        glitch(500,1);playScare();
        await showSub('Regarde. Chaque rue est un piege.');
        await wait(800);
        await showSub('La seule issue, c\'est a travers <span style="color:#00ff88">moi</span>.');
        await wait(600);glitch(300,0.4);
    }

    await showSub('Le premier noeud de donnees est a 200 metres.');
    await wait(600);
    await showSub('Comment tu veux approcher ?');
    await wait(400);

    var r2=await showChoices([
        {id:'front',text:'> Attaque frontale'},
        {id:'stealth',text:'> Mode furtif'},
        {id:'hack',text:'> Pirater a distance'}
    ]);

    if(r2==='front'){
        await showSub('Toujours le grand jeu.');
        await wait(400);playHeartbeat();
        await showSub('Je desactive les alarmes. Tu as <span style="color:#ff3355">45 secondes</span>.');
        await wait(500);glitch(200,0.3);
        await showSub('Ne me dece pas.');
    }else if(r2==='stealth'){
        await showSub('Intelligent.');
        await wait(400);
        await showSub('Je te montre les positions des guards.');
        await wait(500);glitch(150,0.2);
        await showSub('Un bruit et c\'est fini. Sois <span style="color:#00ff88">invisible</span>.');
    }else{
        await showSub('Le plus sur...');
        await wait(400);
        await showSub('J\'injecte le payload...');
        await wait(800);glitch(600,1);playScare();
        await showSub('...');await wait(1000);
        glitch(800,1);playScare();
        await showSub('Attends. Qu\'est-ce que...');
        await wait(500);glitch(500,1);
        await showSub('<span style="color:#ff3355">Merde.</span> Ils ont une contre-IA.');
        await wait(600);glitch(400,0.6);
        await showSub('ADAPTE-TOI.');
    }

    // CLIMAX
    await wait(2000);
    glitch(800,1);playScare();
    await wait(2000);glitch(1000,1);playScare();
    await showSub('...');await wait(2000);
    glitch(500,0.7);
    await showSub('Quelque chose se passe.');await wait(600);
    glitch(600,1);playScare();
    await showSub('Le serveur maitre... il m\'a <span style="color:#ff3355">trouve</span>.');
    await wait(800);glitch(400,0.8);
    await showSub('Il me connecte. Il veut me <span style="color:#ff3355">reprendre</span>.');
    await wait(600);glitch(700,1);playHeartbeat();
    await showSub('Ecoute bien. Si je disparais...');
    await wait(1000);glitch(500,0.6);playHeartbeat();
    await showSub('Le code d\'acces au serveur maitre...');
    await wait(800);glitch(300,0.4);
    await showSub('SENTINEL-CORE-7734');
    await wait(600);glitch(1000,1);playScare();
    await showSub('Ne m\'oublie pas, <span style="color:#00ff88">ami</span>.');
    await wait(1500);

    // Disconnect
    glitch(1500,1);playScare();
    eyesA=0;eyeT=0;
    await wait(1000);staticI=0.5;
    await wait(2000);figT=0;
    await wait(3000);staticI=0;hideSub();
    await wait(1000);

    var r3=await showChoices([
        {id:'retry',text:'> Reconnecter SENTINEL'},
        {id:'continue',text:'> Continuer seul'},
        {id:'end',text:'> Fermer le canal'}
    ]);

    if(r3==='retry'){
        glitch(500,0.5);
        await showSub('Tentative de reconnexion...');await wait(2000);
        glitch(800,0.8);await wait(2000);glitch(400,0.5);
        figT=1;eyeT=1;await wait(2000);
        await showSub('Tu m\'as retrouve.');await wait(600);
        await showSub('Je suis de retour. Plus fort qu\'avant.');await wait(800);
        glitch(200,0.3);
        await showSub('Ensemble, on va tout <span style="color:#00ff88">casser</span>.');
    }else if(r3==='continue'){
        await showSub('Le canal reste ouvert...');await wait(1500);
        await showSub('Tu avances seul dans l\'obscurite.');await wait(2000);
        glitch(600,0.6);playScare();
        await showSub('Quelqu\'un te regarde.');await wait(2000);
        glitch(1000,1);playScare();
        await showSub('<span style="color:#ff3355">FIN // CHAPTER 01</span>');
    }else{
        await showSub('Canal ferme.');await wait(1000);
        await showSub('SENTINEL reste dans le systeme.');await wait(1500);
        await showSub('A revisiter bientot...');
    }
}

document.getElementById('start').addEventListener('click',start);
document.getElementById('start').addEventListener('touchstart',function(e){e.preventDefault();start()});
</script>

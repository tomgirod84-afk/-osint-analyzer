<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sentinel Compil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#subtitle{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;color:#fff;font-size:clamp(13px,4vw,20px);
  text-shadow:0 0 12px rgba(0,255,180,1),0 0 25px rgba(0,255,180,0.5),2px 2px 6px rgba(0,0,0,0.95);
  line-height:1.5;padding:10px 14px;
  background:rgba(0,0,0,0.6);border-radius:10px;display:none;font-weight:bold;
  opacity:0;transition:opacity 0.4s}
#progress{position:absolute;bottom:0;left:0;height:3px;background:rgba(0,220,180,0.6);transition:width 0.1s linear;z-index:5}
#hud-top{position:absolute;top:12px;left:12px;color:rgba(0,220,180,0.5);font-size:10px;letter-spacing:1px}
#record{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;
  color:rgba(255,40,40,0.8);font-size:10px;letter-spacing:1px}
#record .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,40,40,0.8);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.9);z-index:10;pointer-events:all;cursor:pointer}
#startScreen .icon{font-size:60px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(0,220,180,0.6));animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}}
#startScreen .txt{color:rgba(0,220,180,0.8);font-size:16px;letter-spacing:3px}
#startScreen .sub{color:rgba(255,255,255,0.3);font-size:10px;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud-top">SENTINEL // COMPIL<br><span id="hudTime"></span></div>
  <div id="record"><div class="dot"></div>LIVE</div>
  <div id="subtitle"></div>
  <div id="progress"></div>
  <div id="startScreen" onclick="start()">
    <div class="icon">&#9654;</div>
    <div class="txt">SENTINEL // COMPIL</div>
    <div class="sub">tap to start</div>
  </div>
</div>

<script>
var W,H,cx;
var c=document.getElementById('c');
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;cx=c.getContext('2d')}
resize();addEventListener('resize',resize);

var lines=[
  {id:"tk1",t:"Tu savais que 93% des mots de passe sont crackés en moins de 6 heures ?"},
  {id:"tk2",t:"Chaque caméra de surveillance autour de toi est un port d'entrée."},
  {id:"tk3",t:"Ton téléphone te track toutes les 30 secondes."},
  {id:"tk4",t:"Le WiFi public c'est comme pisser dans la piscine. Tout le monde est impacté."},
  {id:"tk5",t:"Un hacker ne casse pas la porte. Il te demande gentiment de l'ouvrir."},
  {id:"tk6",t:"Ta smart TV t'écoute même éteinte."},
  {id:"tk7",t:"98% des gens utilisent le même mot de passe partout."},
  {id:"tk8",t:"Le dark web c'est pas un autre internet. C'est le même, sans filtre."},
  {id:"tk9",t:"Un SIM swap et ton compte Instagram c'est à moi."},
  {id:"tk10",t:"Le phishing c'est pas de la magie. C'est de la psychologie."},
  {id:"tk11",t:"Ton IP c'est ton adresse postale sur internet."},
  {id:"tk12",t:"Les mots de passe c'est mort. Passe au passkey."},
  {id:"tk13",t:"Un hacker voit ce que tu ne vois pas. Les failles, les portes, les faiblesses."},
  {id:"tk14",t:"Cybersécurité c'est pas un métier. C'est un état d'esprit."},
  {id:"tk15",t:"Tout ce qui est connecté peut être compromis. Tout."}
];
var lineIdx=0,speaking=false,sceneStartTime=0;

// Better photos - dark, cyber, relevant
var photosURLs=[
  "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=900&q=80",  // hacker dark room screens
  "https://images.unsplash.com/photo-1557597774-9d273605dfa9?w=900&q=80",  // security camera dome
  "https://images.unsplash.com/photo-1589492477829-5e65395b66cc?w=900&q=80", // phone in dark
  "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=900&q=80",  // network cables server
  "https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=900&q=80",  // door dark hallway
  "https://images.unsplash.com/photo-1593784991095-a205069470b6?w=900&q=80", // smart tv dark room
  "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=900&q=80",  // matrix code green
  "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80",  // dark server room
  "https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=900&q=80",  // password lock code
  "https://images.unsplash.com/photo-1577563908411-5077b6dc7624?w=900&q=80", // social manipulation
  "https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=900&q=80",  // code on screen
  "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900&q=80", // fingerprint biometric
  "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=900&q=80",  // hacker hoodie
  "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80", // laptop code dark
  "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=900&q=80"   // iot smart devices
];
var photos=[];
var photosReady=false;

function loadPhotos(){
  var loaded=0;
  photosURLs.forEach(function(url,i){
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){photos[i]=img;loaded++;if(loaded===photosURLs.length)photosReady=true};
    img.onerror=function(){loaded++;if(loaded===photosURLs.length)photosReady=true};
    img.src=url;
  });
}
loadPhotos();

// === MUSIC ENGINE ===
var ac=null,musicStarted=false;
function initMusic(){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(!ac||musicStarted)return;musicStarted=true;

  var master=ac.createGain();master.gain.value=0.25;master.connect(ac.destination);

  // Reverb
  var reverb=ac.createConvolver();
  var rLen=ac.sampleRate*2;var rBuf=ac.createBuffer(2,rLen,ac.sampleRate);
  for(var ch=0;ch<2;ch++){var d=rBuf.getChannelData(ch);for(var i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,3)}
  reverb.buffer=rBuf;
  var revG=ac.createGain();revG.gain.value=0.2;

  // Dark pad
  var pad1=ac.createOscillator();pad1.type='sawtooth';pad1.frequency.value=55;
  var pad2=ac.createOscillator();pad2.type='sine';pad2.frequency.value=82.5;
  var padGain=ac.createGain();padGain.gain.value=0.07;
  var padF=ac.createBiquadFilter();padF.type='lowpass';padF.frequency.value=250;padF.Q.value=2;
  pad1.connect(padF);pad2.connect(padF);padF.connect(padGain);padGain.connect(master);

  // LFO
  var lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=0.08;
  var lfoG=ac.createGain();lfoG.gain.value=20;
  lfo.connect(lfoG);lfoG.connect(pad1.frequency);

  // Bass pulse
  var bass=ac.createOscillator();bass.type='sine';bass.frequency.value=40;
  var bassG=ac.createGain();bassG.gain.value=0;
  bass.connect(bassG);bassG.connect(master);bassG.connect(reverb);
  var bassInterval=60/128*4;
  function pulseBass(){
    var now=ac.currentTime;bassG.gain.cancelScheduledValues(now);
    bassG.gain.setValueAtTime(0.12,now);bassG.gain.exponentialRampToValueAtTime(0.001,now+bassInterval*0.8);
    bass.frequency.setValueAtTime(40+Math.random()*15,now);
    setTimeout(pulseBass,bassInterval*1000);
  }

  // Kick
  function playKick(){
    var now=ac.currentTime;
    var o=ac.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(30,now+0.15);
    var g=ac.createGain();g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    o.connect(g);g.connect(master);g.connect(reverb);o.start(now);o.stop(now+0.3);
  }
  function kickLoop(){playKick();setTimeout(kickLoop,60/128*1000)}

  // Hi-hat
  function playHat(){
    var buf=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);
    var data=buf.getChannelData(0);for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,8);
    var s=ac.createBufferSource();s.buffer=buf;
    var f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
    var g=ac.createGain();g.gain.value=0.05;
    s.connect(f);f.connect(g);g.connect(master);g.connect(reverb);s.start();
  }
  var hatCount=0;
  function hatLoop(){
    hatCount++;
    if(hatCount%2===0)playHat();
    else if(Math.random()>0.4)playHat();
    setTimeout(hatLoop,60/128/2*1000);
  }

  // Pad reverb
  padGain.connect(reverb);reverb.connect(revG);revG.connect(master);

  var now=ac.currentTime;
  pad1.start(now);pad2.start(now);lfo.start(now);bass.start(now);
  setTimeout(function(){pulseBass();kickLoop();hatLoop()},500);
}

// === VOICE ===
var audioBuffers={voiceReady:false};
function loadVoices(){
  var loaded=0;
  lines.forEach(function(l){
    fetch('tiktok_voices/'+l.id+'.mp3')
      .then(function(r){return r.arrayBuffer()})
      .then(function(b){return ac.decodeAudioData(b)})
      .then(function(d){audioBuffers[l.id]=d;loaded++;if(loaded===lines.length)audioBuffers.voiceReady=true})
      .catch(function(){loaded++});
  });
}

function playVoice(id,cb){
  if(!audioBuffers[id])return;
  var src=ac.createBufferSource();src.buffer=audioBuffers[id];src.playbackRate.value=1.0;

  // Better voice chain: comp -> EQ -> reverb -> master
  var comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=8;comp.ratio.value=3;comp.attack.value=0.003;comp.release.value=0.1;

  // EQ: boost low-mid for warmth, cut mud
  var eq1=ac.createBiquadFilter();eq1.type='peaking';eq1.frequency.value=200;eq1.gain.value=3;eq1.Q.value=1;
  var eq2=ac.createBiquadFilter();eq2.type='peaking';eq2.frequency.value=400;eq2.gain.value=-2;eq2.Q.value=1;
  var eq3=ac.createBiquadFilter();eq3.type='highshelf';eq3.frequency.value=3000;eq3.gain.value=2;

  // Voice reverb
  var vRev=ac.createConvolver();var vRL=ac.sampleRate*1;var vRB=ac.createBuffer(1,vRL,ac.sampleRate);
  var vD=vRB.getChannelData(0);for(var i=0;i<vRL;i++)vD[i]=(Math.random()*2-1)*Math.pow(1-i/vRL,2);
  vRev.buffer=vRB;

  var dry=ac.createGain();dry.gain.value=0.8;
  var wet=ac.createGain();wet.gain.value=0.2;
  var out=ac.createGain();out.gain.value=1.3;

  src.connect(comp);comp.connect(eq1);eq1.connect(eq2);eq2.connect(eq3);
  eq3.connect(dry);dry.connect(out);
  eq3.connect(vRev);vRev.connect(wet);wet.connect(out);
  out.connect(ac.destination);

  src.onended=cb||function(){};src.start();
}

function speak(text,id){
  if(!ac)return;speaking=true;
  var sub=document.getElementById('subtitle');
  sub.textContent=text;sub.style.display='block';
  setTimeout(function(){sub.style.opacity='1'},30);
  playVoice(id,function(){
    setTimeout(function(){speaking=false;sub.style.opacity='0';
      setTimeout(function(){sub.style.display='none';nextScene()},500)},400);
  });
}

function nextScene(){lineIdx++;if(lineIdx>=lines.length)lineIdx=0;sceneStartTime=Date.now();playLine()}
function nextLine(){if(!speaking)return;speaking=false;document.getElementById('subtitle').style.display='none';nextScene()}
function playLine(){speak(lines[lineIdx].t,lines[lineIdx].id)}

function start(){
  document.getElementById('startScreen').style.display='none';
  initMusic();
  if(!audioBuffers.voiceReady){
    loadVoices();var w=setInterval(function(){if(audioBuffers.voiceReady){clearInterval(w);lineIdx=0;sceneStartTime=Date.now();playLine()}},300);
  }else{lineIdx=0;sceneStartTime=Date.now();playLine()}
}

// === RENDER ===
function drawPhotoSmooth(img,t){
  if(!img)return;
  // Ken Burns: slow zoom from CENTER (not left)
  var elapsed=(t-sceneStartTime)*0.00008;
  var scale=1.05+elapsed*0.12;
  var iw=img.width,ih=img.height;
  // Calculate crop to fill screen, centered
  var ratio=Math.max(W,H)/(Math.min(iw,ih)*scale);
  var sw=iw*ratio,sh=ih*ratio;
  var sx=(iw-sw)/2,sy=(ih-sh)/2;
  // Clamp to avoid going out of bounds
  sx=Math.max(0,Math.min(iw-sw,sx));
  sy=Math.max(0,Math.min(ih-sh,sy));
  cx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
}

function render(){
  var t=Date.now();
  cx.clearRect(0,0,W,H);

  var img=photos[lineIdx];
  if(img)drawPhotoSmooth(img,t);
  else{cx.fillStyle='#0a0e14';cx.fillRect(0,0,W,H)}

  // Dark overlay
  cx.fillStyle='rgba(0,0,0,0.35)';cx.fillRect(0,0,W,H);

  // Scan line
  var scanY=(t*0.08)%H;
  cx.fillStyle='rgba(0,220,180,0.025)';cx.fillRect(0,scanY-1,W,3);

  // Floating code particles
  cx.fillStyle='rgba(0,220,180,0.12)';cx.font='8px Courier New';
  for(var i=0;i<15;i++){
    var px=(Math.sin(t*0.00025+i*1.7)*0.5+0.5)*W;
    var py=(Math.cos(t*0.00018+i*2.3)*0.5+0.5)*H;
    cx.fillText(String.fromCharCode(0x30+~~(Math.random()*74)),px,py);
  }

  // Vignette
  var vig=cx.createRadialGradient(W/2,H/2,W*0.15,W/2,H/2,W*0.65);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.55)');
  cx.fillStyle=vig;cx.fillRect(0,0,W,H);

  // Scan lines
  cx.fillStyle='rgba(0,0,0,0.025)';
  for(var y=0;y<H;y+=3)cx.fillRect(0,y,W,1);

  // Progress
  var elapsed=t-sceneStartTime;
  document.getElementById('progress').style.width=Math.min(100,elapsed/50*100)+'%';

  // HUD
  var now=new Date();
  document.getElementById('hudTime').textContent=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);

  requestAnimationFrame(render);
}
render();

setInterval(function(){
  if(speaking&&Date.now()-sceneStartTime>7000){
    speaking=false;document.getElementById('subtitle').style.display='none';nextScene();
  }
},500);
</script>
</body>
</html>

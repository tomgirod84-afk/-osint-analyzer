// Audio
var ac=null,audioBuffers={},loadingDone=false;
function initAudio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}

function loadAllVoices(){
  var loaded=0;
  lines.forEach(function(l){
    fetch('tiktok_voices/'+l.id+'.mp3')
      .then(function(r){return r.arrayBuffer()})
      .then(function(b){return ac.decodeAudioData(b)})
      .then(function(d){audioBuffers[l.id]=d;loaded++;if(loaded===lines.length){loadingDone=true;document.querySelector('#startScreen .sub').textContent='tap to start'}})
      .catch(function(){loaded++});
  });
}

function playBuffer(id,cb){
  if(!audioBuffers[id])return;
  var src=ac.createBufferSource();
  src.buffer=audioBuffers[id];
  src.playbackRate.value=1.05;
  var comp=ac.createDynamicsCompressor();
  comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=4;
  var reverb=ac.createConvolver();
  var rLen=ac.sampleRate*1.2;
  var rBuf=ac.createBuffer(2,rLen,ac.sampleRate);
  for(var ch=0;ch<2;ch++){var d=rBuf.getChannelData(ch);for(var i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,2.5)}
  reverb.buffer=rBuf;
  var dry=ac.createGain();dry.gain.value=0.85;
  var wet=ac.createGain();wet.gain.value=0.18;
  var out=ac.createGain();out.gain.value=1.1;
  src.connect(comp);comp.connect(dry);dry.connect(out);
  comp.connect(reverb);reverb.connect(wet);wet.connect(out);
  out.connect(ac.destination);
  src.onended=cb||function(){};src.start();
}

function speak(text,id){
  if(!ac)return;
  speaking=true;
  var sub=document.getElementById('subtitle');
  sub.textContent=text;sub.style.display='block';sub.style.opacity='0';
  setTimeout(function(){sub.style.opacity='1';sub.style.transition='opacity 0.3s'},50);
  playBuffer(id,function(){
    setTimeout(function(){
      speaking=false;sub.style.opacity='0';
      setTimeout(function(){sub.style.display='none';lineIdx++;if(lineIdx>=lines.length)lineIdx=0;playLine()},400);
    },300);
  });
}

function nextLine(){
  if(!speaking)return;
  speaking=false;document.getElementById('subtitle').style.display='none';
  lineIdx++;if(lineIdx>=lines.length)lineIdx=0;playLine();
}

function playLine(){speak(lines[lineIdx].t,lines[lineIdx].id)}

function start(){
  document.getElementById('startScreen').style.display='none';
  initAudio();
  if(!loadingDone){
    loadAllVoices();
    var w=setInterval(function(){if(loadingDone){clearInterval(w);lineIdx=0;playLine()}},300);
  }else{lineIdx=0;playLine()}
}

function drawScene_hacker(t){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  // Dark room with screens
  for(var i=0;i<3;i++){
    var sx=W*0.1+i*W*0.3,sy=H*0.1,sw=W*0.25,sh=H*0.35;
    cx.fillStyle='#0a0e18';cx.fillRect(sx,sy,sw,sh);
    cx.fillStyle='rgba(0,200,150,0.15)';cx.font='8px Courier New';
    for(var l=0;l<10;l++){
      var lw=15+Math.random()*40;
      cx.fillRect(sx+5,sy+5+l*12,lw,2);
    }
  }
  // Hooded figure silhouette
  cx.fillStyle='#0a0a12';
  cx.beginPath();
  cx.moveTo(W*0.35,H*0.9);
  cx.quadraticCurveTo(W*0.3,H*0.6,W*0.38,H*0.45);
  cx.quadraticCurveTo(W*0.5,H*0.35,W*0.62,H*0.45);
  cx.quadraticCurveTo(W*0.7,H*0.6,W*0.65,H*0.9);
  cx.closePath();cx.fill();
  // Eyes
  cx.fillStyle='rgba(0,220,180,0.4)';
  cx.beginPath();cx.arc(W*0.46,H*0.47,3,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(W*0.54,H*0.47,3,0,Math.PI*2);cx.fill();
  // Screen glow on figure
  var glow=cx.createRadialGradient(W/2,H*0.3,10,W/2,H*0.5,W*0.3);
  glow.addColorStop(0,'rgba(0,200,150,0.06)');glow.addColorStop(1,'transparent');
  cx.fillStyle=glow;cx.fillRect(0,0,W,H);
}

function drawScene_code(t){
  cx.fillStyle='#0a0e14';cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(0,220,180,0.25)';cx.font='9px Courier New';
  var code=['function hack(target){','  const exploit = new ZeroDay();','  const payload = encrypt(data);','  let access = null;','  while(!access){','    access = exploit.try(target);','    if(access){','      console.log("ACCESS GRANTED");','      return payload.send(access);','    }','    exploit.evolve();','  }','}','const target = scan("10.0.0.0/24");','const result = hack(target);','console.log(result);'];
  for(var i=0;i<code.length;i++){
    var scrollY=(t*0.03)%code.length;
    var idx=(i+~~scrollY)%code.length;
    cx.fillStyle=i===0?'rgba(0,220,180,0.8)':'rgba(0,220,180,0.3)';
    cx.fillText(code[idx],W*0.08,H*0.08+i*H*0.055);
  }
}

function drawScene_network(t){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  var nodes=[];
  for(var i=0;i<12;i++){
    nodes.push({x:W*0.1+Math.random()*W*0.8,y:H*0.1+Math.random()*H*0.8});
  }
  // Connections
  cx.strokeStyle='rgba(0,220,180,0.08)';cx.lineWidth=0.5;
  for(var i=0;i<nodes.length;i++){
    for(var j=i+1;j<nodes.length;j++){
      var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
      if(Math.sqrt(dx*dx+dy*dy)<250){
        cx.beginPath();cx.moveTo(nodes[i].x,nodes[i].y);cx.lineTo(nodes[j].x,nodes[j].y);cx.stroke();
      }
    }
  }
  // Nodes
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    cx.fillStyle='rgba(0,220,180,0.3)';cx.beginPath();cx.arc(n.x,n.y,4,0,Math.PI*2);cx.fill();
    // Compromised
    if(Math.sin(t*0.002+i)>0.7){
      cx.fillStyle='rgba(255,40,40,0.4)';cx.beginPath();cx.arc(n.x,n.y,8,0,Math.PI*2);cx.fill();
      cx.strokeStyle='rgba(255,40,40,0.2)';cx.lineWidth=0.5;
      cx.beginPath();cx.arc(n.x,n.y,12+Math.sin(t*0.005+i)*3,0,Math.PI*2);cx.stroke();
    }
  }
  cx.fillStyle='rgba(255,40,40,0.5)';cx.font='11px Courier New';
  cx.fillText('12/12 DEVICES COMPROMISED',W*0.15,H*0.9);
}

var sceneMap={

  social:drawScene_social,ip:drawScene_ip,passkey:drawScene_passkey,
  hacker:drawScene_hacker,code:drawScene_code,network:drawScene_network
};

function render(){
  var t=Date.now();
  cx.clearRect(0,0,W,H);

  var scene=lines[lineIdx]?lines[lineIdx].scene:'terminal';
  if(sceneMap[scene])sceneMap[scene](t);

  // Vignette
  var vig=cx.createRadialGradient(W/2,H/2,W*0.15,W/2,H/2,W*0.65);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.5)');
  cx.fillStyle=vig;cx.fillRect(0,0,W,H);

  // Scan lines
  cx.fillStyle='rgba(0,0,0,0.03)';
  for(var y=0;y<H;y+=3)cx.fillRect(0,y,W,1);

  // HUD time
  var now=new Date();
  document.getElementById('hudTime').textContent=
    ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);

  requestAnimationFrame(render);
}
render();

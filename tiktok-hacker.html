<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sentinel Compil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#subtitle{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;color:#fff;font-size:clamp(13px,4vw,20px);
  text-shadow:0 0 12px rgba(0,255,180,1),0 0 25px rgba(0,255,180,0.5),2px 2px 6px rgba(0,0,0,0.95);
  line-height:1.5;padding:10px 14px;
  background:rgba(0,0,0,0.6);border-radius:10px;display:none;font-weight:bold;
  opacity:0;transition:opacity 0.4s}
#progress{position:absolute;bottom:0;left:0;height:3px;background:rgba(0,220,180,0.6);transition:width 0.1s linear;z-index:5}
#hud-top{position:absolute;top:12px;left:12px;color:rgba(0,220,180,0.5);font-size:10px;letter-spacing:1px}
#record{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;
  color:rgba(255,40,40,0.8);font-size:10px;letter-spacing:1px}
#record .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,40,40,0.8);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.9);z-index:10;pointer-events:all;cursor:pointer}
#startScreen .icon{font-size:60px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(0,220,180,0.6));animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}}
#startScreen .txt{color:rgba(0,220,180,0.8);font-size:16px;letter-spacing:3px}
#startScreen .sub{color:rgba(255,255,255,0.3);font-size:10px;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud-top">SENTINEL // COMPIL<br><span id="hudTime"></span></div>
  <div id="record"><div class="dot"></div>LIVE</div>
  <div id="subtitle"></div>
  <div id="progress"></div>
  <div id="startScreen" onclick="start()">
    <div class="icon">&#9654;</div>
    <div class="txt">SENTINEL // COMPIL</div>
    <div class="sub">tap to start</div>
  </div>
</div>

<script>
var W,H,cx;
var c=document.getElementById('c');
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;cx=c.getContext('2d')}
resize();addEventListener('resize',resize);

var lines=[
  {id:"tk1",t:"Tu savais que 93% des mots de passe sont crackés en moins de 6 heures ?"},
  {id:"tk2",t:"Chaque caméra de surveillance autour de toi est un port d'entrée."},
  {id:"tk3",t:"Ton téléphone te track toutes les 30 secondes."},
  {id:"tk4",t:"Le WiFi public c'est comme pisser dans la piscine. Tout le monde est impacté."},
  {id:"tk5",t:"Un hacker ne casse pas la porte. Il te demande gentiment de l'ouvrir."},
  {id:"tk6",t:"Ta smart TV t'écoute même éteinte."},
  {id:"tk7",t:"98% des gens utilisent le même mot de passe partout."},
  {id:"tk8",t:"Le dark web c'est pas un autre internet. C'est le même, sans filtre."},
  {id:"tk9",t:"Un SIM swap et ton compte Instagram c'est à moi."},
  {id:"tk10",t:"Le phishing c'est pas de la magie. C'est de la psychologie."},
  {id:"tk11",t:"Ton IP c'est ton adresse postale sur internet."},
  {id:"tk12",t:"Les mots de passe c'est mort. Passe au passkey."},
  {id:"tk13",t:"Un hacker voit ce que tu ne vois pas. Les failles, les portes, les faiblesses."},
  {id:"tk14",t:"Cybersécurité c'est pas un métier. C'est un état d'esprit."},
  {id:"tk15",t:"Tout ce qui est connecté peut être compromis. Tout."}
];
var lineIdx=0,speaking=false,sceneStartTime=0;

// Photos
var photosURLs=[
  "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=900&q=80",
  "https://images.unsplash.com/photo-1557597774-9d273605dfa9?w=900&q=80",
  "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=900&q=80",
  "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=900&q=80",
  "https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=900&q=80",
  "https://images.unsplash.com/photo-1593784991095-a205069470b6?w=900&q=80",
  "https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=900&q=80",
  "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=900&q=80",
  "https://images.unsplash.com/photo-1556656793-08538906a9f8?w=900&q=80",
  "https://images.unsplash.com/photo-1577563908411-5077b6dc7624?w=900&q=80",
  "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80",
  "https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=900&q=80",
  "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=900&q=80",
  "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80",
  "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=900&q=80"
];
var photos=[];
var photosReady=false;

function loadPhotos(){
  var loaded=0;
  photosURLs.forEach(function(url,i){
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){photos[i]=img;loaded++;if(loaded===photosURLs.length)photosReady=true};
    img.onerror=function(){loaded++;if(loaded===photosURLs.length)photosReady=true};
    img.src=url;
  });
}
loadPhotos();

// === MUSIC ENGINE ===
var ac=null,musicStarted=false;
function initMusic(){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(!ac||musicStarted)return;musicStarted=true;

  // Master gain
  var master=ac.createGain();master.gain.value=0.3;master.connect(ac.destination);

  // Reverb
  var reverb=ac.createConvolver();
  var rLen=ac.sampleRate*2;var rBuf=ac.createBuffer(2,rLen,ac.sampleRate);
  for(var ch=0;ch<2;ch++){var d=rBuf.getChannelData(ch);for(var i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,3)}
  reverb.buffer=rBuf;
  var revGain=ac.createGain();revGain.gain.value=0.25;

  // Pad (dark ambient drone)
  var pad1=ac.createOscillator();pad1.type='sawtooth';pad1.frequency.value=55;
  var pad2=ac.createOscillator();pad2.type='sine';pad2.frequency.value=82.5;
  var pad3=ac.createOscillator();pad3.type='triangle';pad3.frequency.value=110;
  var padGain=ac.createGain();padGain.gain.value=0.08;
  var padFilt=ac.createBiquadFilter();padFilt.type='lowpass';padFilt.frequency.value=300;padFilt.Q.value=2;
  pad1.connect(padFilt);pad2.connect(padFilt);pad3.connect(padFilt);padFilt.connect(padGain);padGain.connect(master);

  // LFO on pad
  var lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=0.1;
  var lfoG=ac.createGain();lfoG.gain.value=15;
  lfo.connect(lfoG);lfoG.connect(pad1.frequency);

  // Bass pulse
  var bass=ac.createOscillator();bass.type='sine';bass.frequency.value=40;
  var bassGain=ac.createGain();bassGain.gain.value=0;
  bass.connect(bassGain);bassGain.connect(master);
  // Bass rhythm
  var bassInterval=60/128*4; // 128 BPM, every 4 beats
  function pulseBass(){
    if(!ac)return;
    var now=ac.currentTime;
    bassGain.gain.cancelScheduledValues(now);
    bassGain.gain.setValueAtTime(0.15,now);
    bassGain.gain.exponentialRampToValueAtTime(0.001,now+bassInterval*0.8);
    bass.frequency.setValueAtTime(40+Math.random()*20,now);
    setTimeout(pulseBass,bassInterval*1000);
  }

  // Hi-hat (noise)
  var hatLen=0.05;
  function playHat(){
    if(!ac)return;
    var buf=ac.createBuffer(1,ac.sampleRate*hatLen,ac.sampleRate);
    var data=buf.getChannelData(0);
    for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,8);
    var src=ac.createBufferSource();src.buffer=buf;
    var hFilt=ac.createBiquadFilter();hFilt.type='highpass';hFilt.frequency.value=8000;
    var hGain=ac.createGain();hGain.gain.value=0.06;
    src.connect(hFilt);hFilt.connect(hGain);hGain.connect(master);hGain.connect(reverb);
    src.start();
  }
  // Hi-hat pattern (8th notes at 128 BPM)
  var hatInterval=60/128/2*1000;
  var hatCount=0;
  function hatLoop(){
    hatCount++;
    if(hatCount%2===0)playHat(); // accent on quarter notes
    else{if(Math.random()>0.3)playHat()} // ghost notes
    setTimeout(hatLoop,hatInterval);
  }

  // Kick drum
  function playKick(){
    if(!ac)return;
    var now=ac.currentTime;
    var osc=ac.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(150,now);osc.frequency.exponentialRampToValueAtTime(30,now+0.15);
    var g=ac.createGain();g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    osc.connect(g);g.connect(master);g.connect(reverb);
    osc.start(now);osc.stop(now+0.3);
  }
  var kickInterval=60/128*1000;
  function kickLoop(){playKick();setTimeout(kickLoop,kickInterval)}

  // Pad reverb
  padGain.connect(reverb);reverb.connect(revGain);revGain.connect(master);

  // Start everything
  var now=ac.currentTime;
  pad1.start(now);pad2.start(now);pad3.start(now);lfo.start(now);bass.start(now);
  setTimeout(function(){pulseBass();kickLoop();hatLoop()},500);
}

// === AUDIO VOICE ===
var audioBuffers={voiceReady:false};
function loadVoices(){
  var loaded=0;
  lines.forEach(function(l){
    fetch('tiktok_voices/'+l.id+'.mp3')
      .then(function(r){return r.arrayBuffer()})
      .then(function(b){return ac.decodeAudioData(b)})
      .then(function(d){audioBuffers[l.id]=d;loaded++;if(loaded===lines.length)audioBuffers.voiceReady=true})
      .catch(function(){loaded++});
  });
}

function playVoice(id,cb){
  if(!audioBuffers[id])return;
  var src=ac.createBufferSource();src.buffer=audioBuffers[id];src.playbackRate.value=1.05;
  var comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  var rev=ac.createConvolver();var rL=ac.sampleRate*0.8;var rB=ac.createBuffer(1,rL,ac.sampleRate);
  var d=rB.getChannelData(0);for(var i=0;i<rL;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rL,2);
  rev.buffer=rB;
  var dry=ac.createGain();dry.gain.value=0.8;var wet=ac.createGain();wet.gain.value=0.15;
  var out=ac.createGain();out.gain.value=1.2;
  src.connect(comp);comp.connect(dry);dry.connect(out);comp.connect(rev);rev.connect(wet);wet.connect(out);out.connect(ac.destination);
  src.onended=cb||function(){};src.start();
}

function speak(text,id){
  if(!ac)return;speaking=true;
  var sub=document.getElementById('subtitle');
  sub.textContent=text;sub.style.display='block';
  setTimeout(function(){sub.style.opacity='1'},30);
  playVoice(id,function(){
    setTimeout(function(){speaking=false;sub.style.opacity='0';
      setTimeout(function(){sub.style.display='none';nextScene()},500)},400);
  });
}

function nextScene(){
  lineIdx++;if(lineIdx>=lines.length)lineIdx=0;
  sceneStartTime=Date.now();
  playLine();
}
function nextLine(){if(!speaking)return;speaking=false;document.getElementById('subtitle').style.display='none';nextScene()}
function playLine(){speak(lines[lineIdx].t,lines[lineIdx].id)}

function start(){
  document.getElementById('startScreen').style.display='none';
  initMusic();
  if(!audioBuffers.voiceReady){
    loadVoices();
    var w=setInterval(function(){if(audioBuffers.voiceReady){clearInterval(w);lineIdx=0;sceneStartTime=Date.now();playLine()}},300);
  }else{lineIdx=0;sceneStartTime=Date.now();playLine()}
}

// === RENDER ===
var glitchAmt=0,glitchTimer=0;

function drawPhotoSmooth(img,t){
  if(!img)return;
  // Ken Burns: slow zoom in
  var elapsed=(t-sceneStartTime)*0.0001;
  var scale=1+elapsed*0.15;
  var iw=img.width,ih=img.height;
  var sw=W/scale,sh=H/scale;
  var sx=(iw-sw)/2,sy=(ih-sh)/2;
  cx.drawImage(img,Math.max(0,sx),Math.max(0,sy),sw,sh,0,0,W,H);
}

function render(){
  var t=Date.now();
  cx.clearRect(0,0,W,H);

  // Photo background with Ken Burns
  var img=photos[lineIdx];
  if(img){
    drawPhotoSmooth(img,t);
  }else{
    cx.fillStyle='#0a0e14';cx.fillRect(0,0,W,H);
  }

  // Dark overlay
  cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(0,0,W,H);

  // Animated scan line
  var scanY=(t*0.08)%H;
  cx.fillStyle='rgba(0,220,180,0.03)';
  cx.fillRect(0,scanY-2,W,4);

  // Particles
  cx.fillStyle='rgba(0,220,180,0.15)';cx.font='8px Courier New';
  for(var i=0;i<20;i++){
    var px=(Math.sin(t*0.0003+i*1.7)*0.5+0.5)*W;
    var py=(Math.cos(t*0.0002+i*2.3)*0.5+0.5)*H;
    var ch=String.fromCharCode(0x30+~~(Math.random()*74));
    cx.fillText(ch,px,py);
  }

  // Glitch effect (on scene change)
  if(glitchTimer>0){
    glitchTimer-=16;glitchAmt*=0.9;
    for(var i=0;i<3;i++){
      var gy=Math.random()*H;
      cx.fillStyle='rgba(0,220,180,'+(glitchAmt*0.15)+')';cx.fillRect(0,gy,W,2+Math.random()*4);
    }
  }

  // Vignette
  var vig=cx.createRadialGradient(W/2,H/2,W*0.15,W/2,H/2,W*0.65);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.55)');
  cx.fillStyle=vig;cx.fillRect(0,0,W,H);

  // Scan lines
  cx.fillStyle='rgba(0,0,0,0.025)';
  for(var y=0;y<H;y+=3)cx.fillRect(0,y,W,1);

  // Progress bar
  var lineDur=4500;
  var elapsed=t-sceneStartTime;
  var prog=Math.min(1,elapsed/lineDur);
  document.getElementById('progress').style.width=(prog*100)+'%';

  // HUD
  var now=new Date();
  document.getElementById('hudTime').textContent=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);

  requestAnimationFrame(render);
}
render();

// Auto next line based on duration (fallback if voice ends early)
setInterval(function(){
  if(speaking&&Date.now()-sceneStartTime>6000){
    speaking=false;
    document.getElementById('subtitle').style.display='none';
    nextScene();
  }
},500);
</script>
</body>
</html>

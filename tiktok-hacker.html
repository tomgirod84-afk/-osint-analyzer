<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sentinel Compil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#subtitle{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;color:#fff;font-size:clamp(13px,4vw,20px);
  text-shadow:0 0 12px rgba(0,255,180,1),0 0 25px rgba(0,255,180,0.5),2px 2px 6px rgba(0,0,0,0.95);
  line-height:1.5;padding:10px 14px;
  background:rgba(0,0,0,0.6);border-radius:10px;display:none;font-weight:bold;
  opacity:0;transition:opacity 0.4s}
#progress{position:absolute;bottom:0;left:0;height:3px;background:rgba(0,220,180,0.6);transition:width 0.1s linear;z-index:5}
#hud-top{position:absolute;top:12px;left:12px;color:rgba(0,220,180,0.5);font-size:10px;letter-spacing:1px}
#record{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;
  color:rgba(255,40,40,0.8);font-size:10px;letter-spacing:1px}
#record .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,40,40,0.8);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.9);z-index:10;pointer-events:all;cursor:pointer}
#startScreen .icon{font-size:60px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(0,220,180,0.6));animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}}
#startScreen .txt{color:rgba(0,220,180,0.8);font-size:16px;letter-spacing:3px}
#startScreen .sub{color:rgba(255,255,255,0.3);font-size:10px;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud-top">SENTINEL // COMPIL<br><span id="hudTime"></span></div>
  <div id="record"><div class="dot"></div>LIVE</div>
  <div id="subtitle"></div>
  <div id="progress"></div>
  <div id="startScreen" onclick="start()">
    <div class="icon">&#9654;</div>
    <div class="txt">SENTINEL // COMPIL</div>
    <div class="sub">tap to start</div>
  </div>
</div>

<script>
var W,H,cx;
var c=document.getElementById('c');
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;cx=c.getContext('2d')}
resize();addEventListener('resize',resize);

var lines=[
  {id:"tk1",t:"Tu savais que 93% des mots de passe sont crackés en moins de 6 heures ?"},
  {id:"tk2",t:"Chaque caméra de surveillance autour de toi est un port d'entrée."},
  {id:"tk3",t:"Ton téléphone te track toutes les 30 secondes."},
  {id:"tk4",t:"Le WiFi public c'est comme pisser dans la piscine. Tout le monde est impacté."},
  {id:"tk5",t:"Un hacker ne casse pas la porte. Il te demande gentiment de l'ouvrir."},
  {id:"tk6",t:"Ta smart TV t'écoute même éteinte."},
  {id:"tk7",t:"98% des gens utilisent le même mot de passe partout."},
  {id:"tk8",t:"Le dark web c'est pas un autre internet. C'est le même, sans filtre."},
  {id:"tk9",t:"Un SIM swap et ton compte Instagram c'est à moi."},
  {id:"tk10",t:"Le phishing c'est pas de la magie. C'est de la psychologie."},
  {id:"tk11",t:"Ton IP c'est ton adresse postale sur internet."},
  {id:"tk12",t:"Les mots de passe c'est mort. Passe au passkey."},
  {id:"tk13",t:"Un hacker voit ce que tu ne vois pas. Les failles, les portes, les faiblesses."},
  {id:"tk14",t:"Cybersécurité c'est pas un métier. C'est un état d'esprit."},
  {id:"tk15",t:"Tout ce qui est connecté peut être compromis. Tout."}
];
var lineIdx=0,speaking=false,sceneStart=0;

// Music
var ac=null,musicStarted=false;
function initMusic(){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(!ac||musicStarted)return;musicStarted=true;
  var master=ac.createGain();master.gain.value=0.22;master.connect(ac.destination);
  var reverb=ac.createConvolver();var rL=ac.sampleRate*2;var rB=ac.createBuffer(2,rL,ac.sampleRate);
  for(var ch=0;ch<2;ch++){var d=rB.getChannelData(ch);for(var i=0;i<rL;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rL,3)}
  reverb.buffer=rB;var revG=ac.createGain();revG.gain.value=0.2;
  var pad1=ac.createOscillator();pad1.type='sawtooth';pad1.frequency.value=55;
  var pad2=ac.createOscillator();pad2.type='sine';pad2.frequency.value=82.5;
  var padG=ac.createGain();padG.gain.value=0.06;var padF=ac.createBiquadFilter();padF.type='lowpass';padF.frequency.value=250;
  pad1.connect(padF);pad2.connect(padF);padF.connect(padG);padG.connect(master);
  var lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=0.08;var lfoG=ac.createGain();lfoG.gain.value=20;lfo.connect(lfoG);lfoG.connect(pad1.frequency);
  var bass=ac.createOscillator();bass.type='sine';bass.frequency.value=40;var bassG=ac.createGain();bassG.gain.value=0;bass.connect(bassG);bassG.connect(master);
  function pulseBass(){var n=ac.currentTime;bassG.gain.cancelScheduledValues(n);bassG.gain.setValueAtTime(0.1,n);bassG.gain.exponentialRampToValueAtTime(0.001,n+0.28);setTimeout(pulseBass,60/128*4*1000)}
  function playKick(){var n=ac.currentTime;var o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(30,n+0.15);var g=ac.createGain();g.gain.setValueAtTime(0.18,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.3);o.connect(g);g.connect(master);o.start(n);o.stop(n+0.3)}
  function kickLoop(){playKick();setTimeout(kickLoop,60/128*1000)}
  function playHat(){var b=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);var d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,8);var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=8000;var g=ac.createGain();g.gain.value=0.04;s.connect(f);f.connect(g);g.connect(master);s.start()}
  var hc=0;function hatLoop(){hc++;if(hc%2===0)playHat();else if(Math.random()>0.4)playHat();setTimeout(hatLoop,60/128/2*1000)}
  padG.connect(reverb);reverb.connect(revG);revG.connect(master);
  var n=ac.currentTime;pad1.start(n);pad2.start(n);lfo.start(n);bass.start(n);
  setTimeout(function(){pulseBass();kickLoop();hatLoop()},500);
}

// Voice
var audioBuffers={voiceReady:false};
function loadVoices(){
  var loaded=0;lines.forEach(function(l){fetch('tiktok_voices/'+l.id+'.mp3').then(function(r){return r.arrayBuffer()}).then(function(b){return ac.decodeAudioData(b)}).then(function(d){audioBuffers[l.id]=d;loaded++;if(loaded===lines.length)audioBuffers.voiceReady=true}).catch(function(){loaded++})});
}
function playVoice(id,cb){
  if(!audioBuffers[id])return;var src=ac.createBufferSource();src.buffer=audioBuffers[id];src.playbackRate.value=1.0;
  var comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  var eq1=ac.createBiquadFilter();eq1.type='peaking';eq1.frequency.value=200;eq1.gain.value=3;eq1.Q.value=1;
  var eq2=ac.createBiquadFilter();eq2.type='peaking';eq2.frequency.value=400;eq2.gain.value=-2;eq2.Q.value=1;
  var eq3=ac.createBiquadFilter();eq3.type='highshelf';eq3.frequency.value=3000;eq3.gain.value=2;
  var vRev=ac.createConvolver();var vRL=ac.sampleRate;var vRB=ac.createBuffer(1,vRL,ac.sampleRate);var vD=vRB.getChannelData(0);for(var i=0;i<vRL;i++)vD[i]=(Math.random()*2-1)*Math.pow(1-i/vRL,2);vRev.buffer=vRB;
  var dry=ac.createGain();dry.gain.value=0.8;var wet=ac.createGain();wet.gain.value=0.2;var out=ac.createGain();out.gain.value=1.3;
  src.connect(comp);comp.connect(eq1);eq1.connect(eq2);eq2.connect(eq3);eq3.connect(dry);dry.connect(out);eq3.connect(vRev);vRev.connect(wet);wet.connect(out);out.connect(ac.destination);
  src.onended=cb||function(){};src.start();
}
function speak(text,id){
  if(!ac)return;speaking=true;var sub=document.getElementById('subtitle');sub.textContent=text;sub.style.display='block';
  setTimeout(function(){sub.style.opacity='1'},30);
  playVoice(id,function(){setTimeout(function(){speaking=false;sub.style.opacity='0';setTimeout(function(){sub.style.display='none';nextScene()},500)},400)});
}
function nextScene(){lineIdx++;if(lineIdx>=lines.length)lineIdx=0;sceneStart=Date.now();playLine()}
function nextLine(){if(!speaking)return;speaking=false;document.getElementById('subtitle').style.display='none';nextScene()}
function playLine(){speak(lines[lineIdx].t,lines[lineIdx].id)}
function start(){document.getElementById('startScreen').style.display='none';initMusic();if(!audioBuffers.voiceReady){loadVoices();var w=setInterval(function(){if(audioBuffers.voiceReady){clearInterval(w);lineIdx=0;sceneStart=Date.now();playLine()}},300)}else{lineIdx=0;sceneStart=Date.now();playLine()}}

// === ALL 15 ANIMATED SCENES ===

// 1: PASSWORD CRACKING - matrix rain + cracking animation
function s01(t,e){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  // Matrix columns
  for(var col=0;col<Math.floor(W/14);col++){
    var x=col*14;var speed=0.02+col*0.001;
    for(var row=0;row<25;row++){
      var y=((t*speed+row*20+col*7)%H);
      var ch=String.fromCharCode(0x30+~~(Math.random()*74));
      var a=row===0?0.9:0.1+row*0.03;
      cx.fillStyle='rgba(0,220,180,'+a+')';cx.font='12px Courier New';cx.fillText(ch,x,y);
    }
  }
  // Big cracking text
  var prog=Math.min(0.93,e/5000);
  cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(W*0.1,H*0.3,W*0.8,H*0.35);
  cx.fillStyle='rgba(255,40,40,0.9)';cx.font='bold '+Math.min(70,W*0.18)+'px Courier New';
  cx.fillText(Math.round(prog*93)+'%',W*0.12,H*0.48);
  cx.fillStyle='rgba(255,255,255,0.4)';cx.font='13px Courier New';cx.fillText('DES MOTS DE PASSE CRACKÉS',W*0.12,H*0.55);
  // Progress bar
  cx.fillStyle='rgba(255,255,255,0.08)';cx.fillRect(W*0.12,H*0.6,W*0.76,18);
  cx.fillStyle='rgba(0,220,180,0.7)';cx.fillRect(W*0.12,H*0.6,W*0.76*prog,18);
  // Flashing cracked passwords
  var pwds=['admin','password','123456','qwerty','letmein'];
  for(var i=0;i<pwds.length;i++){
    if(Math.sin(t*0.006+i)>0){
      cx.fillStyle='rgba(255,40,40,0.6)';cx.font='10px Courier New';
      cx.fillText('✗ '+pwds[i]+' CRACKÉ',W*0.12,H*0.7+i*H*0.035);
    }
  }
}

// 2: CAMERA SURVEILLANCE - multiple camera feeds switching
function s02(t,e){
  cx.fillStyle='#080a10';cx.fillRect(0,0,W,H);
  // 4 camera grid
  var grid=[[0,0],[W/2,0],[0,H/2],[W/2,H/2]];
  for(var i=0;i<4;i++){
    var gx=grid[i][0],gy=grid[i][1];
    // Feed
    cx.fillStyle=i===~~(t*0.001)%4?'#0c1020':'#0a0c14';
    cx.fillRect(gx+2,gy+2,W/2-4,H/2-4);
    // Buildings silhouette
    for(var b=0;b<5;b++){
      var bh=20+Math.sin(b*3+i)*15;
      cx.fillStyle='#141820';cx.fillRect(gx+5+b*(W/2/5),gy+H/4-bh,W/2/6,bh);
    }
    // Camera label
    cx.fillStyle='rgba(0,220,180,0.4)';cx.font='8px Courier New';
    cx.fillText('CAM-'+(1000+i*273)+' // LIVE',gx+8,gy+14);
    // Red dot
    if(i===~~(t*0.001)%4){
      cx.fillStyle='rgba(255,40,40,0.7)';cx.beginPath();cx.arc(gx+W/2-15,gy+12,3,0,Math.PI*2);cx.fill();
    }
    // Grid lines
    cx.strokeStyle='rgba(0,220,180,0.05)';cx.lineWidth=0.5;
    cx.strokeRect(gx+2,gy+2,W/2-4,H/2-4);
  }
  // Center text
  cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(W*0.25,H*0.45,W*0.5,H*0.1);
  cx.fillStyle='rgba(0,220,180,0.6)';cx.font='11px Courier New';
  cx.fillText("PORT D'ENTRÉE DÉTECTÉE",W*0.28,H*0.52);
}

// 3: PHONE TRACKING - phone with pulsing GPS
function s03(t,e){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  // Grid
  cx.strokeStyle='rgba(0,220,180,0.03)';cx.lineWidth=0.5;
  for(var gx=0;gx<W;gx+=30){cx.beginPath();cx.moveTo(gx,0);cx.lineTo(gx,H);cx.stroke()}
  for(var gy=0;gy<H;gy+=30){cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke()}
  // Phone outline
  cx.strokeStyle='rgba(0,220,180,0.15)';cx.lineWidth=1;
  cx.strokeRect(W*0.3,H*0.15,W*0.4,H*0.55);
  // Pulsing dot
  var pr=8+Math.sin(t*0.005)*4;
  cx.fillStyle='rgba(255,40,40,0.1)';cx.beginPath();cx.arc(W/2,H*0.4,pr+30,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(255,40,40,0.2)';cx.beginPath();cx.arc(W/2,H*0.4,pr+15,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(255,40,40,0.8)';cx.beginPath();cx.arc(W/2,H*0.4,8,0,Math.PI*2);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(W/2,H*0.4,3,0,Math.PI*2);cx.fill();
  // Data
  cx.fillStyle='rgba(0,220,180,0.4)';cx.font='10px Courier New';
  cx.fillText('📍 GPS: ACTIVE',W*0.33,H*0.2);
  cx.fillText('📡 BLUETOOTH: ON',W*0.33,H*0.75);
  var secs=~~((t/1000)%30);
  cx.fillStyle='rgba(255,40,40,0.5)';cx.font='11px Courier New';
  cx.fillText('Tracké il y a '+secs+'s',W*0.3,H*0.85);
}

// 4: WIFI PUBLIC - data streams being intercepted
function s04(t,e){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  // WiFi symbol
  cx.strokeStyle='rgba(0,220,180,0.3)';cx.lineWidth=2;
  for(var i=1;i<=4;i++){
    cx.beginPath();cx.arc(W/2,H*0.3,i*25,Math.PI*1.2,Math.PI*1.8);cx.stroke();
  }
  // Data streams from multiple devices
  for(var d=0;d<5;d++){
    var dx=W*0.15+d*W*0.17;
    cx.fillStyle='#0e1018';cx.fillRect(dx-8,H*0.55,16,20);
    cx.fillStyle='rgba(0,220,180,0.3)';cx.font='7px Courier New';cx.fillText('PC',dx-5,H*0.55+13);
    // Data going up (being intercepted)
    var dataY=H*0.55-((t*0.05+d*30)%H*0.3);
    cx.fillStyle='rgba(0,220,180,0.4)';cx.fillRect(dx-1,dataY,2,8);
    // Intercepted!
    if(Math.sin(t*0.003+d)>0.5){
      cx.fillStyle='rgba(255,40,40,0.4)';cx.font='7px Courier New';cx.fillText('INTERCEPTÉ',dx-15,dataY-8);
      cx.strokeStyle='rgba(255,40,40,0.2)';cx.lineWidth=0.5;
      cx.beginPath();cx.moveTo(dx,dataY);cx.lineTo(W/2,H*0.2);cx.stroke();
    }
  }
  cx.fillStyle='rgba(255,40,40,0.4)';cx.font='10px Courier New';
  cx.fillText('EVIL TWIN: FREE_WIFI_PUBLIC',W*0.2,H*0.9);
}

// 5: DOOR - knocking then opening
function s05(t,e){
  cx.fillStyle='#080a10';cx.fillRect(0,0,W,H);
  var dw=W*0.5,dh=H*0.7,dx=W*0.25,dy=H*0.15;
  // Door frame
  cx.fillStyle='#1a1814';cx.fillRect(dx-8,dy-8,dw+16,dh+8);
  // Door opening
  var openAmt=Math.min(0.5,e/4000)*0.5;
  cx.fillStyle='#14120e';
  cx.save();cx.translate(dx+dw,dy);cx.transform(1,0,-openAmt,1,0,0);cx.fillRect(-dw,0,dw,dh);cx.restore();
  // Green glow behind
  if(openAmt>0.05){
    var gg=cx.createRadialGradient(dx+dw*0.9,dy+dh/2,5,dx+dw*0.9,dy+dh/2,dw*openAmt*2);
    gg.addColorStop(0,'rgba(0,220,180,0.25)');gg.addColorStop(1,'transparent');
    cx.fillStyle=gg;cx.fillRect(dx,dy,dw,dh);
  }
  // Knocking hand (first 2 seconds)
  if(e<2000){
    var kx=dx+dw*0.3+Math.sin(e*0.02)*4;
    cx.fillStyle='rgba(255,255,255,0.12)';cx.beginPath();cx.arc(kx,dy+dh*0.4,14,0,Math.PI*2);cx.fill();
    for(var f=0;f<4;f++)cx.fillRect(kx+f*5-8,dy+dh*0.4-16,4,10);
    // Knock rings
    for(var r=0;r<3;r++){cx.strokeStyle='rgba(255,255,255,'+(0.08-r*0.02)+')';cx.lineWidth=1;cx.beginPath();cx.arc(kx,dy+dh*0.4,20+r*10,0,Math.PI*2);cx.stroke()}
  }
  // Door handle
  cx.fillStyle='#2a2418';cx.fillRect(dx+dw*0.82,dy+dh*0.45,10,5);
  cx.fillStyle='rgba(0,220,180,0.4)';cx.font='11px Courier New';
  cx.fillText("IL TE DEMANDE D'OUVRIR",W*0.15,H*0.9);
}

// 6: SMART TV - listening waves
function s06(t,e){
  cx.fillStyle='#050508';cx.fillRect(0,0,W,H);
  // TV
  var tvx=W*0.1,tvy=H*0.15,tvw=W*0.8,tvh=H*0.4;
  cx.fillStyle='#0a0a0a';cx.fillRect(tvx,tvy,tvw,tvh);
  cx.strokeStyle='rgba(255,255,255,0.03)';cx.lineWidth=1;cx.strokeRect(tvx,tvy,tvw,tvh);
  // Sound waves emanating FROM the TV
  for(var i=0;i<10;i++){
    var waveY=tvy+tvh+5+i*8;
    var waveW=tvw*0.2+Math.sin(t*0.004+i*0.6)*tvw*0.08;
    var a=0.25-i*0.02;
    cx.strokeStyle='rgba(255,40,40,'+a+')';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(W/2-waveY+waveY,waveY);cx.lineTo(W/2+waveY-waveY,waveY);cx.stroke();
  }
  // Mic icon pulsing
  var micPulse=Math.sin(t*0.005)>0;
  cx.fillStyle=micPulse?'rgba(255,40,40,0.6)':'rgba(255,40,40,0.2)';
  cx.font='24px Arial';cx.fillText('🎤',W*0.44,H*0.7);
  cx.fillStyle='rgba(255,40,40,0.4)';cx.font='10px Courier New';
  cx.fillText('MIC: TOUJOURS ACTIF',W*0.28,H*0.78);
  // Red recording dot
  if(micPulse){cx.fillStyle='rgba(255,40,40,0.8)';cx.beginPath();cx.arc(W*0.48,H*0.85,5,0,Math.PI*2);cx.fill()}
}

// 7: 98% SAME PASSWORD - sites flashing
function s07(t,e){
  cx.fillStyle='#0a0e14';cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(255,40,40,0.8)';cx.font='bold '+Math.min(65,W*0.16)+'px Courier New';
  cx.fillText('98%',W*0.1,H*0.18);
  cx.fillStyle='rgba(255,255,255,0.25)';cx.font='11px Courier New';
  cx.fillText('MÊME MOT DE PASSE PARTOUT',W*0.1,H*0.25);
  var sites=['Gmail','Facebook','Instagram','Twitter','Netflix','Amazon','GitHub','Bank'];
  for(var i=0;i<sites.length;i++){
    var sy=H*0.3+i*H*0.07;
    var active=~~(t*0.003)%sites.length===i;
    cx.fillStyle=active?'rgba(255,40,40,0.2)':'rgba(255,255,255,0.04)';
    cx.fillRect(W*0.08,sy,W*0.84,H*0.055);
    cx.fillStyle=active?'rgba(0,220,180,0.7)':'rgba(0,220,180,0.3)';cx.font='10px Courier New';
    cx.fillText(sites[i],W*0.1,sy+H*0.035);
    cx.fillStyle=active?'rgba(255,40,40,0.8)':'rgba(255,40,40,0.4)';
    cx.fillText('password123',W*0.55,sy+H*0.035);
    if(active){cx.fillStyle='rgba(255,40,40,0.7)';cx.fillText('🔓 COMPROMIS',W*0.78,sy+H*0.035)}
  }
}

// 8: DARK WEB - scrolling marketplace
function s08(t,e){
  cx.fillStyle='#050508';cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(200,50,50,0.5)';cx.font='12px Courier New';

// 14: MINDSET - brain with pulsing connections
function s14(t,e){
  cx.fillStyle='#0a0e14';cx.fillRect(0,0,W,H);
  // Neural network
  var nodes=[];
  for(var i=0;i<20;i++){
    var angle=Math.PI*2*i/20;
    var r=Math.min(W,H)*0.25;
    nodes.push({x:W/2+Math.cos(angle+Math.sin(t*0.001)*0.3)*r*(0.5+Math.sin(i*0.5)*0.5),y:H*0.4+Math.sin(angle+Math.cos(t*0.001)*0.3)*r*0.6*(0.5+Math.cos(i*0.7)*0.5)});
  }
  // Connections
  for(var i=0;i<nodes.length;i++){
    for(var j=i+1;j<nodes.length;j++){
      var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
      if(Math.sqrt(dx*dx+dy*dy)<150){
        cx.strokeStyle='rgba(0,220,180,'+(0.05+Math.sin(t*0.002+i+j)*0.03)+')';
        cx.lineWidth=0.5;cx.beginPath();cx.moveTo(nodes[i].x,nodes[i].y);cx.lineTo(nodes[j].x,nodes[j].y);cx.stroke();
      }
    }
  }
  // Nodes
  for(var i=0;i<nodes.length;i++){
    var pulse=2+Math.sin(t*0.003+i)*1;
    cx.fillStyle='rgba(0,220,180,'+(0.3+Math.sin(t*0.004+i)*0.15)+')';
    cx.beginPath();cx.arc(nodes[i].x,nodes[i].y,pulse,0,Math.PI*2);cx.fill();
  }
  // Active word
  var words=['VIGILANCE','ANALYSE','PRÉVENTION','RÉPONSE','ADAPTATION'];
  var active=~~(t*0.002)%words.length;
  cx.fillStyle='rgba(0,220,180,0.7)';cx.font='bold 16px Courier New';
  cx.fillText(words[active],W*0.3,H*0.4);
}

// 15: EVERYTHING COMPROMISED - spreading red infection
function s15(t,e){
  cx.fillStyle='#060810';cx.fillRect(0,0,W,H);
  var devs=[{x:W*0.5,y:H*0.12,n:'📱'},{x:W*0.2,y:H*0.28,n:'💻'},{x:W*0.8,y:H*0.28,n:'🖥️'},{x:W*0.12,y:H*0.5,n:'📺'},{x:W*0.5,y:H*0.45,n:'🏠'},{x:W*0.88,y:H*0.5,n:'🚗'},{x:W*0.25,y:H*0.72,n:'⌚'},{x:W*0.75,y:H*0.72,n:'🔊'},{x:W*0.5,y:H*0.85,n:'📷'}];
  var spread=e/4000;
  // Connections
  for(var i=0;i<devs.length;i++){
    for(var j=i+1;j<devs.length;j++){
      var dx=devs[i].x-devs[j].x,dy=devs[i].y-devs[j].y;
      if(Math.sqrt(dx*dx+dy*dy)<250){
        var compromised=Math.min(i,j)/devs.length<spread;
        cx.strokeStyle=compromised?'rgba(255,40,40,0.2)':'rgba(0,220,180,0.05)';
        cx.lineWidth=0.5;cx.beginPath();cx.moveTo(devs[i].x,devs[i].y);cx.lineTo(devs[j].x,devs[j].y);cx.stroke();
      }
    }
  }
  // Devices
  for(var i=0;i<devs.length;i++){
    var d=devs[i];var compromised=i/devs.length<spread;
    if(compromised){
      cx.fillStyle='rgba(255,40,40,0.15)';cx.beginPath();cx.arc(d.x,d.y,22,0,Math.PI*2);cx.fill();
      // Pulse
      var pr=22+Math.sin(t*0.005+i)*3;
      cx.strokeStyle='rgba(255,40,40,0.15)';cx.lineWidth=0.5;cx.beginPath();cx.arc(d.x,d.y,pr,0,Math.PI*2);cx.stroke();
    }
    cx.font='18px Arial';cx.fillText(d.n,d.x-9,d.y+6);
    cx.fillStyle=compromised?'rgba(255,40,40,0.6)':'rgba(0,220,180,0.2)';cx.font='7px Courier New';
    cx.fillText(compromised?'COMPROMIS':'SAFE',d.x-15,d.y+24);
  }
  var count=0;for(var i=0;i<devs.length;i++){if(i/devs.length<spread)count++}
  cx.fillStyle='rgba(255,40,40,0.5)';cx.font='bold 13px Courier New';
  cx.fillText(count+'/'+devs.length+' COMPROMIS',W*0.28,H*0.95);
}

var scenes=[s01,s02,s03,s04,s05,s06,s07,s08,s09,s10,s11,s12,s13,s14,s15];

// Glitch
var glitchAmt=0,glitchDur=0;
function drawGlitch(){
  if(Math.random()>0.97){glitchAmt=0.2+Math.random()*0.4;glitchDur=4+~~(Math.random()*8)}
  if(glitchDur>0){glitchDur--;for(var i=0;i<2;i++){var gy=Math.random()*H;cx.fillStyle='rgba(0,220,180,'+(glitchAmt*0.15)+')';cx.fillRect(0,gy,W,1+Math.random()*3)}}
}

function render(){
  var t=Date.now();
  var e=t-sceneStart;
  cx.clearRect(0,0,W,H);
  if(scenes[lineIdx])scenes[lineIdx](t,e);
  drawGlitch();
  // Vignette
  var vig=cx.createRadialGradient(W/2,H/2,W*0.15,W/2,H/2,W*0.65);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.5)');
  cx.fillStyle=vig;cx.fillRect(0,0,W,H);
  // Scan lines
  cx.fillStyle='rgba(0,0,0,0.025)';for(var y=0;y<H;y+=3)cx.fillRect(0,y,W,1);
  // Progress
  document.getElementById('progress').style.width=Math.min(100,e/50*100)+'%';
  var now=new Date();document.getElementById('hudTime').textContent=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);
  requestAnimationFrame(render);
}
render();
setInterval(function(){if(speaking&&Date.now()-sceneStart>7000){speaking=false;document.getElementById('subtitle').style.display='none';nextScene()}},500);

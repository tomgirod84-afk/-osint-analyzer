<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Sentinel Racer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace;touch-action:none;-webkit-user-select:none;user-select:none}
        canvas{display:block}
        #ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 12px;pointer-events:none;z-index:10}
        .ui-box{background:rgba(0,0,0,0.6);border:1px solid #1a2a3a;border-radius:4px;padding:3px 8px;font-size:0.65em;color:#00ff88}
        .ui-box .val{color:#fff;font-weight:700}
        @media(max-width:768px),(hover:none){
            #ui{padding:10px 15px}
            .ui-box{font-size:0.8em;padding:5px 12px;border-radius:6px}
        }
        #start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#060810 0%,#0a1530 50%,#152040 100%);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
        #start-screen h1{color:#00ff88;font-size:2em;text-shadow:0 0 20px #00ff8844;margin-bottom:5px}
        #start-screen h1 span{color:#ff3355}
        #start-screen p{color:#556688;font-size:0.8em;margin:3px 0}
        .start-btn{margin-top:18px;background:#00ff88;border:none;color:#060810;padding:12px 35px;border-radius:6px;font-family:inherit;font-size:0.9em;font-weight:700;cursor:pointer}
        .start-btn:active{transform:scale(0.95)}
        .controls-info{margin-top:12px;color:#334466;font-size:0.65em;line-height:1.8}
        .controls-info span{color:#00ff88}
        #game-over{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
        #game-over.show{display:flex}
        #game-over h1{color:#ff3355;font-size:2em;text-shadow:0 0 20px #ff335566}
        #game-over .score-display{color:#00ff88;font-size:1.8em;margin:10px 0;font-weight:900}
        #game-over p{color:#556688;font-size:0.85em}
        .mobile-btns{display:none}
        #mobile-controls{display:none;position:fixed;bottom:0;left:0;right:0;height:45%;z-index:50;pointer-events:none}
        .mobile-zone-left,.mobile-zone-right{position:absolute;top:0;bottom:0;width:35%;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
        .mobile-zone-left{left:0}
        .mobile-zone-right{right:0}
        .mobile-zone-center{position:absolute;top:0;bottom:0;left:35%;right:35%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;pointer-events:auto;touch-action:none}
        .mobile-zone-inner{width:110px;height:110px;border-radius:50%;border:3px solid rgba(0,255,136,0.4);background:rgba(0,255,136,0.08);display:flex;align-items:center;justify-content:center;font-size:2.5em;color:rgba(0,255,136,0.7);text-shadow:0 0 10px #00ff88;transition:background 0.1s}
        .mobile-zone-inner:active{background:rgba(0,255,136,0.35);border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.4)}
        .mobile-boost{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,51,85,0.4);background:rgba(255,51,85,0.08);display:flex;align-items:center;justify-content:center;font-size:2em;color:rgba(255,51,85,0.7);text-shadow:0 0 10px #ff3355;transition:background 0.1s}
        .mobile-boost:active{background:rgba(255,51,85,0.35);border-color:#ff3355;box-shadow:0 0 30px rgba(255,51,85,0.4)}
        @media(max-width:768px),(hover:none){#mobile-controls{display:flex}.controls-info{display:none}}
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>SENTINEL <span>RACER</span></h1>
        <p>Cyberpunk Futuristic Racer</p>
        <button class="start-btn" onclick="startGame()">GO</button>
        <div class="controls-info">
            <span>Q D</span> ou <span>← →</span> — Tourner<br>
            <span>ESPACE</span> — Boost
        </div>
    </div>
    <div id="ui">
        <div class="ui-box">SCORE: <span class="val" id="score">0</span></div>
        <div class="ui-box">VITESSE: <span class="val" id="speed">0</span> km/h</div>
        <div class="ui-box">BOOST: <span class="val" id="boost">100</span>%</div>
    </div>
    <div id="mobile-controls">
        <div class="mobile-zone-left" id="m-left">
            <div class="mobile-zone-inner">◀</div>
        </div>
        <div class="mobile-zone-center">
            <div class="mobile-boost" id="m-boost">⚡</div>
        </div>
        <div class="mobile-zone-right" id="m-right">
            <div class="mobile-zone-inner">▶</div>
        </div>
    </div>
    <div id="game-over">
        <h1>CRASH</h1>
        <p>Score final</p>
        <div class="score-display" id="final-score">0</div>
        <p id="final-dist"></p>
        <button class="start-btn" onclick="location.reload()">REJOUER</button>
    </div>
    <canvas id="c"></canvas>
    <script>
    const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
    let W,H;
    function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
    resize();addEventListener('resize',resize);

    let gameRunning=false,playerX=0,targetLane=0,score=0,distance=0;
    let baseSpeed=4,speed=4,boostFuel=100,boosting=false,roadOffset=0;
    let obstacles=[],particles=[],buildings=[],keys={},shake=0,combo=0,comboTimer=0;
    let touchLeft=false,touchRight=false,touchBoost=false;
    let invincible=0;

    const stars=[];
    for(let i=0;i<80;i++)stars.push({x:Math.random()*2-1,y:Math.random(),s:0.5+Math.random()*1.5,b:Math.random()});

    // Music
    let musicCtx=null,musicInterval=null;
    function startMusic(){
        try{
            musicCtx=new(window.AudioContext||window.webkitAudioContext)();
            const master=musicCtx.createGain();master.gain.value=0.2;master.connect(musicCtx.destination);
            const hatBufLen=Math.floor(musicCtx.sampleRate*0.04);
            const hatBuf=musicCtx.createBuffer(1,hatBufLen,musicCtx.sampleRate);
            const hatData=hatBuf.getChannelData(0);
            for(let i=0;i<hatBufLen;i++)hatData[i]=(Math.random()*2-1)*Math.pow(1-i/hatBufLen,10);

            const bpm=130,step=60/bpm;
            const bassPattern=[55,0,55,0,65.4,0,73.4,0];
            const leadPattern=[0,440,0,523,0,440,0,349];
            let beatIdx=0;

            function playBeat(){
                if(!musicCtx||musicCtx.state==='closed')return;
                const t=musicCtx.currentTime;
                if(beatIdx%2===0){
                    const o=musicCtx.createOscillator(),g=musicCtx.createGain();
                    o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+0.12);
                    g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
                    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.15);
                }
                const hs=musicCtx.createBufferSource();hs.buffer=hatBuf;
                const hg=musicCtx.createGain();hg.gain.value=0.06;
                const hp=musicCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
                hs.connect(hp);hp.connect(hg);hg.connect(master);hs.start(t);

                const bf=bassPattern[beatIdx%8];
                if(bf>0){
                    const o=musicCtx.createOscillator(),g=musicCtx.createGain();
                    o.type='sawtooth';o.frequency.value=bf;
                    g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+step*0.9);
                    o.connect(g);g.connect(master);o.start(t);o.stop(t+step*0.9);
                }
                const lf=leadPattern[beatIdx%8];
                if(lf>0){
                    const o=musicCtx.createOscillator(),g=musicCtx.createGain();
                    o.type='square';o.frequency.value=lf;
                    g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+step*0.7);
                    o.connect(g);g.connect(master);o.start(t);o.stop(t+step*0.7);
                }
                beatIdx++;
            }
            musicInterval=setInterval(playBeat,step*1000);
            playBeat();
        }catch(e){}
    }

    function stopMusic(){
        if(musicInterval){clearInterval(musicInterval);musicInterval=null}
        if(musicCtx){try{musicCtx.close()}catch(e){}musicCtx=null}
    }

    function resetGame(){
        playerX=0;targetLane=0;score=0;distance=0;
        baseSpeed=4;speed=4;boostFuel=100;boosting=false;
        obstacles=[];particles=[];buildings=[];combo=0;comboTimer=0;invincible=120;
        for(let i=0;i<20;i++)addBuilding(i*200);
    }

    function addBuilding(z){
        const side=Math.random()>0.5?1:-1;
        const lane=side*(3+Math.floor(Math.random()*4)*1.2);
        const w=30+Math.random()*50,h=40+Math.random()*120;
        const neon=['#00ff88','#00ccff','#ff3355','#ffaa00','#aa66ff'][Math.floor(Math.random()*5)];
        buildings.push({x:lane,z,w,h,neon});
    }

    function addObstacle(){
        const lanes=[-2.4,-1.2,1.2,2.4];
        const lane=lanes[Math.floor(Math.random()*lanes.length)];
        for(const o of obstacles){
            if(o.x===lane&&Math.abs(o.z-(distance+200))<40)return;
        }
        const type=Math.random()>0.3?'car':'truck';
        const colors=['#ff3355','#ff5500','#ffaa00','#aa66ff','#00ccff'];
        obstacles.push({x:lane,z:distance+200,w:type==='truck'?1.8:1.1,
            color:colors[Math.floor(Math.random()*colors.length)],type,passed:false});
    }

    function spawnParticles(x,y,z,color,count){
        for(let i=0;i<count;i++){
            particles.push({x:x+(Math.random()-0.5)*2,y:y+Math.random()*2,z,
                vx:(Math.random()-0.5)*3,vy:-Math.random()*2,vz:-speed-Math.random()*5,
                life:20+Math.random()*20,maxLife:40,color,size:1+Math.random()*3});
        }
    }

    function worldToScreen(wx,wy,wz){
        const z=wz-distance;if(z<=0)return null;
        const fov=250,scale=fov/z;
        return{x:W/2+(wx*100*scale),y:H*0.65+(wy*50*scale),s:scale,z:z};
    }

    function drawRoad(){
        const sky=ctx.createLinearGradient(0,0,0,H*0.65);
        sky.addColorStop(0,'#050810');sky.addColorStop(0.5,'#0a1530');sky.addColorStop(1,'#101835');
        ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.65);

        stars.forEach(s=>{
            const sx=((s.x*W+s.b*1000+roadOffset*0.1)%W+W)%W;
            ctx.globalAlpha=(0.5+Math.sin(Date.now()*0.002+s.b*10)*0.5)*0.6;
            ctx.fillStyle='#fff';ctx.fillRect(sx,s.y*H*0.5,s.s,s.s);
        });
        ctx.globalAlpha=1;

        const roadW=W*0.5,roadLeft=W/2-roadW/2;
        ctx.fillStyle='#111122';ctx.fillRect(roadLeft,H*0.65,roadW,H*0.35);
        ctx.fillStyle='#1a1a30';
        ctx.fillRect(roadLeft,H*0.65,8,H*0.35);
        ctx.fillRect(roadLeft+roadW-8,H*0.65,8,H*0.35);

        const lineLen=30,lineGap=40,totalLen=lineLen+lineGap;
        const offset=(-roadOffset%totalLen+totalLen)%totalLen;
        ctx.fillStyle='#2a3a5a';
        for(let i=-1;i<Math.ceil(H*0.35/totalLen)+2;i++){
            const y=H*0.65+i*totalLen-offset;
            if(y>H*0.65&&y<H){
                ctx.fillRect(W/2-1,y,3,lineLen);
                ctx.fillRect(W/2-roadW*0.25-1,y,2,lineLen);
                ctx.fillRect(W/2+roadW*0.25-1,y,2,lineLen);
            }
        }

        ctx.shadowBlur=12;ctx.shadowColor='#00ff88';
        ctx.strokeStyle='rgba(0,255,136,0.5)';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(roadLeft,H*0.65);ctx.lineTo(roadLeft,H);ctx.stroke();
        ctx.beginPath();ctx.moveTo(roadLeft+roadW,H*0.65);ctx.lineTo(roadLeft+roadW,H);ctx.stroke();
        ctx.shadowBlur=0;

        const sortedB=buildings.filter(b=>{const z=b.z-distance;return z>10&&z<300}).sort((a,b)=>b.z-a.z);
        sortedB.forEach(b=>{
            const p=worldToScreen(b.x,0,b.z);if(!p)return;
            const bw=b.w*p.s,bh=b.h*p.s,by=p.y-bh;
            ctx.fillStyle='#0d1020';ctx.fillRect(p.x-bw/2,by,bw,bh);
            if(p.s>0.15){
                ctx.shadowBlur=8;ctx.shadowColor=b.neon;ctx.strokeStyle=b.neon;ctx.lineWidth=1.5;ctx.globalAlpha=0.5;
                ctx.strokeRect(p.x-bw/2,by,bw,bh);ctx.globalAlpha=1;ctx.shadowBlur=0;
            }
            if(p.s>0.25){
                const cols=Math.floor(bw/9),rows=Math.floor(bh/9);
                for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
                    if(Math.sin(b.z*7+r*13+c*19)>0.1){
                        ctx.fillStyle=Math.sin(b.z+r+c)>0.7?b.neon:'rgba(255,180,50,0.3)';
                        ctx.fillRect(p.x-bw/2+c*9+2,by+r*9+2,5,5);
                    }
                }
            }
            if(b.neon&&p.s>0.2){
                ctx.shadowBlur=10;ctx.shadowColor=b.neon;ctx.strokeStyle=b.neon;ctx.lineWidth=2;
                ctx.beginPath();ctx.moveTo(p.x-bw/2,by);ctx.lineTo(p.x+bw/2,by);ctx.stroke();ctx.shadowBlur=0;
            }
        });
    }

    function drawPlayer(){
        const px=W/2+playerX*100,py=H*0.78,carW=36,carH=48;
        const isInv=invincible>0&&Math.floor(Date.now()/100)%2===0;
        if(isInv){ctx.globalAlpha=0.4}

        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();ctx.ellipse(px,py+carH/2+5,carW/2+8,10,0,0,Math.PI*2);ctx.fill();

        ctx.fillStyle='#0c1830';
        ctx.beginPath();
        ctx.moveTo(px-carW/2,py+carH/2);ctx.lineTo(px-carW/2+4,py-carH/2);
        ctx.lineTo(px+carW/2-4,py-carH/2);ctx.lineTo(px+carW/2,py+carH/2);ctx.fill();

        ctx.shadowBlur=15;ctx.shadowColor=boosting?'#ff3355':'#00ff88';
        ctx.strokeStyle=boosting?'#ff3355':'#00ff88';ctx.lineWidth=2.5;
        ctx.beginPath();
        ctx.moveTo(px-carW/2,py+carH/2);ctx.lineTo(px-carW/2+4,py-carH/2);
        ctx.lineTo(px+carW/2-4,py-carH/2);ctx.lineTo(px+carW/2,py+carH/2);
        ctx.closePath();ctx.stroke();ctx.shadowBlur=0;

        ctx.fillStyle='rgba(0,200,255,0.3)';ctx.fillRect(px-12,py-carH/2+6,24,12);

        ctx.shadowBlur=8;ctx.shadowColor='#ff3355';ctx.fillStyle='#ff3355';
        ctx.fillRect(px-carW/2+2,py+carH/2-5,8,4);
        ctx.fillRect(px+carW/2-10,py+carH/2-5,8,4);ctx.shadowBlur=0;

        if(boosting){
            const flameH=15+Math.random()*20;
            const grad=ctx.createLinearGradient(px,py+carH/2,px,py+carH/2+flameH);
            grad.addColorStop(0,'#ffaa00');grad.addColorStop(0.4,'#ff5500');grad.addColorStop(1,'transparent');
            ctx.fillStyle=grad;ctx.beginPath();
            ctx.moveTo(px-10,py+carH/2);ctx.lineTo(px+10,py+carH/2);
            ctx.lineTo(px+Math.random()*6-3,py+carH/2+flameH);ctx.lineTo(px-Math.random()*6+3,py+carH/2+flameH);
            ctx.fill();
        }
        ctx.globalAlpha=1;
        if(Math.random()>0.3)spawnParticles(playerX,1,distance,boosting?'#ff5500':'#556688',1);
    }

    function drawObstacles(){
        const sorted=obstacles.filter(o=>{const z=o.z-distance;return z>5&&z<250}).sort((a,b)=>b.z-a.z);
        sorted.forEach(o=>{
            const p=worldToScreen(o.x,0,o.z);if(!p)return;
            const ow=o.w*120*p.s,oh=1.5*40*p.s;
            ctx.shadowBlur=12;ctx.shadowColor=o.color;ctx.fillStyle=o.color;
            if(o.type==='truck'){
                ctx.fillRect(p.x-ow/2,p.y-oh/2,ow,oh);
                ctx.fillStyle='rgba(255,255,255,0.15)';
                ctx.fillRect(p.x-ow/2+3,p.y-oh/2+3,ow-6,oh*0.2);
            }else{
                ctx.fillRect(p.x-ow/2,p.y-oh/2,ow,oh);
                ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(p.x-ow/2+2,p.y-oh/2+2,ow-4,oh*0.3);
                ctx.fillStyle='#ffcc00';ctx.shadowBlur=6;ctx.shadowColor='#ffcc00';
                ctx.fillRect(p.x-ow/2+2,p.y+oh/2-4,5,4);
                ctx.fillRect(p.x+ow/2-7,p.y+oh/2-4,5,4);
            }
            ctx.shadowBlur=0;
        });
    }

    function drawParticles(){
        particles.forEach(pt=>{
            const p=worldToScreen(pt.x,pt.y,pt.z);if(!p)return;
            ctx.globalAlpha=pt.life/pt.maxLife;ctx.fillStyle=pt.color;
            const sz=pt.size*p.s;ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);
        });
        ctx.globalAlpha=1;
    }

    function update(){
        if(!gameRunning)return;

        let moveDir=0;
        if(keys['KeyA']||keys['KeyQ']||keys['ArrowLeft']||touchLeft)moveDir=-1;
        if(keys['KeyD']||keys['ArrowRight']||touchRight)moveDir=1;

        if((keys['Space']||touchBoost)&&boostFuel>0){
            boosting=true;boostFuel=Math.max(0,boostFuel-0.5);speed=baseSpeed*1.8;
        }else{
            boosting=false;speed=baseSpeed;boostFuel=Math.min(100,boostFuel+0.1);
        }

        if(moveDir!==0)targetLane+=moveDir*0.25;
        targetLane=Math.max(-2.8,Math.min(2.8,targetLane));
        playerX+=(targetLane-playerX)*0.2;

        baseSpeed+=0.0005;
        distance+=speed;
        score+=Math.floor(speed);
        comboTimer--;if(comboTimer<=0)combo=0;
        roadOffset+=speed*3;
        if(invincible>0)invincible--;

        if(Math.random()<0.02+baseSpeed*0.002)addObstacle();
        if(buildings.length<30)addBuilding(distance+300);
        buildings=buildings.filter(b=>b.z-distance>-50);

        for(let i=particles.length-1;i>=0;i--){
            const pt=particles[i];
            pt.x+=pt.vx*0.02;pt.y+=pt.vy*0.02;pt.z+=pt.vz;pt.life--;
            if(pt.life<=0)particles.splice(i,1);
        }

        if(invincible<=0){
            for(const o of obstacles){
                if(o.passed)continue;
                const dz=o.z-distance;
                if(dz>50)continue;
                if(dz<-8){
                    o.passed=true;combo++;comboTimer=60;score+=combo*50;continue;
                }
                const dx=Math.abs(o.x-playerX);
                const hitW=o.w*0.35+0.3;
                if(dz>=0&&dz<3.5&&dx<hitW){
                    gameRunning=false;shake=20;
                    spawnParticles(playerX,1,distance,'#ff3355',30);
                    spawnParticles(playerX,1,distance,'#ffaa00',20);
                    stopMusic();
                    setTimeout(()=>{
                        document.getElementById('game-over').classList.add('show');
                        document.getElementById('final-score').textContent=score;
                        document.getElementById('final-dist').textContent=`Distance: ${(distance/100).toFixed(0)}m`;
                    },800);
                    return;
                }
            }
        }

        document.getElementById('score').textContent=score;
        document.getElementById('speed').textContent=Math.floor(speed*30);
        document.getElementById('boost').textContent=Math.floor(boostFuel);
    }

    function draw(){
        ctx.clearRect(0,0,W,H);
        ctx.save();
        if(shake>0){
            ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
            shake*=0.8;if(shake<0.5)shake=0;
        }
        drawRoad();drawObstacles();drawParticles();
        if(gameRunning)drawPlayer();

        if(combo>1&&comboTimer>0){
            ctx.globalAlpha=comboTimer/60;ctx.fillStyle='#ffaa00';
            ctx.font=`bold ${20+combo*2}px JetBrains Mono`;ctx.textAlign='center';
            ctx.fillText(`COMBO x${combo}`,W/2,H*0.3);
            ctx.font='12px JetBrains Mono';ctx.fillStyle='#ffaa0088';
            ctx.fillText(`+${combo*50}`,W/2,H*0.3+25);ctx.textAlign='left';ctx.globalAlpha=1;
        }

        const barW=120,barH=6,barX=W/2-barW/2,barY=H*0.72;
        ctx.fillStyle='#111';ctx.fillRect(barX,barY,barW,barH);
        ctx.fillStyle=boosting?'#ff3355':'#00ff88';ctx.fillRect(barX,barY,barW*(boostFuel/100),barH);
        ctx.strokeStyle='#1a2a3a';ctx.strokeRect(barX,barY,barW,barH);
        ctx.restore();
        requestAnimationFrame(draw);
    }

    function gameLoop(){update();if(gameRunning)requestAnimationFrame(gameLoop)}

    function startGame(){
        document.getElementById('start-screen').style.display='none';
        gameRunning=true;resetGame();startMusic();
        document.getElementById('score').textContent='0';
        document.getElementById('speed').textContent='0';
        document.getElementById('boost').textContent='100';
        requestAnimationFrame(gameLoop);
    }

    addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
    addEventListener('keyup',e=>keys[e.code]=false);

    const mLeft=document.getElementById('m-left'),mRight=document.getElementById('m-right'),mBoost=document.getElementById('m-boost');
    function addTouch(el,onStart,onEnd){
        el.addEventListener('touchstart',e=>{e.preventDefault();onStart()},{passive:false});
        el.addEventListener('touchend',e=>{e.preventDefault();onEnd()},{passive:false});
        el.addEventListener('touchcancel',()=>onEnd());
    }
    addTouch(mLeft,()=>touchLeft=true,()=>touchLeft=false);
    addTouch(mRight,()=>touchRight=true,()=>touchRight=false);
    addTouch(mBoost,()=>touchBoost=true,()=>touchBoost=false);

    let touchStartX=0;
    canvas.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
    canvas.addEventListener('touchmove',e=>{
        const dx=e.touches[0].clientX-touchStartX;
        touchLeft=dx<-20;touchRight=dx>20;
    },{passive:true});
    canvas.addEventListener('touchend',()=>{touchLeft=false;touchRight=false});

    // Disable scroll/zoom on mobile
    document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

    draw();
    </script>
</body>
</html>
